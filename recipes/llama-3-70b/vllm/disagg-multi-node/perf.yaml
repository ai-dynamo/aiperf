# AIPerfJob CR: Llama-3.3-70B-Instruct-FP8-dynamic (vLLM, multi-node disaggregated)
apiVersion: aiperf.nvidia.com/v1alpha1
kind: AIPerfJob
metadata:
  name: llama3-70b-disagg-mn-perf
spec:
  # image: nvcr.io/nvidia/aiperf:latest
  connectionsPerWorker: 200
  benchmark:
    variables:
      concurrency_per_gpu: 16
      deployment_gpu_count: 16
      total_concurrency: "{{ concurrency_per_gpu * deployment_gpu_count }}"
      isl: 8192
      osl: 1024

    random_seed: 100
    models:
      - RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
    tokenizer:
      name: /root/.cache/huggingface/hub/models--RedHatAI--Llama-3.3-70B-Instruct-FP8-dynamic/snapshots/ddb4128556dfcff99e0c41aee159ea6c3e655dcd
    endpoint:
      urls:
        - http://llama3-70b-disagg-mn-frontend:8000
      type: chat
      path: /v1/chat/completions
      streaming: true
      headers:
        Authorization: "Bearer NOT USED"
        Accept: "text/event-stream"
      extra:
        max_tokens: "{{ osl }}"
        min_tokens: "{{ osl }}"
        ignore_eos: true
        repetition_penalty: 1.0
        temperature: 0.0
        nvext:
          ignore_eos: true
    datasets:
      main:
        type: synthetic
        entries: 12800
        prompts:
          isl: {mean: "{{ isl }}", stddev: 0}
          osl: {mean: "{{ osl }}", stddev: 0}
    phases:
      - name: warmup
        type: concurrency
        concurrency: "{{ total_concurrency }}"
        requests: "{{ total_concurrency }}"
        exclude_from_results: true
      - name: profiling
        type: concurrency
        concurrency: "{{ total_concurrency }}"
        requests: "{{ total_concurrency * 10 }}"
        seamless: true
    runtime:
      ui: simple
      record_processors: 32
  podTemplate:
    imagePullSecrets:
      - nvcrimagepullsecret
    env:
      - name: AIPERF_HTTP_CONNECTION_LIMIT
        value: "200"
      - name: HF_HOME
        value: /root/.cache/huggingface
      - name: TRANSFORMERS_OFFLINE
        value: "1"
    volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache
    volumeMounts:
      - name: model-cache
        mountPath: /root/.cache/huggingface
