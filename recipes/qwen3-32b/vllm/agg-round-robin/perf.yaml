#
# AIPerfJob CR: Qwen3-32B (vLLM, aggregated w/ round-robin)
# Mooncake trace replay with goodput SLOs (TTFT <= 2s, ITL <= 25ms).
#
# Trace file must be staged on the model-cache PVC at:
#   /perf-cache/traces/conversation_trace.jsonl
# Download from: https://raw.githubusercontent.com/kvcache-ai/Mooncake/main/FAST25-release/traces/conversation_trace.jsonl
apiVersion: aiperf.nvidia.com/v1alpha1
kind: AIPerfJob
metadata:
  name: agg-8xtp2-benchmark
spec:
  # image: nvcr.io/nvidia/aiperf:latest
  benchmark:
    models:
      - Qwen/Qwen3-32B
    endpoint:
      urls:
        - http://agg-8xtp2-frontend:8000
      streaming: true
    datasets:
      main:
        type: file
        path: /perf-cache/traces/conversation_trace.jsonl
        format: mooncake_trace
    phases:
      replay:
        type: fixed_schedule
        auto_offset: true
    slos:
      time_to_first_token: 2000
      inter_token_latency: 25
  podTemplate:
    env:
      - name: TRANSFORMERS_OFFLINE
        value: "1"
    volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache
      - name: perf-cache
        persistentVolumeClaim:
          claimName: perf-cache
    volumeMounts:
      - name: model-cache
        mountPath: /root/.cache/huggingface
      - name: perf-cache
        mountPath: /perf-cache
