#
# AIPerfJob CR: Kimi-K2.5 NVIDIA variant (TRT-LLM, aggregated)
# Mirrors recipes/kimi-k2.5/trtllm/agg/nvidia/deploy.yaml: TP=8, EP=8, KV-aware
# routing on the frontend, nvidia/Kimi-K2.5-NVFP4 (text-only on current TRT-LLM).
apiVersion: aiperf.nvidia.com/v1alpha1
kind: AIPerfJob
metadata:
  name: kimi-k25-nvidia-bench
spec:
  # image: nvcr.io/nvidia/aiperf:latest
  connectionsPerWorker: 252
  benchmark:
    variables:
      concurrency_per_gpu: 30
      deployment_gpu_count: 8
      total_concurrency: "{{ concurrency_per_gpu * deployment_gpu_count }}"
      isl: 1024
      osl: 1024

    random_seed: 100
    models:
      - nvidia/Kimi-K2.5-NVFP4
    tokenizer:
      name: nvidia/Kimi-K2.5-NVFP4
    endpoint:
      urls:
        - http://kimi-k25-agg-frontend:8000
      type: chat
      path: /v1/chat/completions
      streaming: true
      headers:
        Authorization: "Bearer NOT USED"
        Accept: "text/event-stream"
      extra:
        max_tokens: "{{ osl }}"
        min_tokens: "{{ osl }}"
        ignore_eos: true
        nvext:
          ignore_eos: true
        repetition_penalty: 1.0
        temperature: 0.0
    datasets:
      - name: main
        type: synthetic
        entries: 12800
        prompts:
          isl: {mean: "{{ isl }}", stddev: 0}
          osl: {mean: "{{ osl }}", stddev: 0}
    phases:
      - name: warmup
        type: concurrency
        concurrency: "{{ total_concurrency }}"
        requests: "{{ total_concurrency }}"
        exclude_from_results: true
      - name: profiling
        type: concurrency
        concurrency: "{{ total_concurrency }}"
        requests: "{{ total_concurrency * 10 }}"
        seamless: true
    runtime:
      ui: simple
      record_processors: 32
  podTemplate:
    imagePullSecrets:
      - nvcrimagepullsecret
    env:
      - name: AIPERF_HTTP_CONNECTION_LIMIT
        value: "252"
      - name: HF_HOME
        value: /model-cache
      - name: HF_HUB_OFFLINE
        value: "1"
      - name: TRANSFORMERS_OFFLINE
        value: "1"
    volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache
    volumeMounts:
      - name: model-cache
        mountPath: /model-cache
