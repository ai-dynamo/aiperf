# AIPerfJob CR: Qwen3-235B-A22B-FP8 (TRT-LLM, disaggregated)
apiVersion: aiperf.nvidia.com/v1alpha1
kind: AIPerfJob
metadata:
  name: qwen3-235b-a22b-disagg-bench
spec:
  # image: nvcr.io/nvidia/aiperf:latest
  connectionsPerWorker: 200
  benchmark:
    variables:
      concurrency_per_gpu: 2
      deployment_gpu_count: 16
      total_concurrency: "{{ concurrency_per_gpu * deployment_gpu_count }}"
      isl: 4000
      osl: 200

    random_seed: 100
    models:
      - Qwen/Qwen3-235B-A22B-FP8
    tokenizer:
      name: Qwen/Qwen3-235B-A22B-FP8
    endpoint:
      urls:
        - http://qwen3-235b-a22b-disagg-frontend:8000
      type: chat
      path: /v1/chat/completions
      streaming: true
      headers:
        Authorization: "Bearer NOT USED"
        Accept: "text/event-stream"
      extra:
        max_tokens: "{{ osl }}"
        min_tokens: "{{ osl }}"
        ignore_eos: true
        nvext:
          ignore_eos: true
        repetition_penalty: 1.0
        temperature: 0.0
    datasets:
      main:
        type: synthetic
        entries: 12800
        prompts:
          isl: {mean: "{{ isl }}", stddev: 0}
          osl: {mean: "{{ osl }}", stddev: 0}
    phases:
      warmup:
        type: concurrency
        concurrency: "{{ total_concurrency }}"
        requests: "{{ total_concurrency }}"
        exclude_from_results: true
      profiling:
        type: concurrency
        concurrency: "{{ total_concurrency }}"
        requests: "{{ total_concurrency * 10 }}"
        seamless: true
    runtime:
      ui: simple
      record_processors: 32
  podTemplate:
    imagePullSecrets:
      - nvcrimagepullsecret
    env:
      - name: AIPERF_HTTP_CONNECTION_LIMIT
        value: "200"
      - name: HF_HOME
        value: /model-cache
      - name: TRANSFORMERS_OFFLINE
        value: "1"
    volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache
    volumeMounts:
      - name: model-cache
        mountPath: /model-cache
