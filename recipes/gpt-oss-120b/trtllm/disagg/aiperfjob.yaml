apiVersion: aiperf.nvidia.com/v1alpha1
kind: AIPerfJob
metadata:
  name: gpt-oss-120b-disagg-bench
spec:
  benchmark:
    model: openai/gpt-oss-120b
    endpoint:
      url: http://gpt-oss-disagg-frontend:8000
      type: chat
      path: /v1/chat/completions
      streaming: true
      extra:
        max_tokens: 1024
        min_tokens: 1024
        ignore_eos: true
        repetition_penalty: 1.0
        temperature: 0.0
        nvext:
          ignore_eos: true
      headers:
        Authorization: Bearer NOT USED
        Accept: text/event-stream
    tokenizer:
      name: /model-cache/hub/models--openai--gpt-oss-120b/snapshots/b5c939de8f754692c1647ca79fbf85e8c1e70f8a
    dataset:
      type: synthetic
      entries: 12800
      isl: 8192
      osl: 1024
    warmup:
      type: concurrency
      concurrency: 1536
      requests: 1536
    profiling:
      type: concurrency
      concurrency: 1536
      requests: 15360
    randomSeed: 100
  podTemplate:
    imagePullSecrets:
      - nvcrimagepullsecret
    env:
      - name: AIPERF_HTTP_CONNECTION_LIMIT
        value: "252"
    volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache
    volumeMounts:
      - name: model-cache
        mountPath: /model-cache
