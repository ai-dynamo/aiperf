<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1350" viewBox="0 0 1280 1350"
     role="img" aria-labelledby="title desc">
  <title id="title">Exactly-once AIPerfJob completion</title>
  <desc id="desc">An eight-step sequence across four lanes. The controller pod signals completion through an annotation, the API server delivers the watch event, and the operator claims completion with an atomic JSON patch. Only the claim winner downloads the result files, writes and validates them on the results volume, publishes the run, finalizes the AIPerfJob status, and releases the controller.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/>
    </marker>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #1f2937; }
      .subtitle { font: 500 17px system-ui, sans-serif; fill: #4b5563; }
      .column { font: 700 21px system-ui, sans-serif; }
      .node-title { font: 700 17px system-ui, sans-serif; fill: #111827; }
      .node-text { font: 500 15px system-ui, sans-serif; fill: #374151; }
      .step { font: 700 16px system-ui, sans-serif; fill: white; }
      .edge-label { font: 600 15px system-ui, sans-serif; fill: #374151; }
      .note { font: 600 15px system-ui, sans-serif; fill: #475569; }
      .edge { fill: none; stroke-width: 3; }
      .life { stroke: #cbd5e1; stroke-width: 3; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect width="1280" height="1350" rx="24" fill="#f8fafc"/>
  <text x="640" y="52" text-anchor="middle" class="title">Exactly-once AIPerfJob completion</text>
  <text x="640" y="82" text-anchor="middle" class="subtitle">The controller signals; an atomic claim on the API server picks the single operator path that harvests</text>

  <!-- Lanes -->
  <rect x="40" y="115" width="280" height="1150" rx="20" fill="#eff6ff" stroke="#64B5F6" stroke-width="2"/>
  <rect x="345" y="115" width="280" height="1150" rx="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <rect x="650" y="115" width="280" height="1150" rx="20" fill="#ecfdf5" stroke="#81C784" stroke-width="2"/>
  <rect x="955" y="115" width="280" height="1150" rx="20" fill="#fff7ed" stroke="#FDBA74" stroke-width="2"/>

  <text x="180" y="155" text-anchor="middle" class="column" fill="#1565C0">Controller pod</text>
  <text x="485" y="155" text-anchor="middle" class="column" fill="#475569">Kubernetes API server</text>
  <text x="790" y="155" text-anchor="middle" class="column" fill="#2E7D32">Operator</text>
  <text x="1095" y="155" text-anchor="middle" class="column" fill="#B45309">Results volume</text>

  <line x1="180" y1="180" x2="180" y2="1235" class="life"/>
  <line x1="485" y1="180" x2="485" y2="1235" class="life"/>
  <line x1="790" y1="180" x2="790" y2="1235" class="life"/>
  <line x1="1095" y1="180" x2="1095" y2="1235" class="life"/>

  <!-- Step 1: controller signals -->

  <rect x="80" y="190" width="200" height="70" rx="13" fill="#dbeafe" stroke="#1565C0" stroke-width="2"/>
  <text x="180" y="219" text-anchor="middle" class="node-title">Signal completion</text>
  <text x="180" y="243" text-anchor="middle" class="node-text">Exports finished</text>
  <path d="M280 225 H470" class="edge" stroke="#1565C0" marker-end="url(#arrow-blue)"/>
  <text x="377" y="211" text-anchor="middle" class="edge-label">annotate, UID-tested</text>

  <!-- Step 2: API server delivers the watch event -->

  <rect x="385" y="300" width="200" height="70" rx="13" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="485" y="329" text-anchor="middle" class="node-title">Deliver watch event</text>
  <text x="485" y="353" text-anchor="middle" class="node-text">benchmark-complete</text>
  <path d="M585 335 H775" class="edge" stroke="#475569" marker-end="url(#arrow-slate)"/>
  <text x="680" y="321" text-anchor="middle" class="edge-label">watch event</text>

  <!-- Step 3: operator claims -->

  <rect x="690" y="410" width="200" height="92" rx="13" fill="#dcfce7" stroke="#2E7D32" stroke-width="2"/>
  <text x="790" y="440" text-anchor="middle" class="node-title">Claim completion</text>
  <text x="790" y="464" text-anchor="middle" class="node-text">Atomic JSON patch</text>
  <text x="790" y="486" text-anchor="middle" class="node-text">tests UID + version</text>
  <path d="M690 456 H500" class="edge" stroke="#2E7D32" marker-end="url(#arrow-green)"/>
  <text x="597" y="442" text-anchor="middle" class="edge-label">completion-claimed</text>

  <!-- Losing path: dashed note, no further steps -->
  <rect x="370" y="530" width="230" height="74" rx="13" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="485" y="561" text-anchor="middle" class="note">409 if already claimed</text>
  <text x="485" y="585" text-anchor="middle" class="node-text">The loser stops here</text>

  <!-- Step 4: download results -->

  <rect x="690" y="630" width="200" height="92" rx="13" fill="#dcfce7" stroke="#2E7D32" stroke-width="2"/>
  <text x="790" y="660" text-anchor="middle" class="node-title">Download results</text>
  <text x="790" y="684" text-anchor="middle" class="node-text">Metrics and files</text>
  <text x="790" y="706" text-anchor="middle" class="node-text">API port, then sidecar</text>
  <path d="M195 676 H686" class="edge" stroke="#1565C0" marker-end="url(#arrow-blue)"/>
  <text x="332" y="662" text-anchor="middle" class="edge-label">result files over HTTP</text>

  <!-- Step 5: write and validate -->

  <rect x="690" y="760" width="200" height="92" rx="13" fill="#dcfce7" stroke="#2E7D32" stroke-width="2"/>
  <text x="790" y="790" text-anchor="middle" class="node-title">Write and validate</text>
  <text x="790" y="814" text-anchor="middle" class="node-text">Atomic file writes</text>
  <text x="790" y="836" text-anchor="middle" class="node-text">Key exports, error rate</text>
  <path d="M890 806 H1080" class="edge" stroke="#2E7D32" marker-end="url(#arrow-green)"/>
  <text x="985" y="792" text-anchor="middle" class="edge-label">result files</text>

  <!-- Step 6: publish on the volume -->

  <rect x="995" y="890" width="200" height="92" rx="13" fill="#ffedd5" stroke="#B45309" stroke-width="2"/>
  <text x="1095" y="920" text-anchor="middle" class="node-title">Publish the run</text>
  <text x="1095" y="944" text-anchor="middle" class="node-text">Ready marker, latest</text>
  <text x="1095" y="966" text-anchor="middle" class="node-text">pointer, index row</text>
  <path d="M805 936 H975" class="edge" stroke="#2E7D32" marker-end="url(#arrow-green)"/>
  <text x="890" y="922" text-anchor="middle" class="edge-label">in order</text>

  <!-- Step 7: finalize status -->

  <rect x="690" y="1020" width="200" height="92" rx="13" fill="#dcfce7" stroke="#2E7D32" stroke-width="2"/>
  <text x="790" y="1050" text-anchor="middle" class="node-title">Finalize the job</text>
  <text x="790" y="1074" text-anchor="middle" class="node-text">Delete JobSet on success</text>
  <text x="790" y="1096" text-anchor="middle" class="node-text">Phase, ResultsAvailable</text>
  <path d="M690 1066 H500" class="edge" stroke="#2E7D32" marker-end="url(#arrow-green)"/>
  <text x="587" y="1052" text-anchor="middle" class="edge-label">status patch</text>

  <!-- Step 8: release the controller -->

  <rect x="690" y="1150" width="200" height="70" rx="13" fill="#dcfce7" stroke="#2E7D32" stroke-width="2"/>
  <text x="790" y="1179" text-anchor="middle" class="node-title">Release controller</text>
  <text x="790" y="1203" text-anchor="middle" class="node-text">Best-effort shutdown</text>
  <path d="M690 1185 H195" class="edge" stroke="#2E7D32" marker-end="url(#arrow-green)"/>
  <text x="332" y="1171" text-anchor="middle" class="edge-label">shutdown request</text>

  <!-- Step badges sit on top of their nodes -->
  <circle cx="84" cy="194" r="18" fill="#1565C0"/><text x="84" y="200" text-anchor="middle" class="step">1</text>
  <circle cx="389" cy="304" r="18" fill="#475569"/><text x="389" y="310" text-anchor="middle" class="step">2</text>
  <circle cx="694" cy="414" r="18" fill="#2E7D32"/><text x="694" y="420" text-anchor="middle" class="step">3</text>
  <circle cx="694" cy="634" r="18" fill="#2E7D32"/><text x="694" y="640" text-anchor="middle" class="step">4</text>
  <circle cx="694" cy="764" r="18" fill="#2E7D32"/><text x="694" y="770" text-anchor="middle" class="step">5</text>
  <circle cx="999" cy="894" r="18" fill="#B45309"/><text x="999" y="900" text-anchor="middle" class="step">6</text>
  <circle cx="694" cy="1024" r="18" fill="#2E7D32"/><text x="694" y="1030" text-anchor="middle" class="step">7</text>
  <circle cx="694" cy="1154" r="18" fill="#2E7D32"/><text x="694" y="1160" text-anchor="middle" class="step">8</text>

  <rect x="90" y="1285" width="1100" height="42" rx="12" fill="#ffffff" stroke="#9E9E9E" stroke-width="2"/>
  <text x="640" y="1312" text-anchor="middle" class="node-text">The claim, not timing, decides who harvests - restarts and recovery paths cannot publish twice</text>
</svg>
