<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1050" viewBox="0 0 1280 1050"
     role="img" aria-labelledby="title desc">
  <title id="title">Benchmark progress reporting</title>
  <desc id="desc">Three lanes: controller pod, Kubernetes API server, and operator. In loop A, every heartbeat interval of 10 seconds or on a state change, the controller patches a UID-tested heartbeat annotation and pushes status with system state, progress, live metrics, and workers. The API server delivers the system-state change to the operator as a watch event, and the operator patches the phase forward to Initializing or Running. In loop B, every JobSet patch interval of 10 seconds and only when values change, the controller patches progress annotations onto the JobSet and mirrors them onto the AIPerfJob. The operator never polls for progress.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/>
    </marker>
    <style>
      .title { font: 700 30px system-ui, sans-serif; fill: #1f2937; }
      .subtitle { font: 500 17px system-ui, sans-serif; fill: #4b5563; }
      .column { font: 700 21px system-ui, sans-serif; }
      .band { font: 700 16px system-ui, sans-serif; fill: #1565C0; }
      .node-title { font: 700 17px system-ui, sans-serif; fill: #111827; }
      .node-text { font: 500 15px system-ui, sans-serif; fill: #374151; }
      .step { font: 700 16px system-ui, sans-serif; fill: white; }
      .edge-label { font: 600 15px system-ui, sans-serif; fill: #374151; }
      .note { font: 600 15px system-ui, sans-serif; fill: #475569; }
      .edge { fill: none; stroke-width: 3; }
      .life { stroke: #cbd5e1; stroke-width: 3; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect width="1280" height="1050" rx="24" fill="#f8fafc"/>
  <text x="640" y="52" text-anchor="middle" class="title">Benchmark progress reporting</text>
  <text x="640" y="82" text-anchor="middle" class="subtitle">The controller pushes progress onto the API server; the operator only reacts to watch events and never polls</text>

  <!-- Lanes -->
  <rect x="40" y="115" width="360" height="845" rx="20" fill="#eff6ff" stroke="#64B5F6" stroke-width="2"/>
  <rect x="460" y="115" width="360" height="845" rx="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <rect x="880" y="115" width="360" height="845" rx="20" fill="#ecfdf5" stroke="#81C784" stroke-width="2"/>

  <text x="220" y="155" text-anchor="middle" class="column" fill="#1565C0">Controller pod</text>
  <text x="640" y="155" text-anchor="middle" class="column" fill="#475569">Kubernetes API server</text>
  <text x="1060" y="155" text-anchor="middle" class="column" fill="#2E7D32">Operator</text>

  <!-- Loop bands -->
  <rect x="58" y="175" width="1164" height="252" rx="16" fill="#ffffff" fill-opacity="0.55" stroke="#1565C0" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="80" y="203" class="band">Loop A: every heartbeat interval (10 s), or at once on a state change</text>

  <rect x="58" y="700" width="1164" height="235" rx="16" fill="#ffffff" fill-opacity="0.55" stroke="#1565C0" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="80" y="728" class="band">Loop B: every JobSet patch interval (10 s), only when a value changes</text>

  <!-- Loop A, row 1: heartbeat -->
  <rect x="100" y="225" width="240" height="70" rx="13" fill="#dbeafe" stroke="#1565C0" stroke-width="2"/>
  <text x="220" y="254" text-anchor="middle" class="node-title">Patch heartbeat</text>
  <text x="220" y="278" text-anchor="middle" class="node-text">Timestamp annotation</text>
  <path d="M340 260 H516" class="edge" stroke="#1565C0" marker-end="url(#arrow-blue)"/>
  <text x="430" y="246" text-anchor="middle" class="edge-label">UID-tested patch</text>
  <rect x="520" y="225" width="240" height="70" rx="13" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="640" y="254" text-anchor="middle" class="node-title">Heartbeat annotation</text>
  <text x="640" y="278" text-anchor="middle" class="node-text">Stale after 30 s</text>

  <!-- Loop A, row 2: status push -->
  <rect x="100" y="320" width="240" height="92" rx="13" fill="#dbeafe" stroke="#1565C0" stroke-width="2"/>
  <text x="220" y="350" text-anchor="middle" class="node-title">Push status</text>
  <text x="220" y="374" text-anchor="middle" class="node-text">System state, progress,</text>
  <text x="220" y="396" text-anchor="middle" class="node-text">live metrics, workers</text>
  <path d="M340 366 H516" class="edge" stroke="#1565C0" marker-end="url(#arrow-blue)"/>
  <text x="430" y="352" text-anchor="middle" class="edge-label">status patch</text>
  <rect x="520" y="320" width="240" height="92" rx="13" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="640" y="350" text-anchor="middle" class="node-title">AIPerfJob status</text>
  <text x="640" y="374" text-anchor="middle" class="node-text">Controller-owned fields</text>
  <text x="640" y="396" text-anchor="middle" class="node-text">UID checked first</text>

  <!-- Reaction: watch event and phase patch -->
  <path d="M640 412 V471" class="edge" stroke="#475569" marker-end="url(#arrow-slate)"/>
  <rect x="520" y="475" width="240" height="70" rx="13" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="640" y="504" text-anchor="middle" class="node-title">Deliver watch event</text>
  <text x="640" y="528" text-anchor="middle" class="node-text">System-state change</text>
  <path d="M760 510 H936" class="edge" stroke="#475569" marker-end="url(#arrow-slate)"/>
  <text x="850" y="496" text-anchor="middle" class="edge-label">watch event</text>

  <rect x="940" y="475" width="240" height="92" rx="13" fill="#dcfce7" stroke="#2E7D32" stroke-width="2"/>
  <text x="1060" y="505" text-anchor="middle" class="node-title">Patch phase forward</text>
  <text x="1060" y="529" text-anchor="middle" class="node-text">Initializing or Running</text>
  <text x="1060" y="551" text-anchor="middle" class="node-text">Forward only</text>
  <path d="M1060 567 V630 H764" class="edge" stroke="#2E7D32" marker-end="url(#arrow-green)"/>
  <text x="890" y="616" text-anchor="middle" class="edge-label">tested phase patch</text>

  <rect x="520" y="595" width="240" height="70" rx="13" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="640" y="624" text-anchor="middle" class="node-title">AIPerfJob phase</text>
  <text x="640" y="648" text-anchor="middle" class="node-text">Owned by the operator</text>

  <!-- Loop B: progress annotations -->
  <rect x="100" y="752" width="240" height="140" rx="13" fill="#dbeafe" stroke="#1565C0" stroke-width="2"/>
  <text x="220" y="798" text-anchor="middle" class="node-title">Patch progress</text>
  <text x="220" y="822" text-anchor="middle" class="node-text">Phase, percent, requests,</text>
  <text x="220" y="844" text-anchor="middle" class="node-text">status, system state</text>
  <path d="M340 787 H516" class="edge" stroke="#1565C0" marker-end="url(#arrow-blue)"/>
  <text x="430" y="773" text-anchor="middle" class="edge-label">annotations</text>
  <path d="M340 872 H516" class="edge" stroke="#1565C0" marker-end="url(#arrow-blue)"/>
  <text x="430" y="858" text-anchor="middle" class="edge-label">mirrored copy</text>

  <rect x="520" y="752" width="240" height="70" rx="13" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="640" y="781" text-anchor="middle" class="node-title">JobSet annotations</text>
  <text x="640" y="805" text-anchor="middle" class="node-text">On the benchmark JobSet</text>
  <rect x="520" y="837" width="240" height="70" rx="13" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="640" y="866" text-anchor="middle" class="node-title">AIPerfJob annotations</text>
  <text x="640" y="890" text-anchor="middle" class="node-text">Same values, on the CR</text>

  <rect x="920" y="775" width="280" height="96" rx="13" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1060" y="808" text-anchor="middle" class="note">No progress polling</text>
  <text x="1060" y="832" text-anchor="middle" class="node-text">The operator waits for</text>
  <text x="1060" y="854" text-anchor="middle" class="node-text">watch events instead</text>

  <!-- Step badges sit on top of their nodes -->
  <circle cx="104" cy="324" r="18" fill="#1565C0"/><text x="104" y="330" text-anchor="middle" class="step">1</text>
  <circle cx="524" cy="479" r="18" fill="#475569"/><text x="524" y="485" text-anchor="middle" class="step">2</text>
  <circle cx="944" cy="479" r="18" fill="#2E7D32"/><text x="944" y="485" text-anchor="middle" class="step">3</text>
  <circle cx="524" cy="599" r="18" fill="#475569"/><text x="524" y="605" text-anchor="middle" class="step">4</text>

  <rect x="90" y="982" width="1100" height="42" rx="12" fill="#ffffff" stroke="#9E9E9E" stroke-width="2"/>
  <text x="640" y="1009" text-anchor="middle" class="node-text">Two controller push loops keep the CR current; the operator learns of progress only through watch events</text>
</svg>
