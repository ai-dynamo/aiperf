name: Embed commit SHA
description: >
  Records the build commit two ways: [project.urls] Repository in pyproject.toml
  (lands in wheel METADATA for pip show / SBOM scanners) and
  src/aiperf/_build_info.py (aiperf.__commit_sha__ at runtime).

inputs:
  commit-sha:
    description: 'Commit SHA being built'
    required: true
  repository:
    description: 'owner/repo used to build the commit URL'
    required: true

runs:
  using: composite
  steps:
    - name: Embed commit SHA in wheel metadata
      shell: bash
      env:
        COMMIT_SHA: ${{ inputs.commit-sha }}
        REPO:       ${{ inputs.repository }}
      run: |
        python3 - <<'PYEOF'
        import os
        from pathlib import Path

        sha = os.environ["COMMIT_SHA"]
        repo = os.environ["REPO"]
        url = f"https://github.com/{repo}/commit/{sha}"

        pyproject = Path("pyproject.toml")
        text = pyproject.read_text()
        entry = f'Repository = "{url}"'
        if "[project.urls]" in text:
            text = text.replace("[project.urls]", f"[project.urls]\n{entry}", 1)
        else:
            if not text.endswith("\n"):
                text += "\n"
            text += f"\n[project.urls]\n{entry}\n"
        pyproject.write_text(text)

        Path("src/aiperf/_build_info.py").write_text(
            "# SPDX-FileCopyrightText: Copyright (c) 2025-2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.\n"
            "# SPDX-License-Identifier: Apache-2.0\n"
            '"""Build-time metadata. Generated by the RC pipeline; do not edit."""\n'
            "\n"
            f'COMMIT_SHA = "{sha}"\n'
        )
        print(f"Embedded commit SHA in METADATA + _build_info.py: {sha}")
        PYEOF
