name: Update pyproject.toml and uv.lock version
description: >
  Writes a PEP 440 version to pyproject.toml and to the root package entry in
  uv.lock via tools/patch_version.py, so `uv sync --locked` stays satisfied.
  Requires a checked-out repository and uv on PATH (astral-sh/setup-uv); the
  script runs under a uv-provisioned Python 3.13 so its tomllib verification
  always runs, on any runner OS.

inputs:
  version:
    description: >
      PEP 440 version string to write. Examples: 0.6.0rc0,
      0.6.0.dev20260424, 0.6.0.dev20260424+g3e3b3b1.
    required: true

runs:
  using: composite
  steps:
    - name: Patch pyproject.toml and uv.lock version
      shell: bash
      env:
        TARGET_VERSION: ${{ inputs.version }}
      run: uv run --no-project --python 3.13 python tools/patch_version.py "${TARGET_VERSION}"
