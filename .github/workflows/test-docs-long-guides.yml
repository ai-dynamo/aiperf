# Guides whose documented examples are genuinely long-running, covered at full
# documented scale rather than shrinking the examples to suit CI.
#
# A Bayesian search runs 30 iterations x 3 trials (~90 benchmarks, ~100 min);
# a search recipe self-terminates on improvement-patience after ~25 iterations
# (~30 min); the adaptive-search walkthrough runs 6 iterations whose per-point
# concurrency the planner is free to push to 64 (~30 min observed); the AIME
# accuracy example gives each of its 4 problems a 32768-token reasoning budget,
# and a single problem took ~20 min against Qwen3-0.6B (~60 min). Together that
# is ~3h40m, which would roughly quintuple the nightly matrix's ~45 min wall
# clock every weeknight.
#
# Neither long guide is shrunk to fit: capping AIME's generation truncates the
# chain-of-thought mid-reasoning, which breaks the grader and the guide's
# trt-llm recipe alignment. The scale is the thing under test.
#
# Weekly rather than nightly: the search machinery changes about once a week
# (13 of 191 commits over 90 days), so a nightly run would re-test unchanged
# code four nights in five. Everything else stays in test-docs-end-to-end.yml,
# which nightly.yml invokes.
#
# Triggers:
#   schedule          — Sundays 06:00 UTC.
#   workflow_dispatch — on demand, for when the search machinery changes and
#                       you do not want to wait for Sunday.

name: Test Docs Long-Running Guides

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Commit SHA or ref to check out. Defaults to the default branch."
        required: false
        type: string

jobs:
  test-docs-end-to-end-long:
    name: Test Docs End-to-End (long-running guides)
    runs-on: prod-aiperf-tester-amd-gpu-v1
    # The per-command ceilings live on the tags themselves (one timeout=9000
    # plus three timeout=5400) and already sum to 420 minutes, so the job needs
    # headroom above that for the image build, the vLLM boot and the model
    # download -- at 420 a shard that actually ran to every ceiling would be
    # killed before reporting. Expected wall clock is far lower: the ceilings
    # are worst cases, and the guides above total ~3h40m in practice.
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        shard:
          - id: vllm-longrun-openai
            server: vllm-longrun-openai
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Run test_docs_end_to_end
        env:
          AIPERF_SOURCE_DIR: ${{ github.workspace }}
          CI_JOB_NAME: test_docs_end_to_end
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SERVER_NAME: ${{ matrix.shard.server }}
        run: bash -x tests/ci/test_docs_end_to_end/setup_test.sh

      - name: Cleanup Docker containers
        if: always()
        run: |
          docker ps -aq --filter 'name=aiperf-test-' \
            | xargs -r docker rm -f 2>/dev/null || true
