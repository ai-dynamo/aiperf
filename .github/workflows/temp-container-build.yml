# TEMPORARY — DELETE BEFORE MERGE.
#
# The nightly is the only pipeline that builds the container, so a change to the
# ffmpeg build in the Dockerfile gets no PR-time coverage. This mirrors the
# nightly's amd64 container build and adds the codec verification that the
# ffmpeg component allowlist actually needs: a missing filter, parser or
# bitstream filter fails at RUNTIME, not at configure time, so a green
# `docker build` alone proves nothing.
#
# It also assembles a CycloneDX SBOM for the image contents. That runs here
# rather than in the Dockerfile on purpose: nothing in the production build
# changes, so the nightly and the shipped image are untouched by this branch.
#
# Unlike the nightly this neither pushes nor uses the ECR registry cache, so it
# needs no AWS credentials. Cold build, amd64 only.

name: TEMP Container Build

on:
  pull_request:
  push:
    branches:
      - 'anants/ffmpeg-codec-allowlist'
  workflow_dispatch:

jobs:
  temp-container-build:
    name: TEMP Build Container + Verify Codecs
    runs-on: prod-aiperf-builder-amd-v1
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --target   runtime \
            --load \
            --tag aiperf-temp:runtime \
            .

      - name: Build test image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --target   test \
            --load \
            --tag aiperf-temp:test \
            .

      - name: Show ffmpeg build configuration
        run: |
          docker run --rm aiperf-temp:runtime "ffmpeg -hide_banner -buildconf"
          echo "encoders: $(docker run --rm aiperf-temp:runtime 'ffmpeg -hide_banner -encoders' | grep -cE '^ [VAS]')"
          echo "decoders: $(docker run --rm aiperf-temp:runtime 'ffmpeg -hide_banner -decoders' | grep -cE '^ [VAS]')"

      # Only the implementation-carrying surfaces are checked. -codecs lists
      # names even when nothing is built, and -bsfs is excluded because
      # bitstream filters (aac_adtstoasc, h264_mp4toannexb) are pulled in as
      # mp4/mov muxer dependencies and carry no codec implementation.
      - name: Assert no disallowed codec is built
        run: |
          DENY='h\.?264|h\.?265|hevc|vvc|(^| )aac|nvenc|cuvid|nvdec|eac3|truehd|dts|aptx|wma'
          status=0
          for surface in encoders decoders; do
            hits=$(docker run --rm aiperf-temp:runtime "ffmpeg -hide_banner -${surface}" \
                     | grep -iE "${DENY}" || true)
            if [ -n "${hits}" ]; then
              echo "ERROR: ffmpeg -${surface} exposes a disallowed codec:" >&2
              echo "${hits}" >&2
              status=1
            fi
          done
          exit $status

      - name: Assert the expected codecs are built
        run: |
          encoders=$(docker run --rm aiperf-temp:runtime "ffmpeg -hide_banner -encoders")
          status=0
          for want in libvpx-vp9 libvorbis libopus; do
            if ! echo "${encoders}" | grep -q "${want}"; then
              echo "ERROR: expected encoder '${want}' is missing" >&2
              status=1
            fi
          done
          exit $status

      # The real gate. Exercises the rawvideo pipe input, the yuv420p pixel
      # format conversion, the WAV/PCM audio input, the 44.1 -> 48 kHz resample
      # Opus forces, and the vp9_superframe bitstream filter the muxers need.
      # Note the generator falls back from the pipe path to a PNG frame sequence
      # on error, so a pass here does not by itself prove the pipe path worked.
      - name: Verify video generation end to end
        run: |
          cat > /tmp/verify_video.py <<'PY'
          import base64, json, pathlib, subprocess, tempfile

          from aiperf.common import random_generator as rng
          from aiperf.config.dataset.video import VideoAudioConfig, VideoConfig
          from aiperf.dataset.generator.video import VideoGenerator

          rng.init(42)

          CASES = [
              ("webm", "vp9", "vorbis", 44100),
              ("mp4", "vp9", "opus", 48000),
          ]

          for fmt, exp_video, exp_audio, exp_rate in CASES:
              cfg = VideoConfig(
                  width=64, height=64, duration=1.0, fps=4,
                  format=fmt, codec="libvpx-vp9",
                  audio=VideoAudioConfig(channels=1, sample_rate=44.1),
              )
              data = base64.b64decode(VideoGenerator(cfg).generate().split(",", 1)[1])
              path = pathlib.Path(tempfile.mkdtemp()) / f"out.{fmt}"
              path.write_bytes(data)

              probe = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_streams", "-of", "json", str(path)],
                  capture_output=True, text=True, check=True,
              )
              streams = json.loads(probe.stdout)["streams"]
              video = next(s for s in streams if s["codec_type"] == "video")
              audio = next(s for s in streams if s["codec_type"] == "audio")

              assert video["codec_name"] == exp_video, (fmt, video["codec_name"])
              assert audio["codec_name"] == exp_audio, (fmt, audio["codec_name"])
              assert int(audio["sample_rate"]) == exp_rate, (fmt, audio["sample_rate"])
              print(
                  f"OK {fmt}: video={video['codec_name']} "
                  f"audio={audio['codec_name']}@{audio['sample_rate']}Hz "
                  f"bytes={len(data)}"
              )

          print("video generation verified")
          PY
          docker run --rm -v /tmp/verify_video.py:/verify.py:ro \
            aiperf-temp:runtime "python /verify.py"

      # Built from the existing python-licenses stage, which already holds the
      # cyclonedx-py venv scan and the dpkg package list. The runtime build above
      # already materialised this stage, so it costs nothing extra.
      - name: Build licenses stage
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --target   python-licenses \
            --load \
            --tag aiperf-temp:licenses \
            .

      # The runtime image is distroless and carries no dpkg database, so the
      # inventory has to be assembled from the build stage that still has the
      # metadata. The base image and ffmpeg version are read back from the
      # Dockerfile and the built binary rather than hardcoded here.
      - name: Generate the image SBOM
        run: |
          set -euo pipefail
          BASE_IMAGE=$(grep -E '^FROM .* AS runtime$' Dockerfile | awk '{print $2}')
          echo "runtime base image: ${BASE_IMAGE}"
          mkdir -p /tmp/sbom-out
          cat > /tmp/sbom-run.sh <<EOF
          set -e
          FFMPEG_VERSION=\$(ffmpeg -version | head -1 | awk '{print \$3}')
          echo "ffmpeg version: \${FFMPEG_VERSION}"
          python3 /sbom-tools/generate_container_sbom.py \\
            /opt/licenses/python/sbom.cdx.json \\
            /opt/licenses/dpkg/runtime-pkgs.txt \\
            /sbom-out/sbom.cdx.json \\
            --ffmpeg-version "\${FFMPEG_VERSION}" \\
            --base-image "${BASE_IMAGE}"
          EOF
          docker run --rm \
            -v "${PWD}/tools:/sbom-tools:ro" \
            -v /tmp/sbom-out:/sbom-out \
            -v /tmp/sbom-run.sh:/run.sh:ro \
            aiperf-temp:licenses "bash /run.sh"

      - name: Verify the SBOM
        run: |
          python3 - <<'PY'
          import json

          doc = json.load(open("/tmp/sbom-out/sbom.cdx.json"))
          assert doc["bomFormat"] == "CycloneDX", doc["bomFormat"]
          assert doc["specVersion"] == "1.6", doc["specVersion"]

          components = doc["components"]
          names = {c["name"] for c in components}
          types = {c["type"] for c in components}
          python_pkgs = [c for c in components if c.get("purl", "").startswith("pkg:pypi")]

          assert "ffmpeg" in names, "from-source ffmpeg missing from SBOM"
          assert any(n.startswith("libvpx") for n in names), "libvpx missing from SBOM"
          assert any(n.startswith("libopus") for n in names), "libopus missing from SBOM"
          assert "container" in types, "base image not recorded in SBOM"
          assert len(python_pkgs) > 10, f"only {len(python_pkgs)} python components"

          print(f"SBOM OK: {len(components)} components, {len(python_pkgs)} python")
          PY

      - name: Upload the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: container-sbom
          path: /tmp/sbom-out/sbom.cdx.json

      - name: Run ffmpeg-marked tests against the built image
        run: |
          docker run --rm -v "${PWD}:/workspace" -w /workspace aiperf-temp:test \
            "pytest tests/ -m ffmpeg -v --no-header -p no:cacheprovider"
