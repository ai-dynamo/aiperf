# DO NOT MERGE: temporary probe that repeats one flaky integration test.
name: "Run Integration Tests"

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        make first-time-setup PYTHON_VERSION=${{ matrix.python-version }}

    - name: Repeat idle-cap test (40x, 4 at a time)
      run: |
        . .venv/bin/activate
        pytest "tests/integration/test_weka_flat_split_e2e.py::test_runtime_idle_cap_handles_independent_stream_clock_drift" \
          -m integration -n 4 -v --tb=long -p no:randomly --basetemp="$RUNNER_TEMP/pt"

    - name: Upload aiperf logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: idle-cap-probe-logs-py${{ matrix.python-version }}
        path: ${{ runner.temp }}/pt/**/logs/*.log
        if-no-files-found: ignore
        retention-days: 7
