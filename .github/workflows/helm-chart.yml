name: "Validate Helm Chart"

# Match the trusted-branch CI convention used by the unit and Kubernetes
# workflows. Fork PRs enter this workflow after being mirrored to
# pull-request/<number>.
on:
  push:
    branches:
      - main
      - 'pull-request/[0-9]+'
      - 'release/*'
    paths:
      - 'deploy/helm/**'
      - 'Makefile'
      - '.github/workflows/helm-chart.yml'
      # The CRDs and the chart's values.yaml are generated from these sources,
      # so a change here can silently desync them from the committed YAML.
      - 'src/aiperf/config/**'
      - 'src/aiperf/kubernetes/**'
      - 'src/aiperf/operator/environment.py'
      - 'src/aiperf/operator/models.py'
      - 'tools/generate_crd.py'
      - 'tools/check_chart_consistency.py'
      - 'pyproject.toml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Set up uv with cache
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install project
        run: uv sync --locked --all-extras

      # Both CRDs and the chart's values.yaml are generated. Without these the
      # only thing stopping a hand-edit or a stale regeneration is convention.
      - name: Check generated CRDs are current
        run: make check-crd

      - name: Check chart values match operator defaults
        run: make check-chart-consistency

      - name: Lint and render chart
        run: |
          make helm-lint
          make helm-template

      - name: Render release artifacts
        run: |
          make crd-release HELM_DIST_DIR=dist/crds
          make helm-package HELM_DIST_DIR=dist/chart

      - name: Upload rendered artifacts
        uses: actions/upload-artifact@v5
        with:
          name: aiperf-operator-helm-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/chart/*.tgz
            dist/crds/*.yaml
          if-no-files-found: error
          retention-days: 14
