#
# Monthly whole-repo maintenance analysis.
#
# Runs the four `maint-*` analysis routines in ANALYSIS MODE ONLY: they read the
# repository, cluster findings, and update a single long-lived "Maintenance
# backlog" issue. They do not commit, push, or open pull requests. A human picks
# an item off the backlog and runs the routine interactively (`/maint-dead-code`)
# to actually make the change, which is where the judgment questions get answered.
#
# Why monthly analysis instead of a daily PR stream (see
# docs/reference/self-maintenance.md for the full rationale):
#
#   * Review capacity is the binding constraint. AIPerf merges ~15 PRs/week past
#     7 code owners. A bot adding 5/week would make maintenance a quarter of the
#     review queue, where it would starve behind feature work and go stale.
#   * These routines answer questions no existing tool can: PR review agents see
#     one diff, nightly CI sees pass/fail, the ruff/ergonomics ratchets see
#     mechanical rules. Cross-file, historical, judgment-dependent findings fall
#     through all three. That analysis is cheap; acting on it is expensive.
#   * A single backlog issue is also the system's only memory across runs.
#     Without it a scheduled routine re-proposes findings that were already
#     considered and rejected, forever.
#
# Security notes:
#
#   * `issues: write` only. The job cannot push a branch or open a PR, so an
#     analysis run that misbehaves cannot modify the repository.
#   * No new actions. The Claude Code CLI comes from npm; every action used here
#     is already used elsewhere in this repo, so no new action-allowlist entries
#     are required. (setup-uv is third-party, but already a repo dependency.)
#   * Never triggered by `pull_request` / `pull_request_target`, so fork code
#     cannot reach the API key. Note this does not make the agent's *input*
#     trusted: it reads merged repo content and history, which includes text
#     from outside contributors.
#   * The raw CLI transcript is not uploaded. Secret masking covers rendered run
#     logs, not files written to disk and then published as artifacts.

name: "Self-Maintenance Analysis"

on:
  schedule:
    # 10:00 UTC on the 1st of each month. Deliberately infrequent: these findings
    # accumulate over months, and the backlog caps at 20 open items per routine.
    - cron: '0 10 1 * *'
  workflow_dispatch:
    inputs:
      routine:
        description: 'Which routine to run. "all" runs the full sweep.'
        required: true
        default: all
        type: choice
        options:
          - all
          - maint-dead-code
          - maint-dup-abstractions
          - maint-coverage-gaps
          - maint-test-pruning
      dry_run:
        description: 'Analyze and upload a report, but do not touch the backlog issue.'
        type: boolean
        default: true

concurrency:
  group: self-maintenance
  cancel-in-progress: false

permissions: {}

jobs:
  resolve:
    name: Resolve routines
    runs-on: ubuntu-latest
    if: github.repository == 'ai-dynamo/aiperf'
    permissions: {}
    outputs:
      routines: ${{ steps.pick.outputs.routines }}
      dry_run: ${{ steps.pick.outputs.dry_run }}
      enabled: ${{ steps.pick.outputs.enabled }}
    steps:
      - name: Pick routines and check that the run is enabled
        id: pick
        env:
          # Secret presence cannot be tested in an `if:` expression, so it is
          # resolved here into a plain boolean output. No secret material is
          # exposed by comparing it to the empty string.
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          INPUT_ROUTINE: ${{ inputs.routine }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          ALL='["maint-dead-code","maint-dup-abstractions","maint-coverage-gaps","maint-test-pruning"]'

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$INPUT_ROUTINE" != "all" ]]; then
            routines="[\"$INPUT_ROUTINE\"]"
          else
            routines="$ALL"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            dry_run="$INPUT_DRY_RUN"
          else
            dry_run=false
          fi

          if [[ "$HAS_KEY" != "true" ]]; then
            echo "::notice::ANTHROPIC_API_KEY is not configured for this repository; skipping. See docs/reference/self-maintenance.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

          echo "routines=$routines" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run"   >> "$GITHUB_OUTPUT"
          echo "Routines: $routines (dry_run=$dry_run)" >> "$GITHUB_STEP_SUMMARY"

  analyze:
    name: ${{ matrix.routine }}
    needs: resolve
    if: needs.resolve.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Analysis mode updates the backlog issue and nothing else. No `contents:
      # write`, so the job structurally cannot push a branch or open a PR.
      issues: write
    strategy:
      # Sequential: all four routines edit the same backlog issue, and parallel
      # edits would clobber each other. fail-fast off so one routine erroring
      # does not cancel the rest of the sweep.
      max-parallel: 1
      fail-fast: false
      matrix:
        routine: ${{ fromJSON(needs.resolve.outputs.routines) }}
    env:
      ROUTINE: ${{ matrix.routine }}
      DRY_RUN: ${{ needs.resolve.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: every routine reasons about provenance (`git log -S`,
          # `--follow`) to judge whether code or a test is safe to touch. A
          # shallow clone silently degrades that judgment.
          fetch-depth: 0
          # Analysis mode never pushes, so the job has no need of a credential
          # in .git/config where an agent could read it back out.
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install project and mock server
        run: make ci-install PYTHON_VERSION=3.12

      - name: Put the project venv on PATH
        # `make ci-install` installs into .venv but does not export it. The
        # coverage-gap routine invokes pytest/coverage tooling directly.
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Empty on a dry run, so "do not touch the backlog" is enforced by the
          # absence of a credential rather than by prompt text alone.
          GH_TOKEN: ${{ needs.resolve.outputs.dry_run == 'true' && '' || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # artifacts/ is gitignored, so nothing written here can be picked up
          # by a stray `git add`.
          mkdir -p artifacts

          if [[ "$DRY_RUN" == "true" ]]; then
            DELIVERABLE="Do NOT create or edit any issue. Write what you would have added to
          the backlog, plus your full evidence, to artifacts/maintenance-report.md."
          else
            DELIVERABLE="Find the open issue titled 'Maintenance backlog' with
          'gh issue list --label maintenance --state open --search \"Maintenance backlog\" in:title'.
          If none exists, create it with 'gh issue create --label maintenance'. Read it in
          full, then update it per the backlog rules in the shared contract. Also write the
          run report to artifacts/maintenance-report.md."
          fi

          claude -p "Run the '$ROUTINE' maintenance routine on this repository in ANALYSIS MODE.

          Read .agents/skills/self-maintenance/SKILL.md first and follow it exactly. It
          defines the two run modes, the maintenance backlog rules, the scope guards, the
          confidence tiers, and the abort conditions. Then read
          .agents/skills/$ROUTINE/SKILL.md and carry out that routine's analysis.

          You are in ANALYSIS MODE. Non-negotiable:
          - Do NOT modify any file in the working tree. Do not commit, branch, or push.
          - Do NOT open a pull request.
          - Record only High- and Medium-confidence findings. Drop Low entirely.
          - Read the existing backlog before proposing anything. Never re-propose an item
            listed under 'Declined', and never duplicate one already under 'Open'.
          - Reject any finding that could have been made by reviewing a single PR diff.
            That belongs to the PR review agents, not to this routine.
          - Finding nothing is a valid and expected outcome. Do not manufacture work.
          - Never print environment variables or credentials.

          $DELIVERABLE" \
            --permission-mode acceptEdits \
            --allowedTools "Read,Glob,Grep,Bash,Task" \
            --max-turns 120

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          # run_attempt included because artifact names must be unique within a
          # run, and re-running a failed job reuses run_id.
          name: maintenance-${{ matrix.routine }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/maintenance-report.md
          if-no-files-found: warn
          retention-days: 30
