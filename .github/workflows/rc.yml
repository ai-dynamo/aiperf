# RC release automation pipeline.
#
# Phases:
#   1. Gate     — extract version from branch name, compute RC number
#   2. Validate — pre-commit + test placeholders
#   3. Build    — wheel (→ S3) + multi-arch containers (→ ECR) + ECR manifest
#   4. Approve  — [approve-release] human review before tagging
#   5. Tag      — [automated-release] commit RC git tag
#   6. Stage    — [automated-release] ECR → NGC; S3 → Artifactory
#   7. Scan     — [automated-release] trigger GitLab security pipeline
#   8. Summary  — always runs; Slack on failure
#
# Triggers:
#   push to release/X.Y.Z  — automated RC build from release branch
#   workflow_dispatch       — manual trigger with optional git ref override
#
# Version resolution:
#   release/X.Y.Z branches → version extracted from branch name
#   all other branches      → version = 0.0.0 (dev/test only)
#
# Security model:
#   Builder runners use IAM instance profiles — no environment gate needed.
#   Human approval (approve-release env) required before tag creation.
#   Tag creation and all external publishing gated by automated-release env.

name: RC

on:
  push:
    branches:
      - 'release/[0-9]*.[0-9]*.[0-9]*'
      - 'pvijayakrish/automate-release-rc'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build from (branch, tag, or full SHA). Defaults to triggered ref.'
        default: ''
        required: false

# Prevent concurrent RC runs on the same branch from racing on tag creation.
# cancel-in-progress: false — never cancel a run that may be pending human approval.
concurrency:
  group: rc-pipeline-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # GATE: Authorization + Version Resolution
  # ============================================================================

  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      rc_number: ${{ steps.rc.outputs.rc_number }}
      rc_tag: ${{ steps.rc.outputs.rc_tag }}
      wheel_version: ${{ steps.rc.outputs.wheel_version }}
      wheel_filename: ${{ steps.rc.outputs.wheel_filename }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Extract version from branch
        id: extract
        run: |
          set -euo pipefail
          BRANCH="${{ inputs.ref || github.ref_name }}"
          BRANCH="${BRANCH#refs/heads/}"
          if [[ "${BRANCH}" =~ ^release/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="0.0.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Determine RC number
        id: rc
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          set -euo pipefail

          RC_PATTERN="v${VERSION}-rc"
          EXISTING_RCS=$(git tag -l "${RC_PATTERN}*" | grep -E "^v${VERSION}-rc[0-9]+$" | sort -V || true)

          if [ -z "${EXISTING_RCS}" ]; then
            NEXT_RC=0
          else
            LAST_RC=$(echo "${EXISTING_RCS}" | tail -1)
            LAST_RC_NUM=${LAST_RC#v${VERSION}-rc}
            NEXT_RC=$((LAST_RC_NUM + 1))
          fi

          RC_TAG="v${VERSION}-rc${NEXT_RC}"
          WHEEL_VERSION="${VERSION}rc${NEXT_RC}"
          WHEEL_FILENAME="aiperf-${WHEEL_VERSION}-py3-none-any.whl"

          echo "rc_number=${NEXT_RC}" >> "$GITHUB_OUTPUT"
          echo "rc_tag=${RC_TAG}" >> "$GITHUB_OUTPUT"
          echo "wheel_version=${WHEEL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "wheel_filename=${WHEEL_FILENAME}" >> "$GITHUB_OUTPUT"

  # ============================================================================
  # QUALITY GATES
  # ============================================================================

  pre-commit:
    name: Pre-commit Checks
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: make first-time-setup PYTHON_VERSION=3.12

      - name: Run pre-commit
        run: |
          . .venv/bin/activate
          pre-commit run --all-files

  unit-tests:
    name: Unit Tests (temporarily skipped)
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - name: Skip
        run: echo "Temporarily skipped"

  integration-tests:
    name: Integration Tests (temporarily skipped)
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - name: Skip
        run: echo "Temporarily skipped"

  gpu-e2e-tests:
    name: GPU End-to-End Tests
    needs: [prepare-release]
    runs-on: prod-aiperf-tester-amd-gpu-v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Run test_docs_end_to_end
        if: false
        env:
          AIPERF_SOURCE_DIR: ${{ github.workspace }}
          CI_JOB_NAME: test_docs_end_to_end
        run: |
          bash -x tests/ci/test_docs_end_to_end/setup_test.sh

      - name: Cleanup Docker containers
        if: always()
        run: docker compose -f docker-compose.yml down || true

  # ============================================================================
  # BUILD ARTIFACTS
  # ============================================================================

  # No environment: declaration — builder runners carry AWS credentials via IAM
  # instance profile. The automated-release gate is enforced at tag creation and staging only.
  build-container:
    name: Build and Push Container (${{ matrix.arch }})
    needs: [prepare-release]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: prod-aiperf-builder-amd-v1
          - arch: arm64
            platform: linux/arm64
            runner: prod-aiperf-builder-arm-v1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Patch version for RC
        uses: ./.github/actions/update-pyproject-version
        with:
          version: ${{ needs.prepare-release.outputs.wheel_version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ECR
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          aws ecr get-login-password --region ${AWS_DEFAULT_REGION} \
            | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

      # Wheel is pure Python (py3-none-any); build once on amd64 and upload.
      # The wheel-builder layer is cached into aiperf:cache-amd64 and reused
      # by the runtime build below.
      - name: Build and extract wheel (amd64 only)
        if: matrix.arch == 'amd64'
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          set -euo pipefail
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
          docker buildx build \
            --platform linux/amd64 \
            --target   wheel-builder \
            --cache-from "type=registry,ref=${REGISTRY}/aiperf:cache-amd64" \
            --cache-to   "type=registry,ref=${REGISTRY}/aiperf:cache-amd64,mode=max" \
            --output     type=local,dest=./dist/ \
            .

      - name: Validate wheel (amd64 only)
        if: matrix.arch == 'amd64'
        env:
          EXPECTED_VERSION: ${{ needs.prepare-release.outputs.wheel_version }}
        run: |
          set -euo pipefail

          mapfile -t WHEELS < <(find dist/ -name "aiperf-*.whl" -type f)
          if [ "${#WHEELS[@]}" -eq 0 ]; then
            echo "::error::No wheel found in dist/ after build"
            exit 1
          fi
          if [ "${#WHEELS[@]}" -gt 1 ]; then
            echo "::error::Multiple wheels found in dist/ — expected exactly one:"
            printf '  %s\n' "${WHEELS[@]}"
            exit 1
          fi
          WHEEL_PATH="${WHEELS[0]}"

          uvx twine check "${WHEEL_PATH}"
          uv venv .venv-check
          uv pip install --python .venv-check/bin/python "${WHEEL_PATH}"
          INSTALLED_VERSION=$(.venv-check/bin/python -c "import aiperf; print(aiperf.__version__)")
          if [ "${INSTALLED_VERSION}" != "${EXPECTED_VERSION}" ]; then
            echo "::error::Wheel version mismatch: expected '${EXPECTED_VERSION}', got '${INSTALLED_VERSION}'"
            exit 1
          fi
          .venv-check/bin/aiperf --help

      - name: Upload wheel to S3 (amd64 only)
        if: matrix.arch == 'amd64'
        env:
          S3_BUCKET:     ${{ secrets.S3_CI_WHEELS_BUCKET }}
          WHEEL_VERSION: ${{ needs.prepare-release.outputs.wheel_version }}
        run: |
          set -euo pipefail
          WHEEL=$(find dist/ -name "aiperf-*.whl" | head -1)
          aws s3 cp "${WHEEL}" "s3://${S3_BUCKET}/aiperf/rc/${WHEEL_VERSION}/" --sse AES256
          echo "Wheel uploaded to S3 for ${WHEEL_VERSION}"

      - name: Build and push arch-specific image
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          WHEEL_VERSION: ${{ needs.prepare-release.outputs.wheel_version }}
        run: |
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
          IMAGE_REF="${ECR_REGISTRY}/aiperf:${WHEEL_VERSION}-${{ matrix.arch }}"
          CACHE_REF="${ECR_REGISTRY}/aiperf:cache-${{ matrix.arch }}"
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --target runtime \
            --cache-from type=registry,ref=${CACHE_REF} \
            --cache-to type=registry,ref=${CACHE_REF},mode=max \
            --push \
            --tag "${IMAGE_REF}" \
            .

  create-multiarch-manifest-ecr:
    name: Create Multi-arch Manifest (ECR)
    needs: [prepare-release, build-container]
    runs-on: prod-aiperf-default-v1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get ECR login token
        id: ecr
        env:
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          echo "password=$(aws ecr get-login-password --region "${AWS_DEFAULT_REGION}")" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest on ECR
        uses: ./.github/actions/create-multiarch-manifest
        with:
          registry:          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_DEFAULT_REGION }}.amazonaws.com
          registry-username: AWS
          registry-password: ${{ steps.ecr.outputs.password }}
          target-image: >-
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_DEFAULT_REGION }}.amazonaws.com/aiperf:${{ needs.prepare-release.outputs.wheel_version }}
          source-images: >-
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_DEFAULT_REGION }}.amazonaws.com/aiperf:${{ needs.prepare-release.outputs.wheel_version }}-amd64
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_DEFAULT_REGION }}.amazonaws.com/aiperf:${{ needs.prepare-release.outputs.wheel_version }}-arm64

  # ============================================================================
  # APPROVE
  # Human approval gate — pauses the pipeline after all builds and quality
  # gates pass. A reviewer confirms artifacts are sound before the RC tag is
  # committed and artifacts are staged externally.
  # ============================================================================

  approve-release:
    name: Approve Release
    needs:
      - prepare-release
      - pre-commit
      - unit-tests
      - integration-tests
      - gpu-e2e-tests
      - create-multiarch-manifest-ecr
    runs-on: ubuntu-latest
    environment: approve-release
    steps:
      - name: Release approved
        env:
          RC_TAG:         ${{ needs.prepare-release.outputs.rc_tag }}
          WHEEL_VERSION: ${{ needs.prepare-release.outputs.wheel_version }}
        run: |
          echo "Release approved: ${RC_TAG} (${WHEEL_VERSION})"

  # ============================================================================
  # STAGE ARTIFACTS
  # ============================================================================

  stage-container:
    name: Stage Container (ECR to NGC)
    needs: [prepare-release, approve-release]
    runs-on: prod-aiperf-default-v1
    environment: automated-release
    env:
      CRANE_VERSION: v0.20.2
    steps:
      - name: Setup crane and login to registries
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          NGC_TOKEN: ${{ secrets.NGC_PUBLISH_TOKEN }}
          NGC_USERNAME: ${{ secrets.NGC_PUBLISH_USERNAME }}
        run: |
          curl -sL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xzf - crane
          sudo mv crane /usr/local/bin/
          aws ecr get-login-password --region ${AWS_DEFAULT_REGION} \
            | crane auth login "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com" --username AWS --password-stdin
          echo "${NGC_TOKEN}" | crane auth login nvcr.io -u "${NGC_USERNAME}" --password-stdin

      - name: Copy images from ECR to NGC and create manifest
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_DEFAULT_REGION }}.amazonaws.com
          NGC_IMAGE: nvcr.io/${{ secrets.NGC_PUBLISH_ORG }}/aiperf
          WHEEL_VERSION: ${{ needs.prepare-release.outputs.wheel_version }}
        run: |
          set -euo pipefail
          for ARCH in amd64 arm64; do
            crane copy "${ECR_REGISTRY}/aiperf:${WHEEL_VERSION}-${ARCH}" \
                       "${NGC_IMAGE}:${WHEEL_VERSION}-${ARCH}"
          done
          crane index append \
            --manifest "${NGC_IMAGE}:${WHEEL_VERSION}-amd64" \
            --manifest "${NGC_IMAGE}:${WHEEL_VERSION}-arm64" \
            --tag "${NGC_IMAGE}:${WHEEL_VERSION}"


  stage-wheel:
    name: Stage Wheel (S3 to Artifactory)
    needs: [prepare-release, approve-release]
    # Use the builder runner: prod-aiperf-default-v1's role lacks s3:GetObject on
    # the wheels bucket. Revisit when IAM is widened.
    runs-on: prod-aiperf-builder-amd-v1
    environment: automated-release
    steps:
      - name: Copy wheel from S3 to Artifactory
        env:
          S3_BUCKET: ${{ secrets.S3_CI_WHEELS_BUCKET }}
          ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
          WHEEL_VERSION: ${{ needs.prepare-release.outputs.wheel_version }}
          WHEEL_FILENAME: ${{ needs.prepare-release.outputs.wheel_filename }}
        run: |
          set -euo pipefail
          TMPDIR="$(mktemp -d)"
          trap 'rm -rf "${TMPDIR}"' EXIT

          # Single-object copy (no --recursive) so we only need s3:GetObject.
          aws s3 cp \
            "s3://${S3_BUCKET}/aiperf/rc/${WHEEL_VERSION}/${WHEEL_FILENAME}" \
            "${TMPDIR}/${WHEEL_FILENAME}"

          # Raw Artifactory deploy via native repo API. The PyPI handler
          # (/api/pypi/) does not accept sub-path deploys — it expects the
          # repo root URL. ARTIFACTORY_URL must be the generic repo base:
          # https://<host>/artifactory/<repo> (no /api/pypi/, no sub-path).
          TARGET_URL="${ARTIFACTORY_URL%/}/release/${WHEEL_FILENAME}"
          BODY_FILE=$(mktemp)
          HTTP_CODE=$(curl -sSL -o "${BODY_FILE}" -w "%{http_code}" \
            -u "${ARTIFACTORY_USER}:${ARTIFACTORY_TOKEN}" \
            -T "${TMPDIR}/${WHEEL_FILENAME}" \
            "${TARGET_URL}")
          if [ "${HTTP_CODE}" != "201" ]; then
            echo "::error::Artifactory deploy failed: HTTP ${HTTP_CODE} at ${TARGET_URL}"
            cat "${BODY_FILE}" || true
            exit 1
          fi
          echo "Wheel staged to Artifactory: ${TARGET_URL}"

  # ============================================================================
  # TRIGGER GITLAB RELEASE AUTOMATION
  #
  # nSpect registration, Pulse container scans, and wheeltamer wheel scans
  # run on GitLab because GitHub AWS runners cannot reach internal NVIDIA
  # endpoints (nSpect API, Pulse, sonar.nvidia.com).
  #
  # This job triggers the release-automation GitLab pipeline which performs:
  #   1. Pulse container vulnerability scan (aiperf amd64 + arm64)
  #   2. Wheeltamer wheel security scan (aiperf wheel)
  #   3. nSpect registration (wheel URL + container image URL)
  #
  # Required secrets (in the automated-release environment):
  #   GITLAB_TRIGGER_TOKEN  -- GitLab pipeline trigger token
  #   GITLAB_PIPELINE_URL   -- https://gitlab-master.nvidia.com/api/v4/projects/<ID>/trigger/pipeline
  # ============================================================================

  trigger-gitlab-pipeline:
    name: Trigger GitLab Release Automation
    needs: [prepare-release, stage-container, stage-wheel]
    runs-on: gitlab_ci_runners
    environment: automated-release
    steps:
      - name: Trigger GitLab RC pipeline
        env:
          RC_TAG: ${{ needs.prepare-release.outputs.rc_tag }}
          WHEEL_VERSION: ${{ needs.prepare-release.outputs.wheel_version }}
          WHEEL_FILENAME: ${{ needs.prepare-release.outputs.wheel_filename }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          GITLAB_URL: ${{ secrets.GITLAB_PIPELINE_URL }}
          ARTIFACTORY_PYPI_URL: ${{ secrets.ARTIFACTORY_PYPI_URL }}
        run: |
          set -euo pipefail

          # Write token to a temp file so it is not visible in the process list.
          TOKEN_FILE=$(mktemp)
          echo -n "${GITLAB_TOKEN}" > "${TOKEN_FILE}"
          trap 'rm -f "${TOKEN_FILE}"' EXIT

          RESPONSE=$(curl -fsSL \
            --request POST \
            --form "token=<${TOKEN_FILE}" \
            --form "ref=main" \
            --form "variables[PIPELINE_TYPE]=rc" \
            --form "variables[RELEASE_TYPE]=rc" \
            --form "variables[PROJECT]=aiperf" \
            --form "variables[SOURCE_BRANCH]=${GITHUB_REF_NAME}" \
            --form "variables[RC_TAG]=${RC_TAG}" \
            --form "variables[WHEEL_VERSION]=${WHEEL_VERSION}" \
            --form "variables[COMMIT_SHA]=${{ github.sha }}" \
            --form "variables[GITHUB_RUN_ID]=${{ github.run_id }}" \
            --form "variables[ARTIFACTS]=wheel,container" \
            --form "variables[ARTIFACTORY_PYPI_URL]=${ARTIFACTORY_PYPI_URL}" \
            --form "variables[ENABLE_PULSE_SCAN]=true" \
            --form "variables[ENABLE_WHEEL_SCAN]=true" \
            --form "variables[ENABLE_SONARQUBE]=false" \
            "${GITLAB_URL}")

          PIPELINE_ID=$(echo "${RESPONSE}" | jq -r '.id // empty')

          if [ -z "${PIPELINE_ID}" ]; then
            echo "::error::Failed to trigger GitLab pipeline or parse response"
            exit 1
          fi

          echo "GitLab pipeline triggered: ID ${PIPELINE_ID}"

          {
            echo "### GitLab Release Automation"
            echo "- **Pipeline ID**: ${PIPELINE_ID}"
            echo "- **Type**: RC (security scans + nSpect registration)"
            echo "- **Project**: aiperf"
            echo "- **RC Tag**: \`${RC_TAG}\`"
            echo ""
            echo "The GitLab pipeline will:"
            echo "1. Run Pulse container vulnerability scans"
            echo "2. Run wheeltamer wheel security scan"
            echo "3. Register artifacts with nSpect"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # PIPELINE SUMMARY
  # ============================================================================

  pipeline-summary:
    name: Pipeline Summary
    needs:
      - prepare-release
      - pre-commit
      - unit-tests
      - integration-tests
      - gpu-e2e-tests
      - build-container
      - create-multiarch-manifest-ecr
      - approve-release
      - stage-container
      - stage-wheel
      - trigger-gitlab-pipeline
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write pipeline summary
        env:
          RC_TAG:         ${{ needs.prepare-release.outputs.rc_tag }}
          WHEEL_VERSION: ${{ needs.prepare-release.outputs.wheel_version }}
        run: |
          {
            echo "## RC Pipeline Summary"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| RC Tag | \`${RC_TAG}\` |"
            echo "| Version | \`${WHEEL_VERSION}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo ""
            echo "### Quality Gates"
            echo "| Gate | Result |"
            echo "|------|--------|"
            echo "| pre-commit | ${{ needs.pre-commit.result }} |"
            echo "| unit-tests | ${{ needs.unit-tests.result }} |"
            echo "| integration-tests | ${{ needs.integration-tests.result }} |"
            echo "| gpu-e2e-tests | ${{ needs.gpu-e2e-tests.result }} |"
            echo ""
            echo "### Build + Tag"
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| build-container (→ ECR + S3 wheel) | ${{ needs.build-container.result }} |"
            echo "| create-multiarch-manifest-ecr | ${{ needs.create-multiarch-manifest-ecr.result }} |"
            echo "| approve-release | ${{ needs.approve-release.result }} |"
            echo ""
            echo "### Stage + Scan"
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| stage-container (→ NGC) | ${{ needs.stage-container.result }} |"
            echo "| stage-wheel (→ Artifactory) | ${{ needs.stage-wheel.result }} |"
            echo "| trigger-gitlab-pipeline | ${{ needs.trigger-gitlab-pipeline.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on failure
        if: ${{ failure() }}
        env:
          RC_TAG:        ${{ needs.prepare-release.outputs.rc_tag }}
          RUN_URL:       ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_WEBHOOK: ${{ secrets.NIGHTLY_SLACK_WEBHOOK }}
        run: |
          if [ -z "${SLACK_WEBHOOK}" ]; then
            echo "::warning::NIGHTLY_SLACK_WEBHOOK is not configured — skipping failure notification"
            exit 0
          fi
          curl -fsSL \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{\"text\":\"RC pipeline failed: ${RC_TAG}\n${RUN_URL}\"}" \
            "${SLACK_WEBHOOK}"
