# Runs tests/ci/test_docs_end_to_end/setup_test.sh on the AMD GPU runner.
#
# Triggers:
#   push          — runs for trusted main, release, and mirrored PR branch
#                   pushes. There is no paths filter: detect-changes decides
#                   whether the GPU matrix runs, by comparing the
#                   parser-extracted server config across the pushed range.
#   workflow_call — invoked by nightly.yml so the nightly stays green.

name: Test Docs End-to-End

on:
  push:
    branches:
      - main
      - 'pull-request/[0-9]+'
      - 'release/*'
  workflow_call:
    inputs:
      source_ref:
        description: "Commit SHA or ref to checkout when invoked from another workflow."
        required: false
        type: string

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      run_test: ${{ steps.compare.outputs.run_test }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - id: compare
        name: Compare parser-extracted config between base and head
        run: |
          set -euo pipefail

          # PRs reach this workflow as pushes to pull-request/NNN mirror
          # branches, so github.event_name is never "pull_request" here and a
          # PR-only comparison would skip the hash check on every run. Compare
          # the pushed range instead: event.before..sha for a push, and
          # main..HEAD for workflow_call (nightly), which has no before.
          HEAD="${{ github.sha }}"
          BASE="${{ github.event.before }}"

          # A new branch, a force-push, or a workflow_call gives no usable
          # base. Fall back to the merge-base with main so a PR branch still
          # compares against what it will merge into.
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin main 2>/dev/null || true
            if ! BASE=$(git merge-base FETCH_HEAD "$HEAD" 2>/dev/null); then
              echo "::warning::No comparable base; running GPU test."
              echo "run_test=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [[ "$BASE" == "$HEAD" ]]; then
            echo "::notice::Base equals head; running GPU test."
            echo "run_test=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Safety net: any change under the test runner directory always runs
          # the test (covers parser.py, test_runner.py, constants, etc.).
          if git diff --name-only "$BASE" "$HEAD" -- 'tests/ci/test_docs_end_to_end/' | grep -q .; then
            echo "Test runner code changed; running GPU test."
            echo "run_test=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Compare parser-extracted server config between base and head.
          # If the script fails on either side, fall back to running the test.
          git worktree add /tmp/base-tree "$BASE"
          if ! BASE_HASH=$(python3 /tmp/base-tree/tests/ci/test_docs_end_to_end/dump_config_hash.py); then
            echo "::warning::Could not compute base hash; running GPU test."
            echo "run_test=true" >> "$GITHUB_OUTPUT"
            git worktree remove /tmp/base-tree --force
            exit 0
          fi
          git worktree remove /tmp/base-tree --force

          if ! HEAD_HASH=$(python3 tests/ci/test_docs_end_to_end/dump_config_hash.py); then
            echo "::warning::Could not compute head hash; running GPU test."
            echo "run_test=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$BASE_HASH" == "$HEAD_HASH" ]]; then
            echo "::notice::No parser-relevant changes; skipping GPU test."
            echo "run_test=false" >> "$GITHUB_OUTPUT"
          else
            echo "Parser-extracted config differs; running GPU test."
            echo "run_test=true" >> "$GITHUB_OUTPUT"
          fi

  # Sharded across 8 GPU runners: 4 shards for vllm-default-openai (the
  # chat server with 35+ tutorial commands, the wall-clock bottleneck) and
  # one shard each for the smaller modality-specific servers. The runner
  # pool (prod-aiperf-tester-amd-gpu-v1) caps at maxRunners=16, so 8 in
  # parallel fits comfortably; see velonix/flux-apps/.../prod-tester-v1/.
  # Each shard pays its own ~5-10 min vLLM boot + AIPerf docker build, so
  # going past ~8 shards has diminishing returns.
  test-docs-end-to-end:
    name: Test Docs End-to-End (${{ matrix.shard.id }})
    needs: detect-changes
    if: needs.detect-changes.outputs.run_test == 'true'
    runs-on: prod-aiperf-tester-amd-gpu-v1
    strategy:
      fail-fast: false
      matrix:
        shard:
          - id: vllm-default-openai-1of4
            server: vllm-default-openai
            shard_index: 0
            shard_total: 4
          - id: vllm-default-openai-2of4
            server: vllm-default-openai
            shard_index: 1
            shard_total: 4
          - id: vllm-default-openai-3of4
            server: vllm-default-openai
            shard_index: 2
            shard_total: 4
          - id: vllm-default-openai-4of4
            server: vllm-default-openai
            shard_index: 3
            shard_total: 4
          - id: vllm-audio-openai
            server: vllm-audio-openai
          - id: vllm-vision-openai
            server: vllm-vision-openai
          - id: vllm-video-openai
            server: vllm-video-openai
          - id: vllm-embeddings-openai
            server: vllm-embeddings-openai
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Run test_docs_end_to_end
        env:
          AIPERF_SOURCE_DIR: ${{ github.workspace }}
          CI_JOB_NAME: test_docs_end_to_end
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Matrix-shard params. SHARD_INDEX/SHARD_TOTAL are unset for the
          # single-shard servers; setup_test.sh treats their absence as
          # "no slicing" and runs all commands for the named server.
          SERVER_NAME: ${{ matrix.shard.server }}
          SHARD_INDEX: ${{ matrix.shard.shard_index }}
          SHARD_TOTAL: ${{ matrix.shard.shard_total }}
        run: bash -x tests/ci/test_docs_end_to_end/setup_test.sh

      - name: Cleanup Docker containers
        if: always()
        # The harness starts containers with plain `docker run --name
        # aiperf-test-<pid>` (test_runner.py), never compose, and this repo
        # ships no docker-compose.yml -- the previous `compose down` here was
        # a no-op, so a run killed mid-test leaked its container onto the
        # self-hosted runner and flaked the next job that reused the name.
        run: |
          docker ps -aq --filter 'name=aiperf-test-' \
            | xargs -r docker rm -f 2>/dev/null || true
