#
# Multi-arch container image build workflow (opt-in push).
#
# Builds the official aiperf image (root `Dockerfile`, `runtime` stage) for
# linux/amd64 + linux/arm64 as a CI check on pull_request and push-to-main;
# nothing is pushed by default.
#
# The operator and benchmark pods share this one image — kopf is a main
# dependency (see pyproject.toml), so `kopf run -m aiperf.operator.main ...`
# works from the same venv that benchmark pods use. The Helm chart
# (`deploy/helm/aiperf-operator/values.yaml`) points at `nvcr.io/nvidia/aiperf`
# by default, matching this workflow's registry.
#
# To publish images, trigger this workflow manually ("Run workflow" /
# workflow_dispatch) with:
#   - push_to_registry: true
#   - registry:         ghcr.io/ai-dynamo/aiperf  (or any other target)
# and ensure the `REGISTRY_TOKEN` repository secret is set (PAT/registry token
# with push rights). The login + push steps are gated on BOTH the input being
# true AND the secret being present — if either is missing the workflow still
# runs as a build-only check.
name: "Build Container Images"

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'llms.txt'
      - 'LICENSE'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'llms.txt'
      - 'LICENSE'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: "Push built images to the registry (requires REGISTRY_TOKEN secret)"
        type: boolean
        default: false
      registry:
        description: "Destination registry/repo prefix for image tags"
        type: string
        default: "ghcr.io/ai-dynamo/aiperf"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: "build (aiperf)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUSH_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.push_to_registry == true }}
      REGISTRY: ${{ (github.event_name == 'workflow_dispatch' && inputs.registry) || 'ghcr.io/ai-dynamo/aiperf' }}
      HAS_REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN != '' }}

    steps:
      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get -y clean
          docker system prune -af || true
          df -h

      - uses: actions/checkout@v4

      - name: Compute push flag
        id: push
        shell: bash
        run: |
          if [[ "${PUSH_REQUESTED}" == "true" && "${HAS_REGISTRY_TOKEN}" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "${PUSH_REQUESTED}" == "true" && "${HAS_REGISTRY_TOKEN}" != "true" ]]; then
            echo "::warning::push_to_registry=true but REGISTRY_TOKEN secret is not set; falling back to build-only."
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/aiperf
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=pr,prefix=pr-
            type=ref,event=branch,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - name: Log in to registry
        if: steps.push.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build${{ steps.push.outputs.enabled == 'true' && ' and push' || '' }} aiperf
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.push.outputs.enabled == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=aiperf
          cache-to: type=gha,scope=aiperf,mode=max

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Image build: \`aiperf\`"
            echo ""
            echo "- Dockerfile: \`Dockerfile\` (target: \`runtime\`)"
            echo "- Platforms: \`linux/amd64,linux/arm64\`"
            echo "- Registry: \`${REGISTRY}\`"
            echo "- Push requested: \`${PUSH_REQUESTED}\`"
            echo "- Registry token present: \`${HAS_REGISTRY_TOKEN}\`"
            echo "- Push enabled: \`${{ steps.push.outputs.enabled }}\`"
            echo ""
            echo "### Tags"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
