# Nightly build and release pipeline.
#
# Phases:
#   1. Init     — compute version strings and effective release mode (rerun-stable via artifact)
#   2. Validate — pre-commit + test placeholders
#   3. Build    — wheel (→ S3) + multi-arch containers (→ ECR)
#   4. Tag      — create nightly git tag
#   5. Stage    — [automated-release approval] ECR → NGC staging; S3 → Artifactory
#   6. Scan     — trigger GitLab security scan (fire-and-forget)
#   7. Summary  — always runs
#
# release=true (default for push/dispatch): full pipeline including approval gate and GitLab scan.
# release=false (always for schedule):     build and tag only; skip staging and scan.
#
# The ref input accepts a branch name, tag, or commit SHA. When omitted the pipeline
# builds from the tip-of-tree of the triggering ref (or the default branch for schedule).

name: Nightly

on:
  push:
    branches:
      - 'pvijayakrish/automate-release-rc'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch name, tag, or commit SHA to build from. Must resolve to a commit reachable from origin/main.'
        default: '083d3c479d2995c3074363b491d5aea833020ab4'
        required: false
      release:
        description: 'Stage artifacts and trigger GitLab security scan. Ignored for schedule — cron always sets release=false.'
        type: boolean
        default: true
      skip_security_scan:
        description: 'Skip GitLab security scan. Emergency use only — requires explicit justification.'
        type: boolean
        default: false
      publish_only:
        description: 'Skip build phase; re-stage existing artifacts. Requires wheel_version and container_tag.'
        type: boolean
        default: false
      wheel_version:
        description: 'Existing wheel version (PEP 440, e.g. 0.6.0.dev20260422123456) to re-stage. Used only when publish_only=true.'
        default: ''
        required: false
      container_tag:
        description: 'Existing container tag (nightly-YYYYMMDD-<short_sha>) to re-stage (used only when publish_only=true).'
        default: ''
        required: false
      count:
        description: 'Number of concurrent nightly runs to launch (1-20). This run counts as 1; if count>1, the fanout job dispatches (count-1) sibling runs.'
        default: '12'
        required: false

# Allow concurrent nightly runs. Shared destinations (ECR/NGC `aiperf:<container_tag>`,
# S3 wheel path, Artifactory wheel) are last-writer-wins on same-day/same-commit
# collisions; the Artifactory repo must be configured to allow overwrites.
# Each run gets a unique concurrency group so GitHub never serializes runs.
# cancel-in-progress: false — never cancel a run that may be pending human approval.
concurrency:
  group: nightly-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # PHASE 0: FAN-OUT (workflow_dispatch + push, when effective count > 1)
  # Triggers (count - 1) additional nightly runs in parallel with this one.
  # Sibling runs are dispatched with count=1 so they don't fan out again.
  # Schedule (cron) is excluded — scheduled nightlies run exactly once.
  # For push events, inputs are unset so defaults (count=12, release=true, etc.)
  # are applied via shell fallbacks; siblings are pinned to github.sha to
  # guarantee all 12 pipelines build the exact triggering commit.
  # Uses github.token with actions:write permission. workflow_dispatch and
  # repository_dispatch are explicit exceptions to GitHub's anti-recursion
  # rule, so the built-in token can dispatch sibling runs.
  # ============================================================================

  fanout:
    name: Fan out ${{ inputs.count || '12' }} concurrent runs
    runs-on: ubuntu-latest
    permissions:
      actions: write   # required for `gh workflow run` via GITHUB_TOKEN
    if: ${{ github.event_name != 'schedule' && (inputs.count || '12') != '1' }}
    steps:
      - name: Validate count
        env:
          COUNT: ${{ inputs.count || '12' }}
        run: |
          set -euo pipefail
          if ! [[ "${COUNT}" =~ ^[0-9]+$ ]]; then
            echo "::error::count must be an integer, got '${COUNT}'"
            exit 1
          fi
          if [ "${COUNT}" -lt 1 ] || [ "${COUNT}" -gt 20 ]; then
            echo "::error::count must be between 1 and 20, got '${COUNT}'"
            exit 1
          fi

      - name: Dispatch sibling nightly runs
        env:
          GH_TOKEN:  ${{ github.token }}
          COUNT:     ${{ inputs.count || '12' }}
          # For workflow_dispatch, inputs.ref defaults to the pinned main SHA.
          # For push events, inputs.ref is empty — fall back to the same pinned
          # main SHA (NOT github.sha, which may be on the dev branch and would
          # fail the Verify step's main-ancestor check on each sibling).
          # Keep this value in sync with the `ref` input's default above.
          REF:       ${{ inputs.ref || '083d3c479d2995c3074363b491d5aea833020ab4' }}
          RELEASE:   ${{ inputs.release }}
          SKIP_SCAN: ${{ inputs.skip_security_scan }}
          PUBLISH:   ${{ inputs.publish_only }}
          WHEEL_VER: ${{ inputs.wheel_version }}
          CONT_TAG:  ${{ inputs.container_tag }}
        run: |
          set -euo pipefail
          # Shell-level fallbacks for inputs that aren't populated on push events.
          # For push-triggered fanout testing: release=false skips stage+scan,
          # so siblings build (cache-hot, fast) without touching NGC/Artifactory
          # or triggering the GitLab security pipeline. publish_only=false is
          # required — publish_only=true needs wheel_version and container_tag
          # inputs which the fanout doesn't have for push events.
          RELEASE="${RELEASE:-false}"
          SKIP_SCAN="${SKIP_SCAN:-true}"
          PUBLISH="${PUBLISH:-false}"
          SIBLINGS=$((COUNT - 1))
          for i in $(seq 1 "${SIBLINGS}"); do
            gh workflow run nightly.yml \
              --repo "${GITHUB_REPOSITORY}" \
              --ref  "${GITHUB_REF_NAME}" \
              --field ref="${REF}" \
              --field release="${RELEASE}" \
              --field skip_security_scan="${SKIP_SCAN}" \
              --field publish_only="${PUBLISH}" \
              --field wheel_version="${WHEEL_VER}" \
              --field container_tag="${CONT_TAG}" \
              --field count=1
            echo "Dispatched sibling run ${i}/${SIBLINGS}"
            # Space by 2s so each child's prepare-nightly TIMESTAMP lands in a
            # unique UTC second, keeping CONTAINER_TAG and WHEEL_VERSION unique.
            sleep 2
          done
          echo "Fan-out complete: this run + ${SIBLINGS} siblings = ${COUNT} total"

  # ============================================================================
  # PHASE 1: INIT
  # Version strings are computed once and saved as a workflow artifact so that
  # partial reruns use the same versions as the original run.
  # ============================================================================

  prepare-nightly:
    name: Prepare Nightly
    runs-on: ubuntu-latest
    outputs:
      nightly_tag:    ${{ steps.version.outputs.nightly_tag }}
      wheel_version:  ${{ steps.version.outputs.wheel_version }}
      container_tag:  ${{ steps.version.outputs.container_tag }}
      wheel_filename: ${{ steps.version.outputs.wheel_filename }}
      base_version:   ${{ steps.version.outputs.base_version }}
      run_timestamp:  ${{ steps.version.outputs.run_timestamp }}
      resolved_sha:   ${{ steps.version.outputs.resolved_sha }}
      release:        ${{ steps.release.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Verify ref is reachable from main
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          REF_DESCRIPTION: ${{ inputs.ref || github.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          RESOLVED_SHA=$(git rev-parse HEAD)
          echo "Resolved ref '${REF_DESCRIPTION}' to ${RESOLVED_SHA}"
          if ! git merge-base --is-ancestor "${RESOLVED_SHA}" origin/main; then
            echo "::error::Ref '${REF_DESCRIPTION}' (${RESOLVED_SHA}) is not reachable from origin/main."
            echo "::error::On-demand nightly releases must build from commits merged to main."
            exit 1
          fi
          echo "Ref verified: ${RESOLVED_SHA} is on main."

      - name: Restore version artifact from prior attempt
        id: restore
        uses: actions/download-artifact@v4
        with:
          name: nightly-version
          path: .nightly-version/
        continue-on-error: true

      - name: Compute or restore version strings
        id: version
        run: |
          set -euo pipefail

          if [ -f ".nightly-version/version-info.env" ]; then
            echo "Restoring version strings from prior run attempt."
            # shellcheck source=/dev/null
            source .nightly-version/version-info.env
          else
            # Second-granular UTC timestamp; supports concurrent nightly runs
            # without collision as long as runs are spaced by ≥1s or differ in
            # commit. For bulletproof uniqueness under same-second/same-commit
            # concurrency, append ${GITHUB_RUN_ID} (see TODO below).
            TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
            SHORT_SHA=$(git rev-parse --short=7 HEAD)
            FULL_SHA=$(git rev-parse HEAD)

            BASE_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
            if [[ ! "${BASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Cannot parse base version from pyproject.toml (got '${BASE_VERSION}')"
              exit 1
            fi

            if [ "${{ inputs.publish_only }}" = "true" ]; then
              WHEEL_VERSION="${{ inputs.wheel_version }}"
              CONTAINER_TAG="${{ inputs.container_tag }}"
              if [ -z "${WHEEL_VERSION}" ] || [ -z "${CONTAINER_TAG}" ]; then
                echo "::error::publish_only=true requires both wheel_version and container_tag inputs"
                exit 1
              fi
              NIGHTLY_TAG="nightly-republish-${WHEEL_VERSION}"
            else
              CONTAINER_TAG="nightly-${TIMESTAMP}-${SHORT_SHA}"
              NIGHTLY_TAG="${CONTAINER_TAG}"
              WHEEL_VERSION="${BASE_VERSION}.dev${TIMESTAMP}"
            fi

            WHEEL_FILENAME="aiperf-${WHEEL_VERSION}-py3-none-any.whl"
          fi

          echo "nightly_tag=${NIGHTLY_TAG}"         >> "$GITHUB_OUTPUT"
          echo "wheel_version=${WHEEL_VERSION}"     >> "$GITHUB_OUTPUT"
          echo "container_tag=${CONTAINER_TAG}"     >> "$GITHUB_OUTPUT"
          echo "wheel_filename=${WHEEL_FILENAME}"   >> "$GITHUB_OUTPUT"
          echo "base_version=${BASE_VERSION}"       >> "$GITHUB_OUTPUT"
          echo "run_timestamp=${TIMESTAMP:-reused}" >> "$GITHUB_OUTPUT"
          echo "resolved_sha=${FULL_SHA}"           >> "$GITHUB_OUTPUT"

          mkdir -p .nightly-version
          {
            echo "NIGHTLY_TAG=${NIGHTLY_TAG}"
            echo "WHEEL_VERSION=${WHEEL_VERSION}"
            echo "CONTAINER_TAG=${CONTAINER_TAG}"
            echo "WHEEL_FILENAME=${WHEEL_FILENAME}"
            echo "BASE_VERSION=${BASE_VERSION}"
            echo "TIMESTAMP=${TIMESTAMP:-reused}"
            echo "FULL_SHA=${FULL_SHA}"
          } > .nightly-version/version-info.env

      - name: Save version artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-version
          path: .nightly-version/version-info.env
          overwrite: true
          retention-days: 7

      - name: Compute effective release mode
        id: release
        run: |
          # schedule runs build+tag only — never stage or scan.
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.release }}" = "false" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================================
  # PHASE 2: VALIDATE
  # pre-commit is a real gate. Test jobs are placeholders until runners are ready.
  # ============================================================================

  pre-commit:
    name: Pre-commit Checks
    needs: [prepare-nightly]
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_only != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: make first-time-setup PYTHON_VERSION=3.12

      - name: Run pre-commit
        run: |
          . .venv/bin/activate
          pre-commit run --all-files

  unit-tests:
    name: Unit Tests
    needs: [prepare-nightly]
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_only != 'true' }}
    steps:
      - name: Placeholder
        # Replace with: uv run pytest tests/unit/ -n auto
        run: echo "Tests temporarily disabled"

  integration-tests:
    name: Integration Tests
    needs: [prepare-nightly]
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_only != 'true' }}
    steps:
      - name: Placeholder
        # Replace with: uv run pytest -m integration -n auto
        run: echo "Tests temporarily disabled"

  # TODO: re-enable when GPU runner is available. Also restore references in
  # build-container.needs and pipeline-summary (needs: list + summary table).
  # gpu-e2e-tests:
  #   name: GPU End-to-End Tests
  #   needs: [prepare-nightly]
  #   runs-on: prod-aiperf-tester-amd-gpu-v1
  #   if: ${{ inputs.publish_only != 'true' }}
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4
  #       with:
  #         ref: ${{ inputs.ref || github.ref }}
  #
  #     - name: Run test_docs_end_to_end
  #       env:
  #         AIPERF_SOURCE_DIR: ${{ github.workspace }}
  #         CI_JOB_NAME: test_docs_end_to_end
  #       run: |
  #         bash -x tests/ci/test_docs_end_to_end/setup_test.sh
  #
  #     - name: Cleanup Docker containers
  #       if: always()
  #       run: docker compose -f docker-compose.yml down || true

  # ============================================================================
  # PHASE 3: BUILD
  # No environment: declaration — builder runners carry AWS credentials via IAM
  # instance profile. The automated-release gate is enforced at staging only.
  # ============================================================================

  build-container:
    name: Build Container (${{ matrix.arch }})
    needs: [prepare-nightly, pre-commit, unit-tests, integration-tests]
    if: ${{ inputs.publish_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: prod-aiperf-builder-amd-v1
          - arch: arm64
            platform: linux/arm64
            runner: prod-aiperf-builder-arm-v1
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Verify checkout SHA
        run: |
          ACTUAL=$(git rev-parse HEAD)
          echo "Building from SHA: ${ACTUAL}"
          if [ "${{ inputs.ref }}" = "" ] && [ "${ACTUAL}" != "${{ github.sha }}" ]; then
            echo "::warning::Checkout SHA ${ACTUAL} does not match github.sha ${{ github.sha }}"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Patch version in pyproject.toml
        uses: ./.github/actions/update-pyproject-version
        with:
          version: ${{ needs.prepare-nightly.outputs.wheel_version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ECR
        env:
          AWS_ACCOUNT_ID:     ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" \
            | docker login --username AWS --password-stdin \
                "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

      # Wheel is pure Python (py3-none-any); build once on amd64 and upload.
      # The wheel-builder layer is cached into aiperf:cache-amd64 and reused
      # by the runtime build below.
      - name: Build and extract wheel (amd64 only)
        if: matrix.arch == 'amd64'
        env:
          AWS_ACCOUNT_ID:     ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          set -euo pipefail
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
          docker buildx build \
            --platform linux/amd64 \
            --target   wheel-builder \
            --cache-from "type=registry,ref=${REGISTRY}/aiperf:cache-amd64" \
            --cache-to   "type=registry,ref=${REGISTRY}/aiperf:cache-amd64,mode=max" \
            --output     type=local,dest=./dist/ \
            .

      - name: Validate wheel (amd64 only)
        if: matrix.arch == 'amd64'
        env:
          EXPECTED_VERSION: ${{ needs.prepare-nightly.outputs.wheel_version }}
        run: |
          set -euo pipefail

          mapfile -t WHEELS < <(find dist/ -name "aiperf-*.whl" -type f)
          if [ "${#WHEELS[@]}" -eq 0 ]; then
            echo "::error::No wheel found in dist/ after build"
            exit 1
          fi
          if [ "${#WHEELS[@]}" -gt 1 ]; then
            echo "::error::Multiple wheels found in dist/ — expected exactly one:"
            printf '  %s\n' "${WHEELS[@]}"
            exit 1
          fi
          WHEEL_PATH="${WHEELS[0]}"

          uvx twine check "${WHEEL_PATH}"
          uv venv .venv-check
          uv pip install --python .venv-check/bin/python "${WHEEL_PATH}"
          INSTALLED_VERSION=$(.venv-check/bin/python -c "import aiperf; print(aiperf.__version__)")
          if [ "${INSTALLED_VERSION}" != "${EXPECTED_VERSION}" ]; then
            echo "::error::Wheel version mismatch: expected '${EXPECTED_VERSION}', got '${INSTALLED_VERSION}'"
            exit 1
          fi
          .venv-check/bin/aiperf --help

      - name: Upload wheel to S3 (amd64 only)
        if: matrix.arch == 'amd64'
        env:
          S3_BUCKET:     ${{ secrets.S3_CI_WHEELS_BUCKET }}
          WHEEL_VERSION: ${{ needs.prepare-nightly.outputs.wheel_version }}
        run: |
          set -euo pipefail
          WHEEL=$(find dist/ -name "aiperf-*.whl" | head -1)
          aws s3 cp "${WHEEL}" "s3://${S3_BUCKET}/aiperf/nightly/${WHEEL_VERSION}/" --sse AES256

      - name: Build and push ${{ matrix.arch }} image to ECR
        env:
          AWS_ACCOUNT_ID:     ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          CONTAINER_TAG:      ${{ needs.prepare-nightly.outputs.container_tag }}
        run: |
          set -euo pipefail
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
          IMAGE_TAG="${CONTAINER_TAG}-${{ matrix.arch }}"

          refresh_ecr_token() {
            while sleep 21600; do
              aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" \
                | docker login --username AWS --password-stdin "${REGISTRY}" 2>/dev/null || true
            done
          }
          refresh_ecr_token &
          REFRESH_PID=$!
          trap 'kill ${REFRESH_PID} 2>/dev/null || true' EXIT

          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --target   runtime \
            --cache-from "type=registry,ref=${REGISTRY}/aiperf:cache-${{ matrix.arch }}" \
            --cache-to   "type=registry,ref=${REGISTRY}/aiperf:cache-${{ matrix.arch }},mode=max" \
            --push \
            --tag "${REGISTRY}/aiperf:${IMAGE_TAG}" \
            .

          DIGEST=$(docker buildx imagetools inspect "${REGISTRY}/aiperf:${IMAGE_TAG}" \
            --format '{{.Manifest.Digest}}')
          echo "Pushed ${REGISTRY}/aiperf:${IMAGE_TAG} — digest: ${DIGEST}"

  create-multiarch-manifest-ecr:
    name: Create Multi-arch Manifest (ECR)
    needs: [prepare-nightly, build-container]
    runs-on: prod-aiperf-default-v1
    if: ${{ inputs.publish_only != 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Get ECR login token
        id: ecr
        env:
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          echo "password=$(aws ecr get-login-password --region "${AWS_DEFAULT_REGION}")" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest on ECR
        uses: ./.github/actions/create-multiarch-manifest
        with:
          registry:          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_DEFAULT_REGION }}.amazonaws.com
          registry-username: AWS
          registry-password: ${{ steps.ecr.outputs.password }}
          target-image: >-
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_DEFAULT_REGION }}.amazonaws.com/aiperf:${{ needs.prepare-nightly.outputs.container_tag }}
          source-images: >-
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_DEFAULT_REGION }}.amazonaws.com/aiperf:${{ needs.prepare-nightly.outputs.container_tag }}-amd64
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_DEFAULT_REGION }}.amazonaws.com/aiperf:${{ needs.prepare-nightly.outputs.container_tag }}-arm64

  # ============================================================================
  # PHASE 4: STAGE
  # Both jobs run under automated-release, which requires human approval before
  # proceeding (configured in GitHub: Settings > Environments > automated-release).
  # Runs on all triggers unless explicitly disabled via workflow_dispatch release=false.
  # ============================================================================

  stage-nightly-container:
    name: Stage Container (ECR → NGC Staging)
    needs: [prepare-nightly, create-multiarch-manifest-ecr]
    runs-on: prod-aiperf-default-v1
    environment: automated-release
    if: ${{ inputs.publish_only != 'true' && needs.prepare-nightly.outputs.release == 'true' }}
    env:
      CRANE_VERSION: v0.20.2
      CRANE_SHA256: ''
    steps:
      - name: Install crane
        run: |
          set -euo pipefail
          TARBALL="go-containerregistry_Linux_x86_64.tar.gz"
          curl -fsSL \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/${TARBALL}" \
            -o "${TARBALL}"
          if [ -n "${CRANE_SHA256}" ]; then
            echo "${CRANE_SHA256}  ${TARBALL}" | sha256sum --check
          else
            echo "::warning::CRANE_SHA256 not set — skipping checksum verification"
          fi
          tar -xzf "${TARBALL}" crane
          sudo mv crane /usr/local/bin/crane
          rm "${TARBALL}"

      - name: Log in to ECR and NGC staging
        env:
          AWS_ACCOUNT_ID:     ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          NGC_TOKEN:          ${{ secrets.NGC_PUBLISH_TOKEN }}
          NGC_USERNAME:       ${{ secrets.NGC_PUBLISH_USERNAME }}
        run: |
          aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" \
            | crane auth login \
                "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com" \
                --username AWS --password-stdin
          echo "${NGC_TOKEN}" | crane auth login nvcr.io \
            --username "${NGC_USERNAME}" --password-stdin

      - name: Copy multi-arch images ECR → NGC staging
        env:
          AWS_ACCOUNT_ID:         ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEFAULT_REGION:     ${{ secrets.AWS_DEFAULT_REGION }}
          NGC_STAGING_IMAGE_BASE: ${{ secrets.NGC_STAGING_IMAGE_BASE }}
          CONTAINER_TAG:          ${{ needs.prepare-nightly.outputs.container_tag }}
        run: |
          set -euo pipefail
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

          for ARCH in amd64 arm64; do
            crane copy \
              "${ECR_REGISTRY}/aiperf:${CONTAINER_TAG}-${ARCH}" \
              "${NGC_STAGING_IMAGE_BASE}/aiperf:${CONTAINER_TAG}-${ARCH}"
          done

          crane delete "${NGC_STAGING_IMAGE_BASE}/aiperf:${CONTAINER_TAG}" 2>/dev/null || true
          crane index append \
            --manifest "${NGC_STAGING_IMAGE_BASE}/aiperf:${CONTAINER_TAG}-amd64" \
            --manifest "${NGC_STAGING_IMAGE_BASE}/aiperf:${CONTAINER_TAG}-arm64" \
            --tag      "${NGC_STAGING_IMAGE_BASE}/aiperf:${CONTAINER_TAG}"
          echo "Container staged: ${NGC_STAGING_IMAGE_BASE}/aiperf:${CONTAINER_TAG}"

  stage-nightly-wheel:
    name: Stage Wheel (S3 → Artifactory)
    needs: [prepare-nightly, create-multiarch-manifest-ecr]
    # Use the builder runner: prod-aiperf-default-v1's role lacks s3:GetObject on
    # the wheels bucket. Revisit when IAM is widened.
    runs-on: prod-aiperf-builder-amd-v1
    environment: automated-release
    if: ${{ inputs.publish_only != 'true' && needs.prepare-nightly.outputs.release == 'true' }}
    steps:
      - name: Upload wheel from S3 to Artifactory
        env:
          S3_BUCKET:         ${{ secrets.S3_CI_WHEELS_BUCKET }}
          ARTIFACTORY_URL:   ${{ secrets.ARTIFACTORY_URL }}
          ARTIFACTORY_USER:  ${{ secrets.ARTIFACTORY_USER }}
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
          WHEEL_VERSION:     ${{ needs.prepare-nightly.outputs.wheel_version }}
          WHEEL_FILENAME:    ${{ needs.prepare-nightly.outputs.wheel_filename }}
        run: |
          set -euo pipefail
          TMPDIR=$(mktemp -d)
          trap 'rm -rf "${TMPDIR}"' EXIT

          # Single-object copy (no --recursive) so we only need s3:GetObject.
          aws s3 cp \
            "s3://${S3_BUCKET}/aiperf/nightly/${WHEEL_VERSION}/${WHEEL_FILENAME}" \
            "${TMPDIR}/${WHEEL_FILENAME}"

          # Raw Artifactory deploy via native repo API. The PyPI handler
          # (/api/pypi/) does not accept sub-path deploys — it expects the
          # repo root URL. ARTIFACTORY_URL must be the generic repo base:
          # https://<host>/artifactory/<repo> (no /api/pypi/, no sub-path).
          TARGET_URL="${ARTIFACTORY_URL%/}/nightly/${WHEEL_FILENAME}"
          BODY_FILE=$(mktemp)
          HTTP_CODE=$(curl -sSL -o "${BODY_FILE}" -w "%{http_code}" \
            -u "${ARTIFACTORY_USER}:${ARTIFACTORY_TOKEN}" \
            -T "${TMPDIR}/${WHEEL_FILENAME}" \
            "${TARGET_URL}")
          if [ "${HTTP_CODE}" != "201" ]; then
            echo "::error::Artifactory deploy failed: HTTP ${HTTP_CODE} at ${TARGET_URL}"
            cat "${BODY_FILE}" || true
            exit 1
          fi
          echo "Wheel staged to Artifactory: ${TARGET_URL}"

  # ============================================================================
  # PHASE 6: TRIGGER GITLAB SECURITY SCAN
  # Fire-and-forget. Passes full artifact locations so GitLab can pull containers
  # from NGC staging and download the wheel from Artifactory without further input.
  # ============================================================================

  trigger-gitlab-security-scan:
    name: Trigger GitLab Security Scan
    needs: [prepare-nightly, stage-nightly-container, stage-nightly-wheel]
    runs-on:
      group: gitlab_ci_runners
    environment: automated-release
    if: ${{ inputs.publish_only != 'true' && inputs.skip_security_scan != 'true' && needs.prepare-nightly.outputs.release == 'true' }}
    steps:
      - name: Trigger GitLab pipeline
        env:
          GITLAB_TRIGGER_TOKEN:   ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          GITLAB_TRIGGER_URL:     ${{ secrets.GITLAB_PIPELINE_URL }}
          NIGHTLY_TAG:            ${{ needs.prepare-nightly.outputs.nightly_tag }}
          WHEEL_VERSION:          ${{ needs.prepare-nightly.outputs.wheel_version }}
          CONTAINER_TAG:          ${{ needs.prepare-nightly.outputs.container_tag }}
          RESOLVED_SHA:           ${{ needs.prepare-nightly.outputs.resolved_sha }}
          ARTIFACTORY_PYPI_URL:   ${{ secrets.ARTIFACTORY_PYPI_URL }}
        run: |
          set -euo pipefail

          RELEASE_TYPE="ondemand"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            RELEASE_TYPE="nightly"
          fi

          TOKEN_FILE=$(mktemp)
          echo -n "${GITLAB_TRIGGER_TOKEN}" > "${TOKEN_FILE}"
          trap 'rm -f "${TOKEN_FILE}"' EXIT

          RESPONSE=$(curl -fsSL \
            --request POST \
            --form "token=<${TOKEN_FILE}" \
            --form "ref=main" \
            --form "variables[PIPELINE_TYPE]=security" \
            --form "variables[RELEASE_TYPE]=${RELEASE_TYPE}" \
            --form "variables[DRY_RUN]=true" \
            --form "variables[PROJECT]=aiperf" \
            --form "variables[SOURCE_BRANCH]=${GITHUB_REF_NAME}" \
            --form "variables[NIGHTLY_TAG]=${NIGHTLY_TAG}" \
            --form "variables[WHEEL_VERSION]=${WHEEL_VERSION}" \
            --form "variables[CONTAINER_TAG]=${CONTAINER_TAG}" \
            --form "variables[COMMIT_SHA]=${RESOLVED_SHA}" \
            --form "variables[GITHUB_RUN_ID]=${GITHUB_RUN_ID}" \
            --form "variables[ARTIFACTS]=wheel,container" \
            --form "variables[ARTIFACTORY_PYPI_URL]=${ARTIFACTORY_PYPI_URL}" \
            --form "variables[ENABLE_PULSE_SCAN]=true" \
            --form "variables[ENABLE_WHEEL_SCAN]=true" \
            --form "variables[ENABLE_SONARQUBE]=true" \
            --form "variables[SONAR_REPO]=aiperf" \
            --form "variables[SONAR_BRANCH]=${RESOLVED_SHA}" \
            "${GITLAB_TRIGGER_URL}")

          PIPELINE_ID=$(echo "${RESPONSE}" | jq -r '.id // empty')
          if [ -z "${PIPELINE_ID}" ]; then
            echo "::error::Failed to trigger GitLab pipeline or parse response"
            exit 1
          fi

          echo "GitLab security scan triggered: pipeline ID ${PIPELINE_ID}"

  # ============================================================================
  # PHASE 7: SUMMARY
  # ============================================================================

  pipeline-summary:
    name: Pipeline Summary
    needs:
      - prepare-nightly
      - pre-commit
      - unit-tests
      - integration-tests
      # - gpu-e2e-tests  # temporarily commented out with the job
      - build-container
      - create-multiarch-manifest-ecr
      - stage-nightly-container
      - stage-nightly-wheel
      - trigger-gitlab-security-scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write pipeline summary
        env:
          NIGHTLY_TAG:    ${{ needs.prepare-nightly.outputs.nightly_tag }}
          WHEEL_VERSION: ${{ needs.prepare-nightly.outputs.wheel_version }}
          CONTAINER_TAG:  ${{ needs.prepare-nightly.outputs.container_tag }}
        run: |
          {
            echo "## Nightly Pipeline Summary"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Tag | \`${NIGHTLY_TAG}\` |"
            echo "| Version | \`${WHEEL_VERSION}\` |"
            echo "| Container Tag | \`${CONTAINER_TAG}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Git ref | \`${{ inputs.ref || github.ref }}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Release mode | ${{ needs.prepare-nightly.outputs.release }} |"
            echo ""
            echo "### Quality Gates"
            echo "| Gate | Result |"
            echo "|------|--------|"
            echo "| pre-commit | ${{ needs.pre-commit.result }} |"
            echo "| unit-tests | ${{ needs.unit-tests.result }} |"
            echo "| integration-tests | ${{ needs.integration-tests.result }} |"
            echo ""
            echo "### Build + Upload"
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| build-container (→ ECR + S3 wheel) | ${{ needs.build-container.result }} |"
            echo "| create-multiarch-manifest-ecr | ${{ needs.create-multiarch-manifest-ecr.result }} |"
            echo ""
            echo "### Stage + Scan"
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| stage-nightly-container (→ NGC staging) | ${{ needs.stage-nightly-container.result }} |"
            echo "| stage-nightly-wheel (→ Artifactory) | ${{ needs.stage-nightly-wheel.result }} |"
            echo "| trigger-gitlab-security-scan | ${{ needs.trigger-gitlab-security-scan.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on failure
        if: ${{ failure() }}
        env:
          NIGHTLY_TAG:   ${{ needs.prepare-nightly.outputs.nightly_tag }}
          RUN_URL:       ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_WEBHOOK: ${{ secrets.NIGHTLY_SLACK_WEBHOOK }}
        run: |
          if [ -z "${SLACK_WEBHOOK}" ]; then
            echo "::warning::NIGHTLY_SLACK_WEBHOOK is not configured — skipping failure notification"
            exit 0
          fi
          curl -fsSL \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{\"text\":\"Nightly pipeline failed: ${NIGHTLY_TAG}\n${RUN_URL}\"}" \
            "${SLACK_WEBHOOK}"
