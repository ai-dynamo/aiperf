# Nightly build and release pipeline.
#
# Phases:
#   1. Init     — compute version strings and effective release mode (rerun-stable via artifact)
#   2. Validate — pre-commit + test placeholders
#   3. Build    — wheel (→ Artifactory) + multi-arch containers (→ ECR)
#   4. Tag      — create nightly git tag
#   5. Stage    — [automated-release approval] ECR → NGC staging
#   6. Scan     — trigger GitLab security scan (fire-and-forget)
#   7. Summary  — always runs
#
# release=true (default for push/dispatch): full pipeline including approval gate and GitLab scan.
# release=false (always for schedule):     build and tag only; skip staging and scan.
#
# The ref input accepts a branch name, tag, or commit SHA. When omitted the pipeline
# builds from the tip-of-tree of the triggering ref (or the default branch for schedule).

name: Nightly

on:
  push:
    branches:
      - 'pvijayakrish/automate-release-rc'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch name, tag, or commit SHA to build from. Defaults to tip-of-tree on the triggering ref.'
        default: ''
        required: false
      release:
        description: 'Stage artifacts and trigger GitLab security scan. Ignored for schedule — cron always sets release=false.'
        type: boolean
        default: true
      skip_security_scan:
        description: 'Skip GitLab security scan. Emergency use only — requires explicit justification.'
        type: boolean
        default: false
      publish_only:
        description: 'Skip build phase; re-stage existing artifacts. Requires pep440_version.'
        type: boolean
        default: false
      pep440_version:
        description: 'Existing PEP 440 version to re-stage (used only when publish_only=true).'
        default: ''
        required: false

# Prevent overlapping nightly runs from corrupting shared ECR tags and Artifactory packages.
# cancel-in-progress: false — never cancel a run that may be pending human approval.
concurrency:
  group: nightly-pipeline
  cancel-in-progress: false

env:
  BUILDER_NAME: b-${{ github.run_id }}-${{ github.run_attempt }}

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # PHASE 1: INIT
  # Compute the nightly date once. GitHub Actions preserves outputs from
  # previously-successful jobs across re-runs, so the date is automatically
  # pinned if build-artifacts is retried on a subsequent day.
  # ============================================================================

  prepare-nightly:
    name: Prepare Nightly
    runs-on: ubuntu-latest
    outputs:
      date:    ${{ steps.date.outputs.date }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - name: Compute nightly date
        id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Compute effective release mode
        id: release
        run: |
          # schedule runs build+tag only — never stage or scan.
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.release }}" = "false" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  pre-warm-builder:
    name: Pre-warm K8s Builder
    runs-on: prod-aiperf-default-v1
    if: ${{ inputs.publish_only != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Bootstrap BuildKit workers
        uses: ./.github/actions/bootstrap-buildkit
        with:
          builder_name: ${{ env.BUILDER_NAME }}
          fresh_builder: 'true'

  # ============================================================================
  # PHASE 2: VALIDATE
  # pre-commit is a real gate. Test jobs are placeholders until runners are ready.
  # ============================================================================

  pre-commit:
    name: Pre-commit Checks
    needs: [prepare-nightly]
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_only != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: make first-time-setup PYTHON_VERSION=3.12

      - name: Run pre-commit
        run: |
          . .venv/bin/activate
          pre-commit run --all-files

  unit-tests:
    name: Unit Tests
    needs: [prepare-nightly]
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_only != 'true' }}
    steps:
      - name: Placeholder
        # Replace with: uv run pytest tests/unit/ -n auto
        run: echo "Tests temporarily disabled"

  integration-tests:
    name: Integration Tests
    needs: [prepare-nightly]
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_only != 'true' }}
    steps:
      - name: Placeholder
        # Replace with: uv run pytest -m integration -n auto
        run: echo "Tests temporarily disabled"

  gpu-e2e-tests:
    name: GPU End-to-End Tests
    needs: [prepare-nightly]
    runs-on: prod-aiperf-tester-amd-gpu-v1
    if: false  # TODO: restore to ${{ inputs.publish_only != 'true' }} once GPU runners are healthy
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Run test_docs_end_to_end
        env:
          AIPERF_SOURCE_DIR: ${{ github.workspace }}
          CI_JOB_NAME: test_docs_end_to_end
        run: |
          bash -x tests/ci/test_docs_end_to_end/setup_test.sh

      - name: Cleanup Docker containers
        if: always()
        run: docker compose -f docker-compose.yml down || true

  # ============================================================================
  # PHASE 3: BUILD
  # No environment: declaration — builder runners carry AWS credentials via IAM
  # instance profile. The automated-release gate is enforced at container staging only.
  # ============================================================================

  build-artifacts:
    name: Build Artifacts
    needs: [prepare-nightly, pre-warm-builder]  # TODO: restore [prepare-nightly, pre-commit, unit-tests, integration-tests, gpu-e2e-tests, pre-warm-builder] once GPU runners are back
    runs-on: prod-aiperf-default-v1
    outputs:
      pep440_version: ${{ steps.version.outputs.pep440_version }}
      nightly_tag:    ${{ steps.version.outputs.nightly_tag }}
      wheel_filename: ${{ steps.version.outputs.wheel_filename }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Verify checkout SHA
        run: |
          ACTUAL=$(git rev-parse HEAD)
          echo "Building from SHA: ${ACTUAL}"
          if [ "${{ inputs.ref }}" = "" ] && [ "${ACTUAL}" != "${{ github.sha }}" ]; then
            echo "::warning::Checkout SHA ${ACTUAL} does not match github.sha ${{ github.sha }}"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Compute version strings
        id: version
        run: |
          set -euo pipefail
          if [ "${{ inputs.publish_only }}" = "true" ]; then
            PEP440_VERSION="${{ inputs.pep440_version }}"
            if [ -z "${PEP440_VERSION}" ]; then
              echo "::error::publish_only=true requires pep440_version input"
              exit 1
            fi
          else
            PEP440_VERSION=$(uv run --with commitizen --with tomlkit python tools/version.py nightly --date "${{ needs.prepare-nightly.outputs.date }}")
          fi
          NIGHTLY_TAG=$(uv run --with commitizen --with tomlkit python tools/version.py to-semver "${PEP440_VERSION}")
          echo "pep440_version=${PEP440_VERSION}" >> "$GITHUB_OUTPUT"
          echo "nightly_tag=${NIGHTLY_TAG}"       >> "$GITHUB_OUTPUT"
          echo "wheel_filename=aiperf-${PEP440_VERSION}-py3-none-any.whl" >> "$GITHUB_OUTPUT"

      - name: Patch version in pyproject.toml
        if: ${{ inputs.publish_only != 'true' }}
        run: uv run --with commitizen --with tomlkit python tools/version.py set "${{ steps.version.outputs.pep440_version }}"

      - name: Bootstrap BuildKit
        if: ${{ inputs.publish_only != 'true' }}
        uses: ./.github/actions/bootstrap-buildkit
        with:
          builder_name: ${{ env.BUILDER_NAME }}

      - name: Log in to ECR
        if: ${{ inputs.publish_only != 'true' }}
        env:
          AWS_ACCOUNT_ID:     ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" \
            | docker login --username AWS --password-stdin \
                "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

      - name: Build and push multi-arch image to ECR
        if: ${{ inputs.publish_only != 'true' }}
        env:
          AWS_ACCOUNT_ID:     ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          NIGHTLY_TAG:        ${{ steps.version.outputs.nightly_tag }}
        run: |
          set -euo pipefail
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target   runtime \
            --cache-to "type=local,dest=/tmp/buildkit-cache,mode=max" \
            --push \
            --tag "${REGISTRY}/aiperf:${NIGHTLY_TAG}" \
            .

          DIGEST=$(docker buildx imagetools inspect "${REGISTRY}/aiperf:${NIGHTLY_TAG}" \
            --format '{{.Manifest.Digest}}')
          echo "Pushed ${REGISTRY}/aiperf:${NIGHTLY_TAG} — digest: ${DIGEST}"

      - name: Extract license artifacts
        if: ${{ inputs.publish_only != 'true' }}
        run: |
          set -euo pipefail
          for ARCH in amd64 arm64; do
            docker buildx build \
              --progress=plain \
              --platform "linux/${ARCH}" \
              --target python-licenses \
              --cache-from "type=local,src=/tmp/buildkit-cache" \
              --output "type=local,dest=./license-raw-${ARCH}" \
              .
            mkdir -p "./license-artifacts/${ARCH}"
            cp -r "./license-raw-${ARCH}/opt/licenses/." "./license-artifacts/${ARCH}/"
            # Merge python and dpkg CSVs into a single deps.csv (shared schema)
            {
              cat "./license-artifacts/${ARCH}/python/python-deps.csv"
              tail -n +2 "./license-artifacts/${ARCH}/dpkg/dpkg-deps.csv"
            } > "./license-artifacts/${ARCH}/deps.csv"
          done

      - name: Upload license artifacts
        if: ${{ inputs.publish_only != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: license-artifacts-${{ steps.version.outputs.nightly_tag }}
          path: license-artifacts/
          if-no-files-found: error

      - name: Extract wheel
        if: ${{ inputs.publish_only != 'true' }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --target wheel-builder \
            --cache-from "type=local,src=/tmp/buildkit-cache" \
            --output "type=local,dest=./wheel-out" \
            .

      - name: Validate wheel
        if: ${{ inputs.publish_only != 'true' }}
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.pep440_version }}
        run: |
          set -euo pipefail
          mapfile -t WHEELS < <(find wheel-out/dist/ -name "aiperf-*.whl" -type f)
          if [ "${#WHEELS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one wheel, found ${#WHEELS[@]}"
            exit 1
          fi
          WHEEL_PATH="${WHEELS[0]}"
          uvx twine check "${WHEEL_PATH}"
          uv venv .venv-check
          uv pip install --python .venv-check/bin/python "${WHEEL_PATH}"
          INSTALLED_VERSION=$(.venv-check/bin/python -c "import aiperf; print(aiperf.__version__)")
          if [ "${INSTALLED_VERSION}" != "${EXPECTED_VERSION}" ]; then
            echo "::error::Wheel version mismatch: expected '${EXPECTED_VERSION}', got '${INSTALLED_VERSION}'"
            exit 1
          fi
          .venv-check/bin/aiperf --help

      - name: Set up JFrog CLI
        if: ${{ inputs.publish_only != 'true' }}
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL:      ${{ secrets.ARTIFACTORY_BASE_URL }}
          JF_USER:     ${{ secrets.ARTIFACTORY_USER }}
          JF_PASSWORD: ${{ secrets.ARTIFACTORY_TOKEN }}

      - name: Upload wheel to Artifactory
        if: ${{ inputs.publish_only != 'true' }}
        env:
          ARTIFACTORY_REPO_NAME: ${{ secrets.ARTIFACTORY_REPO_NAME }}
          PEP440_VERSION:        ${{ steps.version.outputs.pep440_version }}
        run: |
          set -euo pipefail
          RAW_DATE="${{ needs.prepare-nightly.outputs.date }}"
          FORMATTED_DATE="${RAW_DATE:0:4}.${RAW_DATE:4:2}.${RAW_DATE:6:2}"
          WHEEL=$(find wheel-out/dist/ -name "aiperf-*.whl" | head -1)
          TARGET="${ARTIFACTORY_REPO_NAME}/nightly/${FORMATTED_DATE}/${{ github.workflow_id }}-${{ github.run_id }}/"
          jf rt upload "${WHEEL}" "${TARGET}" --flat
          echo "Wheel uploaded to Artifactory: ${TARGET}"

  # ============================================================================
  # PHASE 3b: CLEANUP
  # ============================================================================

  clean-k8s-builder:
    name: Clean K8s Builder
    needs: [pre-warm-builder, build-artifacts]
    if: always()
    runs-on: prod-aiperf-default-v1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Re-register builder context (skip bootstrap)
        uses: ./.github/actions/bootstrap-buildkit
        continue-on-error: true
        with:
          builder_name: ${{ env.BUILDER_NAME }}
          skip_bootstrap: 'true'

      - name: Remove builder
        run: docker buildx rm ${{ env.BUILDER_NAME }} || true

  # ============================================================================
  # PHASE 4: TAG
  # ============================================================================

  create-nightly-tag:
    name: Create Nightly Tag
    needs: [prepare-nightly, build-artifacts]
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_only != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.NIGHTLY_GITHUB_PAT || github.token }}
          ref: ${{ inputs.ref || github.ref }}

      - name: Push nightly tag (idempotent)
        env:
          NIGHTLY_TAG: ${{ needs.build-artifacts.outputs.nightly_tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          EXISTING_SHA=$(git ls-remote origin "refs/tags/${NIGHTLY_TAG}" | awk '{print $1}')
          HEAD_SHA=$(git rev-parse HEAD)

          if [ -n "${EXISTING_SHA}" ]; then
            COMMIT_SHA=$(git ls-remote origin "refs/tags/${NIGHTLY_TAG}^{}" | awk '{print $1}')
            if [ "${COMMIT_SHA:-${EXISTING_SHA}}" = "${HEAD_SHA}" ]; then
              echo "Tag ${NIGHTLY_TAG} already exists at ${HEAD_SHA} — skipping."
              exit 0
            else
              echo "::error::Tag ${NIGHTLY_TAG} exists at ${COMMIT_SHA:-${EXISTING_SHA}}, not ${HEAD_SHA}."
              echo "::error::Version collision — investigate before proceeding."
              exit 1
            fi
          fi

          git tag -a "${NIGHTLY_TAG}" -m "Nightly build ${NIGHTLY_TAG}"
          echo "Tag created locally (not pushed): ${NIGHTLY_TAG}"

  # ============================================================================
  # PHASE 5: STAGE
  # Both jobs run under automated-release, which requires human approval before
  # proceeding (configured in GitHub: Settings > Environments > automated-release).
  # Runs on all triggers unless explicitly disabled via workflow_dispatch release=false.
  # ============================================================================

  stage-nightly-container:
    name: Stage Container (ECR → NGC Staging)
    needs: [prepare-nightly, build-artifacts, create-nightly-tag]
    runs-on: prod-aiperf-default-v1
    environment: automated-release
    if: ${{ inputs.publish_only != 'true' && needs.prepare-nightly.outputs.release == 'true' }}
    env:
      CRANE_VERSION: v0.20.2
      CRANE_SHA256: ''
    steps:
      - name: Install crane
        run: |
          set -euo pipefail
          TARBALL="go-containerregistry_Linux_x86_64.tar.gz"
          curl -fsSL \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/${TARBALL}" \
            -o "${TARBALL}"
          if [ -n "${CRANE_SHA256}" ]; then
            echo "${CRANE_SHA256}  ${TARBALL}" | sha256sum --check
          else
            echo "::warning::CRANE_SHA256 not set — skipping checksum verification"
          fi
          tar -xzf "${TARBALL}" crane
          sudo mv crane /usr/local/bin/crane
          rm "${TARBALL}"

      - name: Log in to ECR and NGC staging
        env:
          AWS_ACCOUNT_ID:     ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          NGC_TOKEN:          ${{ secrets.NGC_PUBLISH_TOKEN }}
          NGC_USERNAME:       ${{ secrets.NGC_PUBLISH_USERNAME }}
        run: |
          aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" \
            | crane auth login \
                "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com" \
                --username AWS --password-stdin
          echo "${NGC_TOKEN}" | crane auth login nvcr.io \
            --username "${NGC_USERNAME}" --password-stdin

      - name: Copy multi-arch image ECR → NGC staging
        env:
          AWS_ACCOUNT_ID:         ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEFAULT_REGION:     ${{ secrets.AWS_DEFAULT_REGION }}
          NGC_STAGING_IMAGE_BASE: ${{ secrets.NGC_STAGING_IMAGE_BASE }}
          NIGHTLY_TAG:            ${{ needs.build-artifacts.outputs.nightly_tag }}
        run: |
          set -euo pipefail
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
          crane copy \
            "${ECR_REGISTRY}/aiperf:${NIGHTLY_TAG}" \
            "${NGC_STAGING_IMAGE_BASE}/aiperf-nightly:${NIGHTLY_TAG}"
          echo "Container staged: ${NGC_STAGING_IMAGE_BASE}/aiperf-nightly:${NIGHTLY_TAG}"

  # ============================================================================
  # PHASE 6: TRIGGER GITLAB SECURITY SCAN
  # Fire-and-forget. Passes full artifact locations so GitLab can pull containers
  # from NGC staging and download the wheel from Artifactory without further input.
  # ============================================================================

  trigger-gitlab-security-scan:
    name: Trigger GitLab Security Scan
    needs: [prepare-nightly, build-artifacts, stage-nightly-container]
    runs-on:
      group: gitlab_ci_runners
    environment: automated-release
    if: ${{ inputs.publish_only != 'true' && inputs.skip_security_scan != 'true' && needs.prepare-nightly.outputs.release == 'true' }}
    steps:
      - name: Trigger GitLab pipeline
        env:
          GITLAB_TRIGGER_TOKEN:   ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          GITLAB_TRIGGER_URL:     ${{ secrets.GITLAB_PIPELINE_URL }}
          NIGHTLY_TAG:            ${{ needs.build-artifacts.outputs.nightly_tag }}
          PEP440_VERSION:         ${{ needs.build-artifacts.outputs.pep440_version }}
          ARTIFACTORY_PYPI_URL:   ${{ secrets.ARTIFACTORY_PYPI_URL }}
        run: |
          set -euo pipefail

          RELEASE_TYPE="ondemand"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            RELEASE_TYPE="nightly"
          fi

          TOKEN_FILE=$(mktemp)
          echo -n "${GITLAB_TRIGGER_TOKEN}" > "${TOKEN_FILE}"
          trap 'rm -f "${TOKEN_FILE}"' EXIT

          RESPONSE=$(curl -fsSL \
            --request POST \
            --form "token=<${TOKEN_FILE}" \
            --form "ref=main" \
            --form "variables[PIPELINE_TYPE]=security" \
            --form "variables[RELEASE_TYPE]=${RELEASE_TYPE}" \
            --form "variables[PROJECT]=aiperf" \
            --form "variables[SOURCE_BRANCH]=${GITHUB_REF_NAME}" \
            --form "variables[NIGHTLY_TAG]=${NIGHTLY_TAG}" \
            --form "variables[PEP440_VERSION]=${PEP440_VERSION}" \
            --form "variables[COMMIT_SHA]=${{ github.sha }}" \
            --form "variables[GITHUB_RUN_ID]=${GITHUB_RUN_ID}" \
            --form "variables[ARTIFACTS]=wheel,container" \
            --form "variables[ARTIFACTORY_PYPI_URL]=${ARTIFACTORY_PYPI_URL}" \
            --form "variables[ENABLE_PULSE_SCAN]=true" \
            --form "variables[ENABLE_WHEEL_SCAN]=true" \
            --form "variables[ENABLE_SONARQUBE]=true" \
            --form "variables[SONAR_REPO]=aiperf" \
            --form "variables[SONAR_BRANCH]=${GITHUB_REF_NAME}" \
            "${GITLAB_TRIGGER_URL}")

          PIPELINE_ID=$(echo "${RESPONSE}" | jq -r '.id // empty')
          if [ -z "${PIPELINE_ID}" ]; then
            echo "::error::Failed to trigger GitLab pipeline or parse response"
            exit 1
          fi

          echo "GitLab security scan triggered: pipeline ID ${PIPELINE_ID}"

  # ============================================================================
  # PHASE 7: SUMMARY
  # ============================================================================

  pipeline-summary:
    name: Pipeline Summary
    needs:
      - prepare-nightly
      - pre-warm-builder
      - pre-commit
      - unit-tests
      - integration-tests
      - gpu-e2e-tests
      - build-artifacts
      - clean-k8s-builder
      - create-nightly-tag
      - stage-nightly-container
      - trigger-gitlab-security-scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write pipeline summary
        env:
          NIGHTLY_TAG:    ${{ needs.build-artifacts.outputs.nightly_tag }}
          PEP440_VERSION: ${{ needs.build-artifacts.outputs.pep440_version }}
        run: |
          {
            echo "## Nightly Pipeline Summary"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Tag | \`${NIGHTLY_TAG}\` |"
            echo "| Version | \`${PEP440_VERSION}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Git ref | \`${{ inputs.ref || github.ref }}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Release mode | ${{ needs.prepare-nightly.outputs.release }} |"
            echo ""
            echo "### Quality Gates"
            echo "| Gate | Result |"
            echo "|------|--------|"
            echo "| pre-commit | ${{ needs.pre-commit.result }} |"
            echo "| unit-tests | ${{ needs.unit-tests.result }} |"
            echo "| integration-tests | ${{ needs.integration-tests.result }} |"
            echo "| gpu-e2e-tests | ${{ needs.gpu-e2e-tests.result }} |"
            echo ""
            echo "### Build + Upload"
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| build-artifacts (→ ECR + Artifactory) | ${{ needs.build-artifacts.result }} |"
            echo "| create-nightly-tag | ${{ needs.create-nightly-tag.result }} |"
            echo ""
            echo "### Stage + Scan"
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| stage-nightly-container (→ NGC staging) | ${{ needs.stage-nightly-container.result }} |"
            echo "| trigger-gitlab-security-scan | ${{ needs.trigger-gitlab-security-scan.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on failure
        if: ${{ failure() }}
        env:
          NIGHTLY_TAG:   ${{ needs.build-artifacts.outputs.nightly_tag }}
          RUN_URL:       ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_WEBHOOK: ${{ secrets.NIGHTLY_SLACK_WEBHOOK }}
        run: |
          if [ -z "${SLACK_WEBHOOK}" ]; then
            echo "::warning::NIGHTLY_SLACK_WEBHOOK is not configured — skipping failure notification"
            exit 0
          fi
          curl -fsSL \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{\"text\":\"Nightly pipeline failed: ${NIGHTLY_TAG}\n${RUN_URL}\"}" \
            "${SLACK_WEBHOOK}"
