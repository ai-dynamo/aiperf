name: "Pre-commit"

on:
  pull_request:
  merge_group:
    types: [checks_requested]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    # A merge group has no pull_request payload; its base is the target branch
    # tip in this repository, and its diff also covers PRs queued ahead of it.
    env:
      BASE_URL: ${{ github.event.pull_request.base.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Fetch base commit
      run: |
        git remote add base "${BASE_URL}"
        git fetch --no-tags --depth=1 base "${BASE_SHA}"

    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        make first-time-setup PYTHON_VERSION=3.11

    - uses: pre-commit/action@v3.0.1
      with:
        extra_args: >-
          --from-ref ${{ env.BASE_SHA }}
          --to-ref   ${{ github.sha }}
