name: "Run Unit Tests"

# The Linux matrix leg runs on Velonix. Only run repository code from trusted
# branch pushes and merge queue groups; fork PRs enter CI after being copied
# to pull-request/<number>, and only PRs whose vetted head already passed
# Unit Tests Gate can be added to the merge queue.
on:
  push:
    branches:
      - main
      - 'pull-request/[0-9]+'
      - 'release/*'
  merge_group:
    types: [checks_requested]

# A new copy of a PR supersedes the run on its previous head. Every other
# event gets its own group so main, release, and queue runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/heads/pull-request/') && github.ref || github.run_id }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/pull-request/') }}

jobs:
  # PR copies run one leg per OS so a vetted head gets fast feedback; the
  # merge queue, main, and release branches run the full matrix before code
  # lands. Windows ARM and BoTorch run only in the full matrix.
  select-matrix:
    name: Select Test Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      full: ${{ steps.select.outputs.full }}
    steps:
    - name: Select legs for this event
      id: select
      shell: python
      env:
        REF: ${{ github.ref }}
      run: |
        import json
        import os

        runners = {
            "linux": "prod-aiperf-builder-amd-v1",
            "macos": "macos-latest",
            "windows": "windows-latest",
            "windows-arm": "windows-11-arm",
        }
        pr_subset = [("linux", "3.13"), ("macos", "3.12"), ("windows", "3.11")]
        full = not os.environ["REF"].startswith("refs/heads/pull-request/")
        legs = (
            [(o, py) for o in runners for py in ("3.11", "3.12", "3.13")]
            if full
            else pr_subset
        )
        matrix = {
            "include": [
                {"os": o, "python-version": py, "runner": runners[o]} for o, py in legs
            ]
        }
        print(json.dumps(matrix, indent=2))
        with open(os.environ["GITHUB_OUTPUT"], "a") as out:
            out.write(f"matrix={json.dumps(matrix)}\n")
            out.write(f"full={str(full).lower()}\n")

  build:
    needs: select-matrix
    runs-on: ${{ matrix.runner }}
    # Windows x64 runners can finish the component tier just past 30 minutes.
    timeout-minutes: 90
    # Force CPython UTF-8 mode so file reads default to UTF-8 instead of the
    # Windows cp1252 code page (no-op on POSIX). Without it, reading a UTF-8
    # file on Windows raises UnicodeDecodeError on bytes like 0x8f.
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-matrix.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv with cache
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    # Windows has no `make`. Call uv directly to install the project +
    # mock server. POSIX runners stay on the make-based path so existing
    # CI behavior is unchanged.
    - name: Install dependencies (POSIX)
      if: runner.os != 'Windows'
      run: |
        make ci-install PYTHON_VERSION=${{ matrix.python-version }}
    - name: Install dependencies (Windows)
      if: matrix.os == 'windows'
      # Mirror the POSIX ``make ci-install`` artifact-generation steps
      # (mock-server import check, generate-plugin-enums, generate-plugin-
      # overloads) so Windows runs the same generated code as POSIX. The
      # ``command -v`` CLI-entry-point check from POSIX is shell-specific
      # and intentionally skipped here; the ``import`` check is the
      # platform-portable half.
      #
      # PYTHONIOENCODING=utf-8 forces the Python ``print()`` stdio path to
      # UTF-8 so ``tools/_core.py``'s box-drawing characters (``━``)
      # render without UnicodeEncodeError on the Windows default ``cp1252``
      # console code page. Without it, every banner-print call in the
      # artifact generator crashes the install step.
      env:
        PYTHONIOENCODING: utf-8
      run: |
        uv venv .venv --python ${{ matrix.python-version }}
        uv sync --locked --extra dev --no-dev
        uv pip install -e "tests/aiperf_mock_server[dev]"
        uv run python -c "import aiperf_mock_server"
        uv run python tools/generate_plugin_artifacts.py --enums
        uv run python tools/generate_plugin_artifacts.py --overloads
    # Windows-on-ARM has no win_arm64 wheel for pyarrow (and ``dev`` pulls it
    # transitively via mlflow), so install the pure-Python ``test`` extra here
    # instead of ``dev``. The base package itself is arm-safe (pyarrow/datasets
    # are environment-marker-excluded; soundfile is lazy-imported). Tests that
    # hard-depend on the absent native libs are skipped via collect_ignore in
    # tests/unit/conftest.py.
    - name: Install dependencies (Windows ARM)
      if: matrix.os == 'windows-arm'
      # bash (git-bash) runs with -eo pipefail, so a failed install fails the
      # step. The default Windows shell is PowerShell, which does NOT fail-fast
      # on a non-final failing command -- a broken install would otherwise be
      # masked by the trailing artifact-generation commands and report green.
      shell: bash
      run: |
        uv venv .venv --python ${{ matrix.python-version }}
        uv sync --locked --extra test --no-dev
        uv pip install -e "tests/aiperf_mock_server[dev]"
        uv run python -c "import aiperf_mock_server"
        uv run python tools/generate_plugin_artifacts.py --enums
        uv run python tools/generate_plugin_artifacts.py --overloads
    # Windows runs the same two tiers as macOS — unit + component_integration
    # — by invoking pytest directly (no `make` available on Windows). Integration
    # tests remain Linux-only (run-integration-tests.yml) which mirrors the
    # current macOS coverage gap.
    - name: Run unit tests and component integration tests (POSIX)
      if: runner.os != 'Windows'
      env:
        # Caps pytest-xdist workers on the 48-vCPU / 6-GiB-RAM Linux
        # builder pod. -n auto without this OOM-kills the runner agent.
        PYTEST_XDIST_AUTO_NUM_WORKERS: "4"
      run: |
        # Only collect coverage on the linux/3.12 leg where Codecov upload runs.
        COV=${{ (matrix.os == 'linux' && matrix.python-version == '3.12') && '1' || '0' }}
        make test-ci PYTHON_VERSION=${{ matrix.python-version }} COV=$COV
    # Mirrors POSIX ``make test-ci`` semantics: run BOTH tiers and
    # aggregate exit codes so unit-test failures don't mask component-
    # integration failures (or vice versa). Without the explicit
    # ``always() && runner.os == 'Windows'`` guard on the second step,
    # GitHub Actions' implicit ``success()`` short-circuits the
    # component-integration step on any unit-test failure.
    - name: Run unit, ui, and zmq tests (Windows)
      # Merged into one invocation to pay collection overhead once instead of
      # twice. tests/unit/conftest.py's no_sleep patch applies only to
      # tests/unit/**; tests/zmq/** uses real asyncio.sleep as before.
      # --no-looptime is omitted: looptime is opt-in per test via marker/
      # fixture and zmq tests use neither, so they run with a real-time loop.
      # --continue-on-collection-errors preserves the previous two-step
      # behaviour where a unit collection error did not block the zmq suite.
      if: runner.os == 'Windows'
      # -n logical, not -n auto: xdist's ``auto`` asks psutil for the PHYSICAL
      # core count, and the GitHub x86 Windows VM reports 1 physical core for
      # its 4 vCPUs, so ``auto`` ran the whole suite in a single worker (~3x
      # slower than windows-11-arm, which happens to report 3). ``logical``
      # uses the logical count on both and tracks the runner size if it grows.
      run: |
        uv run pytest tests/unit tests/ui tests/zmq -n logical --dist=worksteal --tb=short --continue-on-collection-errors -m 'not performance and not stress and not slow'
    - name: Run component integration tests (Windows)
      # ``!cancelled()`` overrides the implicit ``success()`` so component
      # integration still runs even if the unit-test step failed — matching
      # POSIX ``make test-ci`` which aggregates exit codes across both tiers.
      # Cancellation is still respected so we don't burn runner minutes
      # finishing after a manual stop.
      if: ${{ !cancelled() && runner.os == 'Windows' }}
      # -n logical for the reason given on the unit-test step above.
      run: |
        uv run pytest tests/component_integration -n logical --dist=worksteal --tb=short -v -m 'not performance and not stress and not slow'
    - name: Upload results to Codecov
      if: matrix.os == 'linux' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: ai-dynamo/aiperf

  botorch-regression:
    name: BoTorch Regression Tests (CPU)
    needs: select-matrix
    if: needs.select-matrix.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTEST_XDIST_AUTO_NUM_WORKERS: "4"
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: Set up uv with cache
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    - name: Install CPU-only BoTorch dependencies
      run: |
        make ci-install PYTHON_VERSION=3.13
        uv pip install --torch-backend cpu -e ".[botorch]"
    # Split across two steps rather than two lines of one ``run:``. ``run:``
    # executes under ``bash -e``, so a failure in the first file would abort
    # the step and the slow suite would never run. ``!cancelled()`` on the
    # second overrides the implicit ``success()`` so both suites always
    # report -- matching the Windows tiers above.
    - name: Run BoTorch GP kernel regression tests
      run: |
        uv run pytest -n auto --dist=worksteal \
          tests/unit/orchestrator/search_planner/test_botorch_kernel.py
    - name: Run BoTorch GP candidates_func regression tests (slow)
      if: ${{ !cancelled() }}
      run: |
        uv run pytest -n auto --dist=worksteal -m slow \
          tests/unit/orchestrator/search_planner/test_optuna_dsp_kernel.py

  # The merge ruleset requires this single check rather than each matrix leg,
  # whose names change whenever a leg is added or renamed. always() keeps it
  # from being skipped, because GitHub treats a skipped required check as passed.
  # BoTorch may be skipped only when the PR subset deliberately left it out.
  unit-tests-gate:
    name: Unit Tests Gate
    needs: [select-matrix, build, botorch-regression]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
    - name: Require every selected unit test job to pass
      env:
        SELECT: ${{ needs.select-matrix.result }}
        FULL: ${{ needs.select-matrix.outputs.full }}
        BUILD: ${{ needs.build.result }}
        BOTORCH: ${{ needs.botorch-regression.result }}
      run: |
        echo "select-matrix=${SELECT} full=${FULL} build=${BUILD} botorch-regression=${BOTORCH}"
        [ "${SELECT}" = "success" ] || exit 1
        [ "${BUILD}" = "success" ] || exit 1
        if [ "${FULL}" = "true" ]; then
          [ "${BOTORCH}" = "success" ] || exit 1
        else
          [ "${BOTORCH}" = "skipped" ] || exit 1
        fi
