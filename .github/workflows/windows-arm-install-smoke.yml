# Windows-on-ARM install + run smoke test.
#
# windows-latest is x86-64, so Windows-ARM regressions are invisible until a
# user hits them (e.g. pyarrow / datasets have no win_arm64 wheel). This job
# does a clean user-style install on a GitHub-hosted windows-11-arm runner,
# then runs a synthetic benchmark AND a SPEED-Bench (file-based) benchmark
# against the mock server -- confirming the core + file-dataset paths work
# natively on Windows-ARM without pyarrow/datasets.

name: Windows-ARM install + run smoke

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  install-and-run:
    name: Windows-ARM clean install + benchmark
    runs-on: windows-11-arm
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7

      - name: Clean install of aiperf + mock server (mimics a user install)
        run: |
          uv venv .venv
          uv pip install .
          uv pip install ./tests/aiperf_mock_server

      - name: aiperf CLI runs
        run: uv run aiperf --version

      - name: Start mock server
        run: |
          nohup uv run aiperf-mock-server --port 8000 > mock.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/v1/models >/dev/null 2>&1 && break || true
            sleep 1
          done
          echo "mock up"

      - name: Synthetic benchmark (core path)
        run: |
          uv run aiperf profile --model mock --tokenizer gpt2 \
            --url http://localhost:8000 --endpoint-type chat \
            --isl 32 --osl 16 --request-count 4 --concurrency 1

      - name: SPEED-Bench benchmark (file-based dataset)
        run: |
          cat > speedbench.jsonl <<'JSONL'
          {"question_id": "speed-coding-1", "category": "coding", "sub_category": null, "source": "https://example.test/speed-bench", "src_id": "speed-coding-1", "difficulty": null, "multiturn": false, "messages": [{"role": "user", "content": "Implement binary search."}]}
          {"question_id": "speed-coding-2", "category": "coding", "sub_category": null, "source": "https://example.test/speed-bench", "src_id": "speed-coding-2", "difficulty": null, "multiturn": false, "messages": [{"role": "user", "content": "Implement quicksort."}]}
          JSONL
          uv run aiperf profile --model mock --tokenizer gpt2 \
            --url http://localhost:8000 --endpoint-type chat \
            --custom-dataset-type speed_bench_coding --input-file speedbench.jsonl \
            --request-count 4 --concurrency 1
