# PR build pipeline. Fires on pushes to the copy-pr-bot mirror branches
# (pull-request/<N>). Produces a dev wheel and a multi-platform container so
# reviewers can pull either artifact by name without checking the PR out.
#
# Versioning:
#   wheel  = {base}.dev0+pr{N}.g{short_sha}      (PEP 440 local-version)
#   image  = pr-{N}-{short_sha}                  (ECR tag)
#
# Destinations:
#   wheel  → artifactory: pr/pr{N}/aiperf-...-py3-none-any.whl
#   image  → ECR:         ${REGISTRY}/aiperf:pr-{N}-{short_sha}
#
# Topology:
#   build       — pushes the multi-arch runtime image to ECR. Populates the
#                 cache-pr-<N> registry cache as a side effect of mode=max.
#   stage-wheel — gated by automated-release. Re-runs buildx with
#                 --target wheel-artifact on the same K8s BuildKit pod the
#                 build job used; every layer hits cache (PV + registry),
#                 so only the scratch export actually runs. Validates the
#                 wheel and pushes it to Artifactory via the JFrog CLI.

name: PR Build

on:
  push:
    branches:
      - 'pull-request/*'

concurrency:
  group: pr-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare PR Build
    runs-on: ubuntu-latest
    outputs:
      pr_number:           ${{ steps.parse.outputs.pr_number }}
      wheel_version:       ${{ steps.meta.outputs.wheel_version }}
      wheel_filename:      ${{ steps.meta.outputs.wheel_filename }}
      container_tag:       ${{ steps.meta.outputs.container_tag }}
      short_sha:           ${{ steps.meta.outputs.short_sha }}
      artifactory_subpath: ${{ steps.meta.outputs.artifactory_subpath }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PR number from branch
        id: parse
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          PR_NUMBER="${REF#pull-request/}"
          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse PR number from branch '${REF}' (expected pull-request/<N>)"
            exit 1
          fi
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Compute release metadata
        id: meta
        uses: ./.github/actions/release-metadata
        with:
          flavor:              pr
          commit_sha:          ${{ github.sha }}
          pr_number:           ${{ steps.parse.outputs.pr_number }}

  build:
    name: Build PR Container
    needs: [prepare]
    runs-on: prod-aiperf-default-v1
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Patch version in pyproject.toml
        uses: ./.github/actions/update-pyproject-version
        with:
          version: ${{ needs.prepare.outputs.wheel_version }}

      - name: Embed commit SHA in wheel metadata
        run: python3 tools/embed_commit_sha.py "${{ github.sha }}"

      - name: Bootstrap multi-arch builder
        uses: ./.github/actions/bootstrap-buildkit
        with:
          builder_name: aiperf-pr-${{ github.run_id }}
          arch: 'linux/amd64,linux/arm64'
          fresh_builder: 'true'

      - name: Log in to ECR
        env:
          AWS_ACCOUNT_ID:     ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" \
            | docker login --username AWS --password-stdin \
                "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

      - name: Build and push multi-arch container to ECR
        env:
          AWS_ACCOUNT_ID:     ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          CONTAINER_TAG:      ${{ needs.prepare.outputs.container_tag }}
        run: |
          set -euo pipefail
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
          CONTAINER_REF="${REGISTRY}/aiperf:${CONTAINER_TAG}"

          refresh_ecr_token() {
            while sleep 21600; do
              aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" \
                | docker login --username AWS --password-stdin "${REGISTRY}" 2>/dev/null || true
            done
          }
          refresh_ecr_token &
          REFRESH_PID=$!
          trap 'kill ${REFRESH_PID} 2>/dev/null || true' EXIT

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target   runtime \
            --cache-from "type=registry,ref=${REGISTRY}/aiperf:cache-pr-${{ needs.prepare.outputs.pr_number }}" \
            --cache-from "type=registry,ref=${REGISTRY}/aiperf:cache-post-merge" \
            --cache-to   "type=registry,ref=${REGISTRY}/aiperf:cache-pr-${{ needs.prepare.outputs.pr_number }},mode=max" \
            --push \
            --tag "${CONTAINER_REF}" \
            .

          DIGEST=$(docker buildx imagetools inspect "${CONTAINER_REF}" --format '{{.Manifest.Digest}}')
          echo "Pushed ${CONTAINER_REF} — digest: ${DIGEST}"

  stage-wheel:
    name: Stage Wheel (extract + Artifactory)
    needs: [prepare, build]
    runs-on: prod-aiperf-default-v1
    environment: automated-release
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Re-apply the same pyproject.toml mutations the build job applied so
      # the wheel-builder layer's content hash matches what's cached in the
      # K8s BuildKit pod's PV (and in cache-pr-<N> on ECR). Otherwise the
      # cache key shifts and buildx rebuilds from scratch.
      - name: Patch version in pyproject.toml
        uses: ./.github/actions/update-pyproject-version
        with:
          version: ${{ needs.prepare.outputs.wheel_version }}

      - name: Embed commit SHA in wheel metadata
        run: python3 tools/embed_commit_sha.py "${{ github.sha }}"

      # Same builder name as build so we attach to the same per-arch K8s
      # BuildKit pods (StatefulSet, shared across both jobs). fresh_builder
      # only resets the local docker context — the remote pods (and their
      # PV-backed layer cache) are untouched.
      - name: Bootstrap multi-arch builder
        uses: ./.github/actions/bootstrap-buildkit
        with:
          builder_name: aiperf-pr-${{ github.run_id }}
          arch: 'linux/amd64'
          fresh_builder: 'true'

      - name: Log in to ECR
        env:
          AWS_ACCOUNT_ID:     ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" \
            | docker login --username AWS --password-stdin \
                "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

      # --cache-from only (no --cache-to). cache-pr-<N> was fully populated
      # by build's mode=max push, so every layer hits cache and only the
      # scratch-export step at the end of wheel-artifact actually runs.
      # Wheel is pure-python (py3-none-any), so amd64 is sufficient.
      - name: Extract wheel via buildx (cache-only fast path)
        env:
          AWS_ACCOUNT_ID:     ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          set -euo pipefail
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
          docker buildx build \
            --platform linux/amd64 \
            --target   wheel-artifact \
            --cache-from "type=registry,ref=${REGISTRY}/aiperf:cache-pr-${{ needs.prepare.outputs.pr_number }}" \
            --output     type=local,dest=./dist/ \
            .

      - name: Validate wheel
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.wheel_version }}
        run: |
          set -euo pipefail
          mapfile -t WHEELS < <(find dist/ -name "aiperf-*.whl" -type f)
          if [ "${#WHEELS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one wheel in dist/, found ${#WHEELS[@]}"
            printf '  %s\n' "${WHEELS[@]}"
            exit 1
          fi
          WHEEL_PATH="${WHEELS[0]}"
          uvx twine check "${WHEEL_PATH}"
          uv venv .venv-check
          uv pip install --python .venv-check/bin/python "${WHEEL_PATH}"
          INSTALLED_VERSION=$(.venv-check/bin/python -c "import aiperf; print(aiperf.__version__)")
          if [ "${INSTALLED_VERSION}" != "${EXPECTED_VERSION}" ]; then
            echo "::error::Wheel version mismatch: expected '${EXPECTED_VERSION}', got '${INSTALLED_VERSION}'"
            exit 1
          fi
          .venv-check/bin/aiperf --help

      # Derive the JFrog platform URL by stripping `/artifactory/<repo>/`
      # from ARTIFACTORY_URL. Keeps ARTIFACTORY_URL backwards-compatible
      # with the curl-based nightly path while giving jf the platform URL
      # it actually wants for JF_URL.
      - name: Compute JFrog platform URL
        id: jfurl
        env:
          ARTIFACTORY_URL:       ${{ secrets.ARTIFACTORY_URL }}
          ARTIFACTORY_REPO_NAME: ${{ secrets.ARTIFACTORY_REPO_NAME }}
        run: |
          set -euo pipefail
          TRIMMED="${ARTIFACTORY_URL%/}"
          BASE="${TRIMMED%/artifactory/${ARTIFACTORY_REPO_NAME}}"
          echo "jf_url=${BASE}/" >> "$GITHUB_OUTPUT"

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL:          ${{ steps.jfurl.outputs.jf_url }}
          JF_USER:         ${{ secrets.ARTIFACTORY_USER }}
          JF_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}

      - name: Upload wheel to Artifactory
        env:
          ARTIFACTORY_REPO_NAME: ${{ secrets.ARTIFACTORY_REPO_NAME }}
          ARTIFACTORY_SUBPATH:   ${{ needs.prepare.outputs.artifactory_subpath }}
        run: |
          set -euo pipefail
          WHEEL=$(find dist/ -name "aiperf-*.whl" -type f | head -1)
          if [ -z "${WHEEL}" ]; then
            echo "::error::No wheel found in dist/ after extract step"
            exit 1
          fi
          jf rt upload --flat "${WHEEL}" "${ARTIFACTORY_REPO_NAME}/${ARTIFACTORY_SUBPATH}"

  summary:
    name: PR Build Summary
    needs: [prepare, build, stage-wheel]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        env:
          PR_NUMBER:           ${{ needs.prepare.outputs.pr_number }}
          WHEEL_FILENAME:      ${{ needs.prepare.outputs.wheel_filename }}
          CONTAINER_TAG:       ${{ needs.prepare.outputs.container_tag }}
          ARTIFACTORY_SUBPATH: ${{ needs.prepare.outputs.artifactory_subpath }}
          BUILD_RESULT:        ${{ needs.build.result }}
          STAGE_RESULT:        ${{ needs.stage-wheel.result }}
        run: |
          {
            echo "## PR #${PR_NUMBER} Build Summary"
            echo ""
            echo "| Artifact | Location |"
            echo "|----------|----------|"
            echo "| Wheel | \`${ARTIFACTORY_SUBPATH}${WHEEL_FILENAME}\` |"
            echo "| Container tag | \`${CONTAINER_TAG}\` |"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| build | ${BUILD_RESULT} |"
            echo "| stage-wheel | ${STAGE_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"
