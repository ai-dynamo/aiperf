# PR build pipeline. Fires on pushes to the copy-pr-bot mirror branches
# (pull-request/<N>). Produces a dev wheel and a multi-platform container so
# reviewers can pull either artifact by name without checking the PR out.
#
# Versioning:
#   wheel  = {base}.dev0+pr{N}.g{short_sha}      (PEP 440 local-version)
#   image  = pr-{N}-{short_sha}                  (ECR tag)
#
# Destinations:
#   wheel  → artifactory: pr/pr{N}/aiperf-...-py3-none-any.whl
#   image  → ECR:         ${REGISTRY}/aiperf:pr-{N}-{short_sha}
#
# No environment gate. PR artifacts are scratch space — artifactory and ECR
# retention policies clean them up.

name: PR Build

on:
  push:
    branches:
      - 'pull-request/*'

concurrency:
  group: pr-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare PR Build
    runs-on: ubuntu-latest
    outputs:
      pr_number:           ${{ steps.parse.outputs.pr_number }}
      wheel_version:       ${{ steps.meta.outputs.wheel_version }}
      wheel_filename:      ${{ steps.meta.outputs.wheel_filename }}
      container_tag:       ${{ steps.meta.outputs.container_tag }}
      container_image:     ${{ steps.meta.outputs.container_image }}
      container_ref:       ${{ steps.meta.outputs.container_ref }}
      short_sha:           ${{ steps.meta.outputs.short_sha }}
      artifactory_subpath: ${{ steps.meta.outputs.artifactory_subpath }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PR number from branch
        id: parse
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          PR_NUMBER="${REF#pull-request/}"
          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse PR number from branch '${REF}' (expected pull-request/<N>)"
            exit 1
          fi
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Compute release metadata
        id: meta
        uses: ./.github/actions/release-metadata
        with:
          flavor:              pr
          commit_sha:          ${{ github.sha }}
          container_registry:  ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_DEFAULT_REGION }}.amazonaws.com
          pr_number:           ${{ steps.parse.outputs.pr_number }}

  build:
    name: Build PR Artifacts
    needs: [prepare]
    runs-on: prod-aiperf-default-v1
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Patch version in pyproject.toml
        uses: ./.github/actions/update-pyproject-version
        with:
          version: ${{ needs.prepare.outputs.wheel_version }}

      - name: Embed commit SHA in wheel metadata
        env:
          COMMIT_SHA: ${{ github.sha }}
          REPO:       ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import os
          from pathlib import Path

          sha = os.environ["COMMIT_SHA"]
          repo = os.environ["REPO"]
          url = f"https://github.com/{repo}/commit/{sha}"

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text()
          entry = f'Repository = "{url}"'
          if "[project.urls]" in text:
              text = text.replace("[project.urls]", f"[project.urls]\n{entry}", 1)
          else:
              if not text.endswith("\n"):
                  text += "\n"
              text += f"\n[project.urls]\n{entry}\n"
          pyproject.write_text(text)

          build_info = Path("src/aiperf/_build_info.py")
          build_info.write_text(
              "# SPDX-FileCopyrightText: Copyright (c) 2025-2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.\n"
              "# SPDX-License-Identifier: Apache-2.0\n"
              '"""Build-time metadata. Generated by the PR pipeline; do not edit."""\n'
              "\n"
              f'COMMIT_SHA = "{sha}"\n'
          )
          print(f"Embedded commit SHA: {sha}")
          PYEOF

      - name: Bootstrap multi-arch builder
        uses: ./.github/actions/bootstrap-buildkit
        with:
          builder_name: aiperf-pr-${{ github.run_id }}
          arch: 'linux/amd64,linux/arm64'
          fresh_builder: 'true'

      - name: Log in to ECR
        env:
          AWS_ACCOUNT_ID:     ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" \
            | docker login --username AWS --password-stdin \
                "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

      - name: Build and extract wheel (amd64 only)
        env:
          AWS_ACCOUNT_ID:     ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          set -euo pipefail
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
          docker buildx build \
            --platform linux/amd64 \
            --target   wheel-artifact \
            --cache-from "type=registry,ref=${REGISTRY}/aiperf:cache-pr-${{ needs.prepare.outputs.pr_number }}" \
            --cache-from "type=registry,ref=${REGISTRY}/aiperf:cache-post-merge" \
            --cache-to   "type=registry,ref=${REGISTRY}/aiperf:cache-pr-${{ needs.prepare.outputs.pr_number }},mode=max" \
            --output     type=local,dest=./dist/ \
            .

      - name: Validate wheel
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.wheel_version }}
        run: |
          set -euo pipefail
          mapfile -t WHEELS < <(find dist/ -name "aiperf-*.whl" -type f)
          if [ "${#WHEELS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one wheel in dist/, found ${#WHEELS[@]}"
            printf '  %s\n' "${WHEELS[@]}"
            exit 1
          fi
          WHEEL_PATH="${WHEELS[0]}"
          uvx twine check "${WHEEL_PATH}"
          uv venv .venv-check
          uv pip install --python .venv-check/bin/python "${WHEEL_PATH}"
          INSTALLED_VERSION=$(.venv-check/bin/python -c "import aiperf; print(aiperf.__version__)")
          if [ "${INSTALLED_VERSION}" != "${EXPECTED_VERSION}" ]; then
            echo "::error::Wheel version mismatch: expected '${EXPECTED_VERSION}', got '${INSTALLED_VERSION}'"
            exit 1
          fi
          .venv-check/bin/aiperf --help

      - name: Build and push multi-arch container to ECR
        env:
          AWS_ACCOUNT_ID:     ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          CONTAINER_REF:      ${{ needs.prepare.outputs.container_ref }}
        run: |
          set -euo pipefail
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

          refresh_ecr_token() {
            while sleep 21600; do
              aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" \
                | docker login --username AWS --password-stdin "${REGISTRY}" 2>/dev/null || true
            done
          }
          refresh_ecr_token &
          REFRESH_PID=$!
          trap 'kill ${REFRESH_PID} 2>/dev/null || true' EXIT

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target   runtime \
            --cache-from "type=registry,ref=${REGISTRY}/aiperf:cache-pr-${{ needs.prepare.outputs.pr_number }}" \
            --cache-from "type=registry,ref=${REGISTRY}/aiperf:cache-post-merge" \
            --cache-to   "type=registry,ref=${REGISTRY}/aiperf:cache-pr-${{ needs.prepare.outputs.pr_number }},mode=max" \
            --push \
            --tag "${CONTAINER_REF}" \
            .

          DIGEST=$(docker buildx imagetools inspect "${CONTAINER_REF}" --format '{{.Manifest.Digest}}')
          echo "Pushed ${CONTAINER_REF} — digest: ${DIGEST}"

      - name: Upload wheel to Artifactory
        env:
          ARTIFACTORY_URL:     ${{ secrets.ARTIFACTORY_URL }}
          ARTIFACTORY_USER:    ${{ secrets.ARTIFACTORY_USER }}
          ARTIFACTORY_TOKEN:   ${{ secrets.ARTIFACTORY_TOKEN }}
          WHEEL_FILENAME:      ${{ needs.prepare.outputs.wheel_filename }}
          ARTIFACTORY_SUBPATH: ${{ needs.prepare.outputs.artifactory_subpath }}
        run: |
          set -euo pipefail
          WHEEL=$(find dist/ -name "aiperf-*.whl" | head -1)
          TARGET_URL="${ARTIFACTORY_URL%/}/${ARTIFACTORY_SUBPATH}${WHEEL_FILENAME}"
          BODY_FILE=$(mktemp)
          HTTP_CODE=$(curl -sSL -o "${BODY_FILE}" -w "%{http_code}" \
            -u "${ARTIFACTORY_USER}:${ARTIFACTORY_TOKEN}" \
            -T "${WHEEL}" \
            "${TARGET_URL}")
          if [ "${HTTP_CODE}" != "201" ]; then
            echo "::error::Artifactory deploy failed: HTTP ${HTTP_CODE} at ${TARGET_URL}"
            cat "${BODY_FILE}" || true
            exit 1
          fi
          echo "Wheel uploaded: ${TARGET_URL}"

  summary:
    name: PR Build Summary
    needs: [prepare, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        env:
          PR_NUMBER:           ${{ needs.prepare.outputs.pr_number }}
          WHEEL_FILENAME:      ${{ needs.prepare.outputs.wheel_filename }}
          CONTAINER_REF:       ${{ needs.prepare.outputs.container_ref }}
          ARTIFACTORY_SUBPATH: ${{ needs.prepare.outputs.artifactory_subpath }}
          BUILD_RESULT:        ${{ needs.build.result }}
        run: |
          {
            echo "## PR #${PR_NUMBER} Build Summary"
            echo ""
            echo "| Artifact | Location |"
            echo "|----------|----------|"
            echo "| Wheel | \`${ARTIFACTORY_SUBPATH}${WHEEL_FILENAME}\` |"
            echo "| Container | \`${CONTAINER_REF}\` |"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| build | ${BUILD_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"
