name: AIPerf Kubernetes Operator
on:
  pull_request:
    paths: ["aiperf-k8s-operator/**", "deploy/aiperf-k8s-operator/**", "contracts/native-k8s/**", "rust/cli/src/kube/**", "rust/e2e-tests/tests/kube_cli_contract.rs"]
  push:
    paths: ["aiperf-k8s-operator/**", "deploy/aiperf-k8s-operator/**", "contracts/native-k8s/**", "rust/cli/src/kube/**", "rust/e2e-tests/tests/kube_cli_contract.rs"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: "3.11"}
    - run: python -m pip install -e './aiperf-k8s-operator[test]'
    - run: pytest -n auto aiperf-k8s-operator/tests
  kind:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: helm/kind-action@v1
    - run: helm install aiperf-k8s deploy/aiperf-k8s-operator/helm/aiperf-k8s-operator
    - run: python -m pip install -e './aiperf-k8s-operator[test]'
    - run: pytest -n auto aiperf-k8s-operator/tests/integration --run-integration
  native-cli-kind:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: helm/kind-action@v1
    - uses: dtolnay/rust-toolchain@stable
    - run: helm install aiperf-k8s deploy/aiperf-k8s-operator/helm/aiperf-k8s-operator
    - run: cargo build --release -p aiperf-cli
      working-directory: rust
    # The ignored kind tests drive the real binary against the provisioned cluster.
    - run: cargo test -p aiperf-e2e-tests --test kube_cli_contract -- --ignored
      working-directory: rust
      env:
        AIPERF_E2E_BIN: ${{ github.workspace }}/rust/target/release/aiperf
