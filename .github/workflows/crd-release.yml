#
# CRD release workflow.
#
# Regenerates the AIPerfJob and AIPerfSweep CRDs from the Pydantic config
# models and publishes standalone, non-Helm-templated CRD YAMLs as:
#   - workflow artifacts (always), and
#   - release assets attached to the pushed tag (on `v*.*.*` tag push only).
#
# `tools/generate_crd.py` emits Helm-templated CRDs directly to
# `deploy/helm/aiperf-operator/templates/crd-aiperfjob.yaml` and
# `deploy/helm/aiperf-operator/templates/crd-aiperfsweep.yaml`. For release
# consumption we need plain K8s manifests with template actions resolved, so
# we render via `helm template --show-only templates/crd-<kind>.yaml`.
name: "CRD Release"

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag label used in the artifact filename (release attachment is skipped on workflow_dispatch)."
        type: string
        default: "v0.0.0-dev"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  crd-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Install project (uv venv via make first-time-setup)
        run: make first-time-setup PYTHON_VERSION=3.12

      - name: Check CRD is in sync with Pydantic model
        run: make check-crd

      - name: Render standalone CRD YAML
        run: make crd-release

      - name: Stage artifacts with tag-suffixed filenames
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          job_out="dist/release/aiperfjob-crd-${TAG_NAME}.yaml"
          sweep_out="dist/release/aiperfsweep-crd-${TAG_NAME}.yaml"
          cp dist/aiperfjob-crd.yaml "${job_out}"
          cp dist/aiperfsweep-crd.yaml "${sweep_out}"
          echo "job_path=${job_out}" >> "$GITHUB_OUTPUT"
          echo "sweep_path=${sweep_out}" >> "$GITHUB_OUTPUT"
          echo "Rendered CRDs:"
          ls -la "${job_out}" "${sweep_out}"
          head -5 "${job_out}"
          head -5 "${sweep_out}"

      - name: Validate rendered CRD YAML
        shell: bash
        run: |
          # Run inside the uv-provisioned project env (created by
          # `make first-time-setup`) so pyyaml is importable.
          uv run python - <<'PY'
          import os

          import yaml

          expected = {
              os.environ["JOB_CRD_PATH"]: "aiperfjobs.aiperf.nvidia.com",
              os.environ["SWEEP_CRD_PATH"]: "aiperfsweeps.aiperf.nvidia.com",
          }
          for path, expected_name in expected.items():
              with open(path) as f:
                  docs = [d for d in yaml.safe_load_all(f) if d]
              assert len(docs) == 1, f"{path}: expected 1 CRD doc, got {len(docs)}"
              crd = docs[0]
              assert crd.get("kind") == "CustomResourceDefinition", (path, crd.get("kind"))
              assert crd["metadata"]["name"] == expected_name, (path, crd["metadata"]["name"])
              print("CRD YAML OK:", crd["metadata"]["name"])
          PY
        env:
          JOB_CRD_PATH: ${{ steps.stage.outputs.job_path }}
          SWEEP_CRD_PATH: ${{ steps.stage.outputs.sweep_path }}

      - name: Upload CRD artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aiperf-crds-${{ env.TAG_NAME }}
          path: |
            ${{ steps.stage.outputs.job_path }}
            ${{ steps.stage.outputs.sweep_path }}
          retention-days: 90

      - name: Attach CRDs to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.stage.outputs.job_path }}
            ${{ steps.stage.outputs.sweep_path }}
          fail_on_unmatched_files: true

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CRD release"
            echo ""
            echo "- Tag label: \`${TAG_NAME}\`"
            echo "- Source: Helm-rendered (\`helm template --show-only templates/crd-aiperfjob.yaml\` + \`templates/crd-aiperfsweep.yaml\`)"
            echo "- Artifact: \`aiperf-crds-${TAG_NAME}\` (90 day retention)"
            if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
              echo "- Release attachment: enabled (tag push)"
            else
              echo "- Release attachment: skipped (not a tag push)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
