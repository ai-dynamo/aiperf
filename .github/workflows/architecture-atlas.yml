name: Architecture Atlas

on:
  pull_request:
    paths:
      - "apps/architecture-atlas/**"
      - ".github/workflows/architecture-atlas.yml"
      - ".gitignore"
  push:
    branches:
      - main
    paths:
      - "apps/architecture-atlas/**"
      - ".github/workflows/architecture-atlas.yml"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: architecture-atlas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate and package graph-first Atlas
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/architecture-atlas
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/architecture-atlas/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate architecture content
        run: npm run validate:content

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit and accessibility tests
        run: npm test

      - name: Build production SPA
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright functional suites
        run: |
          PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/functional \
            npx playwright test e2e/architecture-atlas.spec.ts --reporter=list,html --output=test-results/functional

      - name: Run Playwright visual and accessibility assertions
        run: |
          PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/visual-a11y \
            npx playwright test e2e/flight-deck-visual.spec.ts --reporter=list,html --output=test-results/visual-a11y

      - name: Upload static SPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiperf-architecture-atlas-dist
          path: apps/architecture-atlas/dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiperf-architecture-atlas-playwright-report
          path: apps/architecture-atlas/playwright-report
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiperf-architecture-atlas-playwright-diagnostics
          path: |
            apps/architecture-atlas/test-results
            apps/architecture-atlas/test-results/**/*.png
            apps/architecture-atlas/test-results/**/*-diff.png
            apps/architecture-atlas/test-results/**/trace.zip
            apps/architecture-atlas/test-results/**/*.webm
          if-no-files-found: warn
          retention-days: 14
