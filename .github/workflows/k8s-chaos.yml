#
# Unified chaos / fault-injection suite.
#
# Runs the three chaos test directories:
#   - tests/kubernetes/chaos_common/  (adapter tests, hermetic, not k8s_slow)
#   - tests/kubernetes/chaos/         (23 legacy AIPerf scenarios, k8s_slow)
#   - tests/kubernetes/chaos_dynamo/  (dynamo D-series scenarios, k8s_slow)
#
# The chaos_common/ adapter tests are NOT marked k8s_slow, so they run as a
# separate pytest invocation without the marker filter; applying `-m k8s_slow`
# to that directory would silently deselect every test in it.
#
# Modeled on run-chaos-tests.yml for cluster bring-up; ships as a separate
# workflow because the unified suite covers a superset (the dynamo D-series).
# A future pass may reconcile run-chaos-tests.yml and this file into a single
# matrix invocation, but they run side-by-side for now so the legacy chaos
# suite keeps its existing trigger semantics.
#
# Triggers:
#   - workflow_dispatch (manual)
#   - push to main
#   - nightly cron at 08:00 UTC (one hour after run-chaos-tests.yml)
#
# Chaos fixtures require shareProcessNamespace on controller pods so
# `kubectl exec ... kill` can reach sibling containers; this is enabled
# here via AIPERF_K8S_SHARE_PROCESS_NAMESPACE=true and is NOT the
# production default. D704 requires a NetworkPolicy-enforcing CNI; CI
# does NOT set KIND_HAS_CILIUM, so D704 xfail-skips by design — see
# tests/kubernetes/chaos_common/README.md "Cilium-on-kind for D704".
name: "Run Unified Chaos Tests"

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'llms.txt'
      - 'LICENSE'
      - '.gitignore'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      pytest_args:
        description: "Extra pytest args for the cluster (k8s_slow) invocation (e.g. `-k test_d101` or `--k8s-reuse-cluster`)"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chaos-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      AIPERF_K8S_SHARE_PROCESS_NAMESPACE: "true"

    steps:
    - name: Free disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
        sudo apt-get -y clean
        docker system prune -af || true
        df -h

    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Cache uv downloads
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-py3.12-${{ hashFiles('uv.lock', 'pyproject.toml') }}
        restore-keys: |
          uv-${{ runner.os }}-py3.12-

    - name: Install kubectl
      uses: azure/setup-kubectl@v4

    - name: Install helm
      uses: azure/setup-helm@v4
      with:
        version: "latest"

    - name: Install kind
      uses: helm/kind-action@v1
      with:
        install_only: true

    - name: Install dependencies
      run: make first-time-setup PYTHON_VERSION=3.12

    - name: Report pre-test disk and tool versions
      shell: bash
      run: |
        df -h
        docker version || true
        kind version || true
        kubectl version --client || true
        helm version || true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build aiperf image (amd64, from build-images GHA cache)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        target: runtime
        platforms: linux/amd64
        load: true
        tags: aiperf:local
        cache-from: type=gha,scope=aiperf
      timeout-minutes: 20

    - name: Build mock server image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: dev/deploy/Dockerfile.mock-server
        platforms: linux/amd64
        load: true
        tags: aiperf-mock-server:latest
        cache-from: type=gha,scope=aiperf-mock-server
        cache-to: type=gha,scope=aiperf-mock-server,mode=max
      timeout-minutes: 10

    - name: Run chaos adapter tests (chaos_common)
      id: pytest_common
      shell: bash
      run: |
        set -o pipefail
        # chaos_common/ is hermetic (echo-only fixture) and its tests are not
        # marked k8s_slow — no -m filter, or everything would be deselected.
        uv run pytest tests/kubernetes/chaos_common/ \
          -n auto \
          -v --tb=long
      timeout-minutes: 15

    - name: Run cluster chaos tests (chaos, chaos_dynamo)
      id: pytest
      shell: bash
      run: |
        set -o pipefail
        uv run pytest -m k8s_slow -n auto \
          tests/kubernetes/chaos/ \
          tests/kubernetes/chaos_dynamo/ \
          -v --tb=long \
          ${{ inputs.pytest_args }}
      timeout-minutes: 160

    - name: Collect cluster diagnostics on failure
      if: failure()
      shell: bash
      run: |
        mkdir -p ./k8s-chaos-logs
        kind export logs ./k8s-chaos-logs/kind --name aiperf || true
        kubectl get all -A > ./k8s-chaos-logs/all-resources.txt || true
        kubectl get events -A --sort-by=.lastTimestamp > ./k8s-chaos-logs/events.txt || true
        kubectl describe nodes > ./k8s-chaos-logs/describe-nodes.txt || true
        kubectl describe pods -A > ./k8s-chaos-logs/describe-pods.txt || true
        kubectl get aiperfjobs -A -o yaml > ./k8s-chaos-logs/aiperfjobs.yaml 2>&1 || true
        kubectl get jobsets -A -o yaml > ./k8s-chaos-logs/jobsets.yaml 2>&1 || true
        kubectl get pods -A -o yaml > ./k8s-chaos-logs/pods.yaml 2>&1 || true
        for ns in $(kubectl get ns -o name | cut -d/ -f2); do
          kubectl logs -n "$ns" --all-containers --prefix --tail=-1 -l '' > "./k8s-chaos-logs/logs-$ns.txt" 2>&1 || true
        done
        docker ps -a > ./k8s-chaos-logs/docker-ps.txt 2>&1 || true
        docker images > ./k8s-chaos-logs/docker-images.txt 2>&1 || true
        df -h > ./k8s-chaos-logs/disk-usage.txt 2>&1 || true
        free -h > ./k8s-chaos-logs/memory.txt 2>&1 || true
        dmesg | tail -500 > ./k8s-chaos-logs/dmesg.txt 2>&1 || true

    - name: Upload cluster diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: k8s-chaos-unified-logs-${{ github.run_id }}
        path: k8s-chaos-logs/
        retention-days: 7

    - name: Write job summary
      if: always()
      shell: bash
      run: |
        {
          echo "## Unified chaos tests"
          echo ""
          echo "- Adapter tests (chaos_common): **${{ steps.pytest_common.outcome }}**"
          echo "- Cluster chaos tests (chaos, chaos_dynamo): **${{ steps.pytest.outcome }}**"
          if [[ "${{ steps.pytest_common.outcome }}" != "success" || "${{ steps.pytest.outcome }}" != "success" ]]; then
            echo ""
            echo "Diagnostics artifact: \`k8s-chaos-unified-logs-${{ github.run_id }}\` (7 day retention)"
          fi
          echo ""
          echo "- Runner: \`ubuntu-latest\`"
          echo "- Python: \`3.12\`"
          echo "- Markers: chaos_common unfiltered; chaos/ + chaos_dynamo/ run with \`-m k8s_slow\`"
          echo "- AIPERF_K8S_SHARE_PROCESS_NAMESPACE: \`true\`"
          echo "- KIND_HAS_CILIUM: unset (D704 expected xfail-skipped)"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Teardown Kind cluster
      if: always()
      run: kind delete cluster --name aiperf || true
