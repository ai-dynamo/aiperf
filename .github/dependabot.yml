version: 2
updates:
  # package.json is bookkeeping only -- see its description field. These
  # dashboards have no build step; nothing here is ever `npm install`ed.
  # When Dependabot opens a PR bumping a version here, apply the same bump
  # to the matching MANIFEST entry in tools/vendor_ui_deps.py (version, url,
  # sha256) and run `tools/vendor_ui_deps.py --update <name>` to re-fetch and
  # re-pin the actual vendored file before merging.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
