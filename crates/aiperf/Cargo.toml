[package]
name = "aiperf"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust-native AIPerf load-generation runtime used by the subprocess runner."

[features]
default = []
# Requires the sibling `dynamo-aiperf-native/lib/mocker` checkout. Its runtime
# integration stays out of default builds.
dynamo-offline = ["dep:dynamo-mocker"]
# Forward every optional Dynamo Mocker capability independently so embedders can
# pay only for the runtime surface they exercise. `dynamo-full` is the explicit
# build gate used by the complete DynoSim/Mocker capability suite.
dynamo-router-runtime = ["dynamo-offline", "dynamo-mocker/router-runtime"]
dynamo-zmq-events = ["dynamo-offline", "dynamo-mocker/zmq-events"]
dynamo-kvbm-offload = ["dynamo-offline", "dynamo-mocker/kvbm-offload"]
dynamo-aic-forward-pass = ["dynamo-offline", "dynamo-mocker/aic-forward-pass"]
dynamo-profile = ["dynamo-offline", "dynamo-mocker/profile"]
dynamo-full = [
    "dynamo-router-runtime",
    "dynamo-zmq-events",
    "dynamo-kvbm-offload",
    "dynamo-aic-forward-pass",
    "dynamo-profile",
]
# Exact official-harness builds align the enabled Dynamo capability set. The
# embedding executable, not this library, owns process-global allocator choice.
dynamo-parity = ["dynamo-full"]

[lib]
name = "aiperf"
path = "src/lib.rs"

[dependencies]
aiperf-accuracy = { path = "../aiperf-accuracy" }
aiperf-adaptive = { path = "../aiperf-adaptive" }
aiperf-core = { path = "../aiperf-core" }
aiperf-dataset.workspace = true
aiperf-endpoints.workspace = true
aiperf-graph = { path = "../aiperf-graph" }
aiperf-metrics.workspace = true
aiperf-timing = { path = "../aiperf-timing" }
aiperf-transport-http = { path = "../aiperf-transport-http" }
aiperf-clock.workspace = true
aiperf-rng.workspace = true
loadgen-core.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
rustc-hash.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
url.workspace = true
dynamo-mocker = { path = "../../../../../dynamo-aiperf-native/lib/mocker", optional = true, default-features = false }
