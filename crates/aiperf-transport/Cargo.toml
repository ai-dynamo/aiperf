[package]
name = "aiperf-transport"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Rust-native AIPerf HTTP client + timing recording, driven off the aiperf-clock Clock abstraction."

[dependencies]
aiperf-clock = { path = "../aiperf-clock" }
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "sync"] }
hyper = { version = "1.10", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
url = "2"
socket2 = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "sync", "process", "time"] }
