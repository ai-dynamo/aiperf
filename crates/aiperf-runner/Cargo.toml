[package]
name = "aiperf-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Versioned single-benchmark subprocess runner for the Python AIPerf orchestrator."

[features]
default = []
# The runner is the only native executable, so every optional AIPerf/Dynamo
# composition feature must terminate here rather than requiring another binary.
dynamo-offline = ["aiperf/dynamo-offline"]
dynamo-router-runtime = ["dynamo-offline", "aiperf/dynamo-router-runtime"]
dynamo-zmq-events = ["dynamo-offline", "aiperf/dynamo-zmq-events"]
dynamo-kvbm-offload = ["dynamo-offline", "aiperf/dynamo-kvbm-offload"]
dynamo-aic-forward-pass = ["dynamo-offline", "aiperf/dynamo-aic-forward-pass"]
dynamo-profile = ["dynamo-offline", "aiperf/dynamo-profile"]
dynamo-full = [
    "dynamo-router-runtime",
    "dynamo-zmq-events",
    "dynamo-kvbm-offload",
    "dynamo-aic-forward-pass",
    "dynamo-profile",
]
dynamo-parity = ["dynamo-full", "aiperf/dynamo-parity"]

[dependencies]
aiperf.workspace = true
aiperf-adaptive = { path = "../aiperf-adaptive" }
aiperf-accuracy = { path = "../aiperf-accuracy" }
aiperf-clock.workspace = true
aiperf-dataset.workspace = true
aiperf-endpoints.workspace = true
aiperf-extensions.workspace = true
aiperf-gpu-telemetry = { path = "../aiperf-gpu-telemetry" }
aiperf-graph = { path = "../aiperf-graph" }
aiperf-metrics.workspace = true
aiperf-network-latency.workspace = true
aiperf-server-metrics.workspace = true
aiperf-rng.workspace = true
aiperf-timing = { path = "../aiperf-timing" }
aiperf-transport-http.workspace = true
aiperf-transport-grpc.workspace = true
anyhow.workspace = true
async-trait.workspace = true
blake3.workspace = true
bytes.workspace = true
loadgen-core.workspace = true
mimalloc = "0.1"
regex.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
aiperf-test-static-extension = { path = "tests/fixtures/aiperf-test-static-extension" }
axum.workspace = true
http = "1"
prost.workspace = true
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { workspace = true, features = ["server", "router", "codegen"] }
