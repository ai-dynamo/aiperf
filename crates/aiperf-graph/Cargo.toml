[package]
name = "aiperf-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Graph-IR async-dataflow workload driver for AIPerf — online (live HTTP) mode."

[dependencies]
aiperf-core = { path = "../aiperf-core" }
aiperf-dataset.workspace = true
aiperf-metrics.workspace = true
aiperf-rng.workspace = true
aiperf-clock.workspace = true
aiperf-timing = { path = "../aiperf-timing" }
aiperf-transport-http = { path = "../aiperf-transport-http" }
loadgen-core.workspace = true
bytes = "1"
url = "2"
anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision", "preserve_order"] }
flate2 = "1"
num-bigint = "0.4.8"
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
