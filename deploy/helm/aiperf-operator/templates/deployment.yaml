apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aiperf-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aiperf-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "aiperf-operator.operatorSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aiperf-operator.operatorSelectorLabels" . | nindent 8 }}
      {{- with .Values.operator.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "aiperf-operator.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: operator
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - kopf
        - run
        - -m
        - aiperf.operator.main
        - --verbose
        {{- if .Values.operator.watchNamespaces }}
        {{- range .Values.operator.watchNamespaces }}
        - --namespace={{ . }}
        {{- end }}
        {{- else }}
        - --all-namespaces
        {{- end }}
        - --liveness=http://0.0.0.0:8080/healthz
        ports:
        - name: health
          containerPort: 8080
          protocol: TCP
        {{- if gt (int .Values.operator.metrics.port) 0 }}
        - name: metrics
          containerPort: {{ .Values.operator.metrics.port }}
          protocol: TCP
        {{- end }}
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: AIPERF_OPERATOR_MONITOR_INTERVAL
          value: {{ .Values.operator.env.monitorInterval | quote }}
        - name: AIPERF_OPERATOR_MONITOR_INITIAL_DELAY
          value: {{ .Values.operator.env.monitorInitialDelay | quote }}
        - name: AIPERF_RESULTS_DIR
          value: {{ .Values.storage.mountPath | quote }}
        - name: AIPERF_JOB_TIMEOUT_SECONDS
          value: {{ .Values.operator.env.jobTimeoutSeconds | quote }}
        - name: AIPERF_POD_RESTART_THRESHOLD
          value: {{ .Values.operator.env.podRestartThreshold | quote }}
        - name: AIPERF_METRICS_PORT
          value: {{ .Values.operator.metrics.port | quote }}
        - name: AIPERF_RESULTS_TTL_DAYS
          value: {{ .Values.operator.env.resultsTtlDays | quote }}
        - name: AIPERF_RESULTS_MAX_RETRIES
          value: {{ .Values.operator.env.resultsMaxRetries | quote }}
        - name: AIPERF_RESULTS_RETRY_DELAY
          value: {{ .Values.operator.env.resultsRetryDelay | quote }}
        - name: AIPERF_ENDPOINT_CHECK_TIMEOUT
          value: {{ .Values.operator.env.endpointCheckTimeout | quote }}
        - name: AIPERF_RESULTS_COMPRESS_ON_DISK
          value: {{ .Values.operator.env.resultsCompressOnDisk | default "true" | quote }}
        - name: AIPERF_K8S_SHARE_PROCESS_NAMESPACE
          value: {{ .Values.podTemplate.shareProcessNamespace | default false | quote }}
        - name: AIPERF_DASHBOARD_PORT
          value: {{ if .Values.dashboard.enabled }}{{ .Values.dashboard.port | quote }}{{ else }}"0"{{ end }}
        - name: AIPERF_OPERATOR_BASE_URL
          value: {{ printf "http://%s.%s:%d" (include "aiperf-operator.fullname" .) .Release.Namespace (int .Values.resultsServer.port) | quote }}
        {{- with .Values.chaos.controllerHttpUrlOverride }}
        - name: AIPERF_K8S_CONTROLLER_HTTP_URL_OVERRIDE
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.chaos.apiserverServiceHostOverride }}
        - name: KUBERNETES_SERVICE_HOST
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.chaos.apiserverServicePortOverride }}
        - name: KUBERNETES_SERVICE_PORT
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.chaos.apiserverTlsServerNameOverride }}
        - name: AIPERF_K8S_APISERVER_TLS_SERVER_NAME_OVERRIDE
          value: {{ . | quote }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          {{- toYaml .Values.operator.resources | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: results
          mountPath: {{ .Values.storage.mountPath | quote }}
      - name: results-server
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - python
        - -m
        - aiperf.operator.results_server
        ports:
        - name: results
          containerPort: {{ .Values.resultsServer.port }}
          protocol: TCP
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: AIPERF_RESULTS_DIR
          value: {{ .Values.storage.mountPath | quote }}
        - name: AIPERF_RESULTS_SERVER_PORT
          value: {{ .Values.resultsServer.port | quote }}
        - name: TMPDIR
          value: "/tmp"
        - name: MPLCONFIGDIR
          value: "/tmp/matplotlib"
        - name: AIPERF_DASHBOARD_PORT
          value: {{ if .Values.dashboard.enabled }}{{ .Values.dashboard.port | quote }}{{ else }}"0"{{ end }}
        - name: AIPERF_DASHBOARD_PROXY_ENABLED
          value: {{ if .Values.dashboard.enabled }}"1"{{ else }}"0"{{ end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.resultsServer.port }}
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.resultsServer.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          {{- toYaml .Values.resultsServer.resources | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: results
          mountPath: {{ .Values.storage.mountPath | quote }}
          readOnly: true
      {{- if .Values.dashboard.enabled }}
      - name: dashboard
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - python
        - -m
        - aiperf.operator.dashboard_server
        ports:
        - name: dashboard
          containerPort: {{ .Values.dashboard.port }}
          protocol: TCP
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: AIPERF_RESULTS_DIR
          value: {{ .Values.storage.mountPath | quote }}
        - name: AIPERF_DASHBOARD_PORT
          value: {{ .Values.dashboard.port | quote }}
        - name: TMPDIR
          value: "/tmp"
        - name: MPLCONFIGDIR
          value: "/tmp/matplotlib"
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.dashboard.port }}
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.dashboard.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          {{- toYaml .Values.dashboard.resources | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: results
          mountPath: {{ .Values.storage.mountPath | quote }}
          readOnly: true
      {{- end }}
      volumes:
      - name: tmp
        emptyDir:
          {{- with .Values.operator.tmpSizeLimit }}
          sizeLimit: {{ . | quote }}
          {{- end }}
      - name: results
      {{- if .Values.storage.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "aiperf-operator.fullname" . }}-results
      {{- else }}
        emptyDir:
          {{- with .Values.storage.emptyDirSizeLimit }}
          sizeLimit: {{ . | quote }}
          {{- end }}
      {{- end }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
