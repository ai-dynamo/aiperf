apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aiperfsweeps.aiperf.nvidia.com
  labels:
    {{- include "aiperf-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  group: aiperf.nvidia.com
  names:
    kind: AIPerfSweep
    listKind: AIPerfSweepList
    plural: aiperfsweeps
    singular: aiperfsweep
    shortNames:
    - aps
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Completed
      type: integer
      jsonPath: .status.completedRuns
    - name: Total
      type: integer
      jsonPath: .status.maxTotalRuns
    - name: Failed
      type: integer
      jsonPath: .status.failedRuns
    - name: Current
      type: string
      jsonPath: .status.currentCell.label
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            description: Top-level spec for an AIPerfSweep CR.
            properties:
              sweep:
                x-kubernetes-preserve-unknown-fields: true
                description: Variation generator (grid | scenarios). Reuses aiperf.config.sweep.SweepConfig.
                type: object
                x-kubernetes-validations:
                - rule: oldSelf == self
                  message: spec.sweep is immutable after creation
              multiRun:
                type: object
                description: Per-variation trial configuration.
                properties:
                  trials:
                    type: integer
                    minimum: 1
                    maximum: 20
                    description: Fixed trials per variation. Must be unset when `convergence` is set.
                  cooldownSeconds:
                    type: number
                    description: Sleep duration between trials within a variation.
                    default: 0.0
                    minimum: 0
                  autoSetSeed:
                    type: boolean
                    description: Auto-set random seed for workload consistency across trials.
                    default: true
                  disableWarmupAfterFirst:
                    type: boolean
                    description: Skip warmup on trials 2..N for steady-state measurement.
                    default: true
                  mode:
                    type: string
                    enum:
                      - independent
                      - repeated
                    default: repeated
                    description: |
                      Iteration order for sweep + multi-trial. 'repeated' (default)
                      iterates trials outer, variations inner. 'independent' iterates
                      variations outer, trials inner. Both produce the same total runs and
                      same sweep_aggregate output. Adaptive convergence (the `convergence`
                      block) is incompatible with 'repeated' and rejected at submit time.
                x-kubernetes-validations:
                - rule: oldSelf == self
                  message: spec.multiRun is immutable after creation
              convergence:
                type: object
                description: Per-variation adaptive early-stop configuration.
                properties:
                  metric:
                    type: string
                    description: Metric name from docs/metrics-reference.md (e.g., ttft_p99).
                  criterion:
                    type: string
                    description: Convergence criterion. v1 supports cv_threshold only.
                    enum:
                    - cv_threshold
                    default: cv_threshold
                  minRuns:
                    type: integer
                    description: Minimum trials per variation before convergence is checked.
                    default: 3
                    minimum: 2
                  maxRuns:
                    type: integer
                    description: Maximum trials per variation; hard cap regardless of convergence.
                    default: 10
                    minimum: 2
                    maximum: 20
                  threshold:
                    type: number
                    description: Criterion threshold. For cv_threshold, the coefficient-of-variation cap.
                    default: 0.05
                    exclusiveMinimum: true
                    minimum: 0
                    exclusiveMaximum: true
                    maximum: 1
                required:
                - metric
                x-kubernetes-validations:
                - rule: oldSelf == self
                  message: spec.convergence is immutable after creation
              failurePolicy:
                type: object
                description: When and whether to abort on child failure.
                properties:
                  onChildFailure:
                    type: string
                    description: 'continue: failed child becomes a status entry, advance to next variation. abort: any failure
                      terminates the sweep with phase=Failed.'
                    enum:
                    - continue
                    - abort
                    default: continue
                  maxFailures:
                    type: integer
                    description: 0 = unbounded. Otherwise, terminate sweep when failed count reaches this value.
                    default: 0
                    minimum: 0
              cancel:
                type: boolean
                description: 'Cooperative cancel: signals the current child and skips remaining variations.'
                default: false
              ttlSecondsAfterFinished:
                type: integer
                minimum: 0
                description: Parent CR retention after terminal phase; children use their own TTL.
              template:
                type: object
                description: Child stamp; spec is an AIPerfJobSpec.
                properties:
                  metadata:
                    type: object
                    description: ObjectMeta partial merged into every child (labels, annotations).
                    properties:
                      labels:
                        type: object
                        description: Labels merged into every child AIPerfJob.
                        additionalProperties:
                          type: string
                      annotations:
                        type: object
                        description: Annotations merged into every child AIPerfJob.
                        additionalProperties:
                          type: string
                  spec:
                    type: object
                    description: AIPerfJobSpec used as the child stamp. Must not contain sweep:/multi_run:.
                    properties:
                      image:
                        type: string
                        description: Container image for AIPerf
                        default: nvcr.io/nvidia/aiperf:latest
                      imagePullPolicy:
                        type: string
                        description: |-
                          Kubernetes image pull policies.

                          See https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy
                        enum:
                        - Always
                        - Never
                        - IfNotPresent
                      resourceMode:
                        type: string
                        description: CPU/memory resource mode for controller and worker pods.
                        enum:
                        - guaranteed
                        - burstable
                        - none
                        default: guaranteed
                      connectionsPerWorker:
                        type: integer
                        description: Maximum concurrent connections each worker handles.
                        default: 100
                        minimum: 1
                      timeoutSeconds:
                        type: number
                        description: Job timeout in seconds (0 = no timeout)
                        default: 0
                        minimum: 0
                      ttlSecondsAfterFinished:
                        type: integer
                        minimum: 0
                        description: TTL after finished (seconds)
                        default: 300
                      resultsTtlDays:
                        type: integer
                        minimum: 1
                        maximum: 365
                        description: TTL for results in PVC (days)
                      keepFailedPods:
                        type: boolean
                        description: Preserve failed JobSet pod attempts for debugging.
                        default: false
                      cancel:
                        type: boolean
                        description: Set to true to cancel the job
                        default: false
                      podTemplate:
                        type: object
                        description: Pod template configuration
                        properties:
                          env:
                            type: array
                            description: Environment variables in K8s EnvVar format
                            items:
                              type: object
                              additionalProperties: true
                          volumes:
                            type: array
                            description: Pod volumes in K8s Volume format
                            items:
                              type: object
                              additionalProperties: true
                          volumeMounts:
                            type: array
                            description: Volume mounts in K8s VolumeMount format
                            items:
                              type: object
                              additionalProperties: true
                          nodeSelector:
                            type: object
                            description: Node selector labels
                            additionalProperties:
                              type: string
                          tolerations:
                            type: array
                            description: Pod tolerations for scheduling on tainted nodes
                            items:
                              type: object
                              additionalProperties: true
                          affinity:
                            type: object
                            description: Pod affinity/anti-affinity rules in K8s Affinity format (nodeAffinity, podAffinity,
                              podAntiAffinity). Use to co-locate or separate bench pods from other workloads (e.g. keep benchmark
                              pods off inference nodes via podAntiAffinity topologyKey=kubernetes.io/hostname).
                            additionalProperties: true
                          annotations:
                            type: object
                            description: Additional pod annotations
                            additionalProperties:
                              type: string
                          labels:
                            type: object
                            description: Additional pod labels
                            additionalProperties:
                              type: string
                          imagePullSecrets:
                            type: array
                            description: Image pull secret names
                            items:
                              type: string
                          serviceAccountName:
                            type: string
                            description: Service account name for pods
                          containerSecurityContext:
                            type: object
                            description: Container securityContext overrides (merged into each container spec)
                            additionalProperties: true
                          shareProcessNamespace:
                            type: boolean
                            description: When true, all containers in the pod share a single PID namespace. Enables kubectl
                              exec cross-container kills for chaos tests. Keep false in production.
                            default: false
                          priorityClassName:
                            type: string
                            description: Native K8s PriorityClass name for the pod. Distinct from scheduling.priorityClass,
                              which is the Kueue WorkloadPriorityClass. Use this to preempt lower-priority pods via the default
                              scheduler.
                          runtimeClassName:
                            type: string
                            description: K8s RuntimeClass name (e.g. 'nvidia' for GPU runtime, 'kata' for sandboxed runtime).
                          schedulerName:
                            type: string
                            description: Name of the scheduler to dispatch the pod to (e.g. a custom GPU topology scheduler).
                              Omit to use the default scheduler.
                          topologySpreadConstraints:
                            type: array
                            description: Pod TopologySpreadConstraints in K8s format. Useful to spread worker pods evenly
                              across zones/nodes independent of affinity rules.
                            items:
                              type: object
                              additionalProperties: true
                          hostAliases:
                            type: array
                            description: 'Entries appended to the pod''s /etc/hosts (K8s HostAlias format: {ip, hostnames:
                              [...]}). Useful when benchmarking endpoints that aren''t in cluster DNS.'
                            items:
                              type: object
                              additionalProperties: true
                          dnsPolicy:
                            type: string
                            enum:
                            - ClusterFirst
                            - ClusterFirstWithHostNet
                            - Default
                            - None
                            description: Pod DNS policy. Defaults to 'ClusterFirst' (K8s default); set 'None' to supply dns_config
                              entirely.
                          dnsConfig:
                            type: object
                            description: 'Pod DNS config (K8s PodDNSConfig format: nameservers, searches, options). Typically
                              paired with dns_policy=''None''.'
                            additionalProperties: true
                          terminationGracePeriodSeconds:
                            type: integer
                            minimum: 0
                            description: Seconds the kubelet waits for the pod to terminate gracefully before SIGKILL. Defaults
                              to 30 in K8s; raise for long-running benchmarks that need extra time to flush artifacts.
                          podSecurityContext:
                            type: object
                            description: 'Pod-level securityContext (PodSecurityContext format: fsGroup, runAsUser, runAsNonRoot,
                              supplementalGroups, sysctls, etc.). Distinct from container_security_context which applies per-container.'
                            additionalProperties: true
                          initContainers:
                            type: array
                            description: InitContainers that run to completion before the main containers start. Full K8s
                              Container format. Useful for sysctl tweaks (e.g. bumping ip_local_port_range), model pre-fetch,
                              or permission fixups.
                            items:
                              type: object
                              additionalProperties: true
                          extraPodSpec:
                            type: object
                            description: 'Escape hatch: raw PodSpec keys merged into the rendered pod spec last (keys here
                              override typed fields above). Use for K8s PodSpec fields not yet modeled here (e.g. schedulingGates,
                              resourceClaims, overhead). Typed fields are preferred when available because preflight checks,
                              env merging, and securityContext merging only apply to typed fields.'
                            additionalProperties: true
                      skipEndpointCheck:
                        type: boolean
                        description: Skip the operator-side endpoint reachability probe before deploying.
                        default: false
                      benchmark:
                        type: object
                        description: Benchmark configuration (AIPerfConfig).
                        properties:
                          models:
                            type: object
                            description: Model configuration. Accepts a single model name string, a list of model names, or
                              an advanced configuration with strategy and weighted items. All forms are normalized to ModelsAdvanced.
                            properties:
                              strategy:
                                type: string
                                description: Strategy for selecting models when multiple are configured. round_robin cycles
                                  through models, random selects randomly, weighted uses configured weights, modality_aware
                                  routes by input type.
                                enum:
                                - round_robin
                                - random
                                - weighted
                              items:
                                type: array
                                description: List of model configurations. At least one model required.
                                items:
                                  type: object
                                  description: |-
                                    Configuration for a single model in advanced models configuration.

                                    Used when the models section uses the advanced format with
                                    explicit items, weights, and per-model settings.
                                  properties:
                                    name:
                                      type: string
                                      description: Model name or identifier as known to the inference server.
                                    weight:
                                      type: number
                                      minimum: 0.0
                                      maximum: 1.0
                                      description: 'Selection weight for weighted strategy (0.0-1.0). Weights are normalized
                                        across all models. Example: weight=0.7 means ~70%% of requests to this model.'
                                    lora:
                                      type: string
                                      description: LoRA adapter name to load with this model. Server must support dynamic
                                        LoRA adapter loading.
                                    modalities:
                                      type: array
                                      items:
                                        type: string
                                      description: 'List of input modalities this model supports. Used with modality_aware
                                        selection strategy. Valid values: ''text'', ''image'', ''audio'', ''video''.'
                                    tokenizer:
                                      type: object
                                      description: |-
                                        Per-model tokenizer override configuration.

                                        Allows specifying a different tokenizer for a specific model,
                                        useful when models require specialized tokenization.
                                      properties:
                                        name:
                                          type: string
                                          description: HuggingFace tokenizer identifier or local filesystem path.
                                      required:
                                      - name
                                  required:
                                  - name
                                minItems: 1
                            required:
                            - items
                            x-kubernetes-preserve-unknown-fields: true
                          model:
                            description: Shorthand sibling for `models`. Accepts a string, list of strings, or ModelsAdvanced
                              object. Hoisted into `models` by the before-validator and not present after validation.
                            x-kubernetes-preserve-unknown-fields: true
                            type: object
                          endpoint:
                            type: object
                            description: Endpoint configuration for connecting to inference server(s). Includes URLs, API
                              type, authentication, timeout, and connection settings.
                            properties:
                              urls:
                                type: array
                                description: 'List of server URLs to benchmark. Requests distributed according to url_strategy.
                                  Example: [''http://localhost:8000/v1/chat/completions'']'
                                items:
                                  type: string
                                minItems: 1
                                x-kubernetes-preserve-unknown-fields: true
                              urlStrategy:
                                type: string
                                enum:
                                - round_robin
                                description: Strategy for distributing requests across multiple URLs. round_robin cycles through
                                  URLs in order.
                              type:
                                type: string
                                enum:
                                - chat
                                - cohere_rankings
                                - completions
                                - responses
                                - chat_embeddings
                                - embeddings
                                - hf_tei_rankings
                                - huggingface_generate
                                - image_generation
                                - video_generation
                                - image_retrieval
                                - nim_embeddings
                                - nim_rankings
                                - solido_rag
                                - template
                                description: 'API endpoint type determining request/response format. chat: OpenAI chat completions,
                                  completions: OpenAI completions, embeddings: vector embeddings, rankings: reranking, template:
                                  custom format.'
                              path:
                                type: string
                                description: 'Override default endpoint path. Use for servers with non-standard API paths.
                                  Example: ''/custom/v2/generate'''
                              apiKey:
                                type: string
                                description: 'API authentication key. Supports environment variable substitution: ${OPENAI_API_KEY}.
                                  Can also use ${VAR:default} syntax for defaults.'
                              timeout:
                                type: number
                                description: Request timeout in seconds (0 = no timeout). Requests exceeding this duration
                                  are marked as failed. Should exceed expected max response time.
                                default: 600.0
                                minimum: 0.0
                              readyCheckTimeout:
                                type: number
                                description: Seconds to wait for endpoint readiness before benchmarking (0 = skip). Probes
                                  every URL x model name; see ready_check_mode for how the probe is performed.
                                default: 0.0
                                minimum: 0.0
                              readyCheckMode:
                                type: string
                                description: 'How ready_check_timeout probes the endpoint. ''models'': GET /v1/models and
                                  check data[].id (cheap, matches PR #841 behavior; falls back to a plain base-URL GET if
                                  /v1/models returns 404). ''inference'': POST a canned 1-token inference (strongest signal
                                  — proves weights are loaded and a forward pass works). ''both'': run models first, then
                                  inference, on each URL.'
                                enum:
                                - models
                                - inference
                                - both
                                default: inference
                              readyCheckInterval:
                                type: number
                                description: Seconds between readiness probe attempts.
                                default: 5.0
                                exclusiveMinimum: true
                                minimum: 0.0
                              streaming:
                                type: boolean
                                description: Enable streaming (Server-Sent Events) responses. Required for accurate TTFT (time
                                  to first token) measurement. Server must support streaming for this to work.
                                default: false
                              transport:
                                type: string
                                enum:
                                - http
                                - http2
                                description: HTTP transport protocol (http/https). Auto-detected from URL scheme if not specified.
                                  Explicit setting overrides auto-detection.
                              connectionReuse:
                                type: string
                                description: 'HTTP connection management strategy. pooled: shared connection pool (fastest),
                                  never: new connection per request (includes TCP overhead), sticky_sessions: dedicated connection
                                  per session.'
                                enum:
                                - pooled
                                - never
                                - sticky-user-sessions
                              useLegacyMaxTokens:
                                type: boolean
                                description: Use 'max_tokens' field instead of 'max_completion_tokens'. Enable for compatibility
                                  with older OpenAI API versions.
                                default: false
                              useServerTokenCount:
                                type: boolean
                                description: Use server-reported token counts from response usage field. When true, trusts
                                  usage.prompt_tokens and usage.completion_tokens. When false, counts tokens locally using
                                  configured tokenizer.
                                default: false
                              template:
                                type: object
                                description: |-
                                  Configuration for custom template-based endpoints.

                                  When endpoint type is "template", this configures how requests
                                  are formatted and responses are parsed.
                                properties:
                                  body:
                                    type: string
                                    description: 'Jinja2 template string for request body. Variables: {{ "{{" }}prompt{{ "}}" }}, {{ "{{" }}max_tokens{{ "}}" }},
                                      {{ "{{" }}model{{ "}}" }}, {{ "{{" }}messages{{ "}}" }}, etc.'
                                  responseField:
                                    type: string
                                    description: 'JSON path to extract response text from API response. Use dot notation for
                                      nested fields: ''choices.0.message.content''.'
                                    default: text
                                required:
                                - body
                              headers:
                                type: object
                                description: Custom HTTP headers to include in all requests. Useful for authentication, tracing,
                                  or routing. Values support environment variable substitution.
                                additionalProperties:
                                  type: string
                              extra:
                                type: object
                                description: 'Additional fields to include in request body. Merged into every request. Common
                                  fields: temperature, top_p, top_k, stop.'
                                additionalProperties: true
                              downloadVideoContent:
                                type: boolean
                                description: For video generation endpoints, download the video content after generation completes.
                                  Adds a content download step to the async polling flow.
                                default: false
                              requestContentType:
                                type: string
                                description: Content type for HTTP request body serialization.
                                enum:
                                - application/json
                                - multipart/form-data
                            required:
                            - urls
                          datasets:
                            type: array
                            description: Named dataset configurations. Each entry must have a unique 'name' (e.g. 'main',
                              'eval'). Phases reference datasets by name (`phase.dataset = '<name>'`); when omitted, the FIRST
                              dataset in the list is used. Singular `dataset:` shorthand at the BenchmarkConfig top level
                              is normalized to a one-entry list with name='default'.
                            items:
                              x-kubernetes-preserve-unknown-fields: true
                            minItems: 1
                          dataset:
                            description: Shorthand sibling for `datasets`. Accepts a single dataset config (dict). Hoisted
                              into `datasets` as a one-entry list with name='default' by the before-validator and not present
                              after validation.
                            x-kubernetes-preserve-unknown-fields: true
                            type: object
                          phases:
                            type: array
                            description: 'Ordered benchmark phases. Each entry must have a unique ''name'' (e.g. ''warmup'',
                              ''profiling''). Order in the list IS the execution order; the first phase runs first. Single-config
                              shorthand ({''type'': ''concurrency'', ...}) is normalized to a list of one. Top-level ''warmup:''/''profiling:''
                              shorthand is normalized to a [warmup, profiling] list pre-validation.'
                            items:
                              x-kubernetes-preserve-unknown-fields: true
                            minItems: 1
                          warmup:
                            description: Shorthand sibling for `phases`. Accepts a phase config dict; rolled into `phases`
                              as the warmup entry by the before-validator and not present after validation. Mutually exclusive
                              with `phases`; requires `profiling` alongside it.
                            x-kubernetes-preserve-unknown-fields: true
                            type: object
                          profiling:
                            description: Shorthand sibling for `phases`. Accepts a phase config dict; rolled into `phases`
                              as the profiling entry by the before-validator and not present after validation. Mutually exclusive
                              with `phases`.
                            x-kubernetes-preserve-unknown-fields: true
                            type: object
                          artifacts:
                            type: object
                            description: Artifacts configuration for benchmark output. Controls output directory and export
                              formats.
                            properties:
                              dir:
                                type: string
                                description: Output directory for all benchmark artifacts. Created if it doesn't exist.
                                default: artifacts
                              prefix:
                                type: string
                                description: 'Filename prefix for all exported files. Example: ''my_run'' produces ''my_run_summary.json'',
                                  ''my_run_records.jsonl''.'
                                default: aiperf
                              summary:
                                x-kubernetes-preserve-unknown-fields: true
                                description: 'Summary export formats. Options: json, yaml. Set to false to disable.'
                              records:
                                x-kubernetes-preserve-unknown-fields: true
                                description: 'Per-request records export formats. Options: jsonl, csv. Set to false to disable.'
                              raw:
                                type: boolean
                                description: Export raw request/response payloads as JSONL.
                                default: false
                              trace:
                                type: boolean
                                description: Export HTTP trace data for debugging.
                                default: false
                              perChunkData:
                                type: boolean
                                description: Include per-chunk list data (e.g., inter_chunk_latency arrays) in per-record
                                  exports. These arrays contain one timing value per SSE chunk and can be very large for long
                                  responses.
                                default: false
                              sliceDuration:
                                type: number
                                description: 'Time slice duration in seconds for trend analysis (must be > 0). Divides benchmark
                                  into windows for per-window statistics. Supports: 30, ''30s'', ''5m'', ''2h''.'
                              showTraceTiming:
                                type: boolean
                                description: 'Display HTTP trace timing metrics in console output. Shows detailed timing breakdown:
                                  blocked, DNS, connecting, sending, waiting (TTFB), receiving, and total duration.'
                                default: false
                              cliCommand:
                                type: string
                                description: CLI command used to run the benchmark. Populated automatically when running via
                                  CLI.
                              benchmarkId:
                                type: string
                                description: Unique identifier for this benchmark run, used to correlate artifacts across
                                  export formats. Auto-generated if absent.
                              userFiles:
                                type: array
                                description: User-defined templated files materialized into the run directory before the benchmark
                                  begins. See docs/kubernetes/user-files.md.
                                items:
                                  type: object
                                  description: |-
                                    One user-declared output file rendered into the run directory before benchmark start.

                                    Path is relative to the run directory; subdirectories are allowed; absolute
                                    paths and any segment equal to '..' are rejected. Content is rendered with
                                    jinja2 against a documented context (variables: + system-injected names);
                                    see docs/kubernetes/user-files.md.
                                  properties:
                                    path:
                                      type: string
                                      description: Output path relative to the run directory. Subdirectories allowed. Absolute
                                        paths and any segment equal to '..' are rejected.
                                    format:
                                      type: string
                                      enum:
                                      - json
                                      - yaml
                                      - text
                                      description: 'Serialization format. If omitted: ''text'' when content is a string, ''json''
                                        otherwise.'
                                    content:
                                      type: object
                                      x-kubernetes-preserve-unknown-fields: true
                                      description: Templated value. Structured (dict/list/scalar) for json/yaml; string for
                                        text. Jinja2 expressions in any string leaf are rendered with the user_files context.
                                  required:
                                  - path
                                  - content
                          slos:
                            type: object
                            additionalProperties:
                              type: number
                            description: SLO (Service Level Objectives) configuration as a generic dict. Maps metric names
                              to threshold values. A request is counted as good only if it meets ALL specified thresholds.
                          tokenizer:
                            type: object
                            description: |-
                              Tokenizer configuration for token counting and prompt generation.

                              AIPerf uses a HuggingFace tokenizer for accurate token counting,
                              which is essential for ISL/OSL enforcement and metrics calculation.
                            properties:
                              name:
                                type: string
                                description: 'HuggingFace tokenizer identifier, local filesystem path, or `builtin` for a
                                  zero-network-access tokenizer backed by tiktoken (o200k_base encoding). Should match the
                                  model''s tokenizer for accurate token counts. Example: ''meta-llama/Llama-3.1-8B-Instruct'''
                              revision:
                                type: string
                                description: 'Model revision to use: branch name, tag, or commit hash. Use for version pinning
                                  to ensure reproducibility.'
                                default: main
                              trustRemoteCode:
                                type: boolean
                                description: Allow execution of custom tokenizer code from the repository. Required for some
                                  models but poses security risk. Only enable for trusted sources.
                                default: false
                              resolvedNames:
                                type: object
                                additionalProperties:
                                  type: string
                                description: Pre-resolved tokenizer names from alias resolution. Set at runtime by the CLI
                                  or WorkerGroupManager after tokenizer validation. Not serialized to JSON/YAML.
                          gpuTelemetry:
                            type: object
                            description: 'GPU telemetry configuration for DCGM metrics collection. Collects GPU metrics (power,
                              utilization, temperature) from DCGM endpoints. Enabled by default. Set enabled: false to disable.'
                            properties:
                              enabled:
                                type: boolean
