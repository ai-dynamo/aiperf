{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aiperf-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aiperf-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aiperf-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from the benchmark namespace to health (8080) and results (8081).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.benchmarkNamespace.name | quote }}
        {{- range .Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: {{ .Values.resultsServer.port }}
    {{- with .Values.networkPolicy.allowedIngressCIDRs }}
    # Allow external scrapers (e.g. Prometheus, ingress controllers) on CIDR allow-list.
    - from:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: {{ $.Values.resultsServer.port }}
    {{- end }}
  egress:
    # DNS resolution (cluster DNS typically runs in kube-system).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API server (443) — no standard selector, so allow all egress on 443/6443.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Benchmark namespace (spawn/manage JobSets, talk to controller services).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.benchmarkNamespace.name | quote }}
    {{- with .Values.networkPolicy.allowedNamespaces }}
    - to:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
