{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aiperf-operator.fullname" . }}
  labels:
    {{- include "aiperf-operator.labels" . | nindent 4 }}
rules:
# CRD discovery (required by kopf)
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]

# AIPerfJob CRD - full access for operator
- apiGroups: ["aiperf.nvidia.com"]
  resources: ["aiperfjobs", "aiperfjobs/status", "aiperfjobs/finalizers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# AIPerfSweep CRD - full access for operator
- apiGroups: ["aiperf.nvidia.com"]
  resources: ["aiperfsweeps", "aiperfsweeps/status", "aiperfsweeps/finalizers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# JobSets - create and manage benchmark job sets
- apiGroups: ["jobset.x-k8s.io"]
  resources: ["jobsets"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["jobset.x-k8s.io"]
  resources: ["jobsets/status"]
  verbs: ["get", "list", "watch"]

# Kueue LocalQueues - preflight verifies scheduling.queueName exists and
#   probes Kueue installation (get_namespaced_custom_object + list with
#   limit=1 in preflight/_infra.py). Without this the queue check always
#   403s and degrades to WARN.
- apiGroups: ["kueue.x-k8s.io"]
  resources: ["localqueues"]
  verbs: ["get", "list"]

# Jobs - monitor JobSet-created Jobs
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch"]

# Deployments - preflight checks for JobSet controller and other operators
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]

# ServiceAccounts - preflight verifies custom SA existence; sweep handler
#   creates a per-sweep SA (`aiperf-sweep-controller-<sweep>`) so the
#   sweep-controller pod has minimal namespace-scoped access. Cleanup is via
#   OwnerReferences, so update/patch/delete are not required.
# ResourceQuotas - preflight inspects quotas before scheduling
# Secrets - preflight verifies referenced imagePullSecrets / env secrets
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get", "list", "watch", "create"]
- apiGroups: [""]
  resources: ["resourcequotas", "secrets"]
  verbs: ["get", "list", "watch"]

# NetworkPolicies - preflight checks benchmark-namespace network policies
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch"]

# ConfigMaps - store benchmark configuration and support per-job Role creation.
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

# Services and endpoints - per-job controller networking.
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["create", "delete", "get", "list", "watch"]

# RBAC - create Roles and RoleBindings for benchmark pods
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings"]
  verbs: ["create", "delete", "get", "list", "watch"]

# Namespaces - access for AIPerfJob resources
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]

# Pods - monitor pod status and restarts
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]

# Nodes - query GPU count for UI cluster endpoint
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]

# Events - emit Kubernetes events and allow benchmark pods to read them
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch", "create", "patch"]
{{- end }}
