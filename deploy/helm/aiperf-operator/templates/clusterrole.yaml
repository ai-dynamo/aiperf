{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aiperf-operator.fullname" . }}
  labels:
    {{- include "aiperf-operator.labels" . | nindent 4 }}
rules:
# CRD discovery (required by kopf)
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]

# AIPerfJob CRD - full access for operator
- apiGroups: ["aiperf.nvidia.com"]
  resources: ["aiperfjobs", "aiperfjobs/status", "aiperfjobs/finalizers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# AIPerfSweep CRD - full access for operator
- apiGroups: ["aiperf.nvidia.com"]
  resources: ["aiperfsweeps", "aiperfsweeps/status", "aiperfsweeps/finalizers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# JobSets - create and manage benchmark job sets
- apiGroups: ["jobset.x-k8s.io"]
  resources: ["jobsets"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["jobset.x-k8s.io"]
  resources: ["jobsets/status"]
  verbs: ["get", "list", "watch"]

# Kueue Workloads - monitor admission status for gang-scheduling
- apiGroups: ["kueue.x-k8s.io"]
  resources: ["workloads"]
  verbs: ["get", "list", "watch"]

# Jobs - monitor JobSet-created Jobs
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch"]

# Deployments - preflight checks for JobSet controller and other operators
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]

# ServiceAccounts - preflight verifies custom SA existence; sweep handler
#   creates a per-sweep SA (`aiperf-sweep-controller-<sweep>`) so the
#   sweep-controller pod has minimal namespace-scoped access.
# ResourceQuotas - preflight inspects quotas before scheduling
# Secrets - preflight verifies referenced imagePullSecrets / env secrets
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["resourcequotas", "secrets"]
  verbs: ["get", "list", "watch"]

# NetworkPolicies - preflight checks benchmark-namespace network policies
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch"]

# ConfigMaps - store benchmark configuration. Operator only `create`s
# (k8s_helpers.py) and `read`s (routers/jobs.py); cleanup is via OwnerReferences.
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create", "get", "list", "watch"]

# RBAC - create Roles and RoleBindings for benchmark pods
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings"]
  verbs: ["create", "delete", "get", "list", "watch"]

# Namespaces - access for AIPerfJob resources
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]

# Pods - monitor pod status and restarts
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]

# Nodes - query GPU count for UI cluster endpoint
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]

# Events - emit Kubernetes events and allow benchmark pods to read them
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch", "create", "patch"]

# ServiceAccounts - operator creates the per-sweep SA on AIPerfSweep create
# (handlers/sweep/create.py:_provision_rbac); 409-skips on conflict.
# Cleanup is via OwnerReferences. update/patch/delete unused but kept for
# parity with roles/rolebindings rule above.
{{- end }}
