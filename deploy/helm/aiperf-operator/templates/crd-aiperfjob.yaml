apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aiperfjobs.aiperf.nvidia.com
  labels:
    {{- include "aiperf-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  group: aiperf.nvidia.com
  names:
    kind: AIPerfJob
    listKind: AIPerfJobList
    plural: aiperfjobs
    singular: aiperfjob
    shortNames:
    - apj
    - aiperf
    categories:
    - all
    - aiperf
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Stage
      type: string
      jsonPath: .status.currentPhase
      description: Current benchmark stage (warmup, profiling)
    - name: Done
      type: integer
      jsonPath: .status.requestsCompleted
      description: Requests completed in the active results-producing phase
    - name: Total
      type: integer
      jsonPath: .status.requestsTotal
      description: Total expected requests in the active results-producing phase
    - name: QPS
      type: number
      jsonPath: .status.requestsPerSecond
      description: Requests per second in the active results-producing phase
    - name: TPS
      type: number
      jsonPath: .status.summary.output_token_throughput.avg
      description: Output tokens per second (status.summary.output_token_throughput.avg)
    - name: TTFT
      type: number
      jsonPath: .status.summary.time_to_first_token.p50
      description: Time to first token P50 in ms (status.summary.time_to_first_token.p50)
    - name: ITL
      type: number
      jsonPath: .status.summary.inter_token_latency.p50
      description: Inter-token latency P50 in ms (status.summary.inter_token_latency.p50)
    - name: E2E
      type: number
      jsonPath: .status.summary.request_latency.p50
      description: End-to-end request latency P50 in ms (status.summary.request_latency.p50)
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    - name: TTFT_P99
      type: number
      jsonPath: .status.summary.time_to_first_token.p99
      description: Time to first token P99 in ms
      priority: 1
    - name: ITL_P99
      type: number
      jsonPath: .status.summary.inter_token_latency.p99
      description: Inter-token latency P99 in ms
      priority: 1
    - name: E2E_P99
      type: number
      jsonPath: .status.summary.request_latency.p99
      description: End-to-end request latency P99 in ms
      priority: 1
    - name: TTFT_AVG
      type: number
      jsonPath: .status.summary.time_to_first_token.avg
      description: Time to first token average in ms
      priority: 1
    - name: ITL_AVG
      type: number
      jsonPath: .status.summary.inter_token_latency.avg
      description: Inter-token latency average in ms
      priority: 1
    - name: E2E_P99_9
      type: number
      jsonPath: .status.summary.request_latency.p99_9
      description: End-to-end request latency P99.9 in ms
      priority: 1
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            description: |-
              AIPerfJob specification.

              spec.benchmark holds BenchmarkConfig fields (models, endpoint,
              datasets, phases, etc.) using camelCase aliases (urlStrategy,
              apiKey, readyCheckTimeout, …). The underlying Pydantic model
              also accepts the snake_case names used in AIPerf CLI YAML,
              but the apiserver schema only advertises camelCase.

              Top-level deployment fields (image, podTemplate, scheduling,
              etc.) use camelCase per Kubernetes API conventions.
            properties:
              image:
                type: string
                description: Container image for AIPerf
                default: {{ default (printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion)) .Values.defaults.image | quote }}
                minLength: 1
              imagePullPolicy:
                type: string
                {{- with .Values.defaults.imagePullPolicy }}
                default: {{ . | quote }}
                {{- end }}
                description: |-
                  Kubernetes image pull policies.

                  See https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy
                enum:
                - Always
                - Never
                - IfNotPresent
              benchmark:
                type: object
                description: |-
                  Benchmark workload (BenchmarkConfig). Strictly typed via the
                  BenchmarkConfig schema, with x-kubernetes-preserve-unknown-fields: true
                  at narrow shorthand boundaries (models, distributions, endpoint urls,
                  top-level shortcut fields, telemetry urls).

                  Field naming: the apiserver schema enforces camelCase (e.g.
                  urlStrategy, apiKey, readyCheckTimeout). The Pydantic model also
                  accepts the snake_case form (url_strategy, api_key, …) used in
                  AIPerf CLI YAML — those names are accepted by the operator at parse
                  time but are not advertised by this schema, so kubectl/IDE tooling
                  should write camelCase. Shorthand forms (e.g. models: ['name'],
                  single-phase dict, top-level warmup/profiling) are accepted at marked
                  boundaries and normalized by the operator before validation.
                properties:
                  models:
                    x-kubernetes-preserve-unknown-fields: true
                    description: Model configuration. Accepts a single model name string, a list of model names, or an advanced
                      configuration with strategy and weighted items. All forms are normalized to ModelsAdvanced.
                  model:
                    description: Shorthand sibling for `models`. Accepts a string, list of strings, or ModelsAdvanced object.
                      Hoisted into `models` by the before-validator and not present after validation.
                    x-kubernetes-preserve-unknown-fields: true
                  endpoint:
                    type: object
                    description: Endpoint configuration for connecting to inference server(s). Includes URLs, API type, authentication,
                      timeout, and connection settings.
                    properties:
                      urls:
                        x-kubernetes-preserve-unknown-fields: true
                        description: 'List of server URLs to benchmark. Requests distributed according to url_strategy. URLs
                          without a scheme have ``http://`` prepended automatically. Example: [''http://localhost:8000/v1/chat/completions'']'
                      urlStrategy:
                        type: string
                        enum:
                        - round_robin
                        description: Strategy for distributing requests across multiple URLs. round_robin cycles through URLs
                          in order.
                        default: round_robin
                      type:
                        type: string
                        enum:
                        - audio_transcription
                        - chat
                        - cohere_rankings
                        - completions
                        - responses
                        - messages
                        - chat_embeddings
                        - embeddings
                        - hf_tei_rankings
                        - huggingface_generate
                        - image_generation
                        - image_edit
                        - video_generation
                        - image_retrieval
                        - nim_embeddings
                        - nim_rankings
                        - solido_rag
                        - raw
                        - template
                        description: 'API endpoint type determining request/response format. chat: OpenAI chat completions,
                          completions: OpenAI completions, embeddings: vector embeddings, rankings: reranking, template: custom
                          format, and others — see `aiperf plugins` for the full list.'
                      path:
                        type: string
                        description: 'Override default endpoint path. Use for servers with non-standard API paths. Example:
                          ''/custom/v2/generate'''
                      apiKey:
                        type: string
                        description: 'API authentication key. Supports environment variable substitution: ${OPENAI_API_KEY}.
                          Can also use ${VAR:default} syntax for defaults.'
                      timeout:
                        type: number
                        description: Request timeout in seconds (0 = no timeout). Requests exceeding this duration are marked
                          as failed. Should exceed expected max response time.
                        default: 21600
                        minimum: 0.0
                      streaming:
                        type: boolean
                        description: Enable streaming (Server-Sent Events) responses. Required for accurate TTFT (time to
                          first token) measurement. Server must support streaming for this to work.
                        default: false
                      transport:
                        type: string
                        enum:
                        - http
                        description: Transport plugin name. Currently only 'http' (aiohttp-based HTTP/1.1) is shipped. Auto-detected
                          from URL when unset; explicit setting overrides auto-detection.
                      connectionReuse:
                        type: string
                        description: 'HTTP connection management strategy. pooled: shared connection pool (fastest), never:
                          new connection per request (includes TCP overhead), sticky-user-sessions: dedicated connection per
                          user session.'
                        enum:
                        - pooled
                        - never
                        - sticky-user-sessions
                        default: pooled
                      useLegacyMaxTokens:
                        type: boolean
                        description: Use 'max_tokens' field instead of 'max_completion_tokens'. Enable for compatibility with
                          older OpenAI API versions.
                        default: false
                      useServerTokenCount:
                        type: boolean
                        description: Use server-reported token counts from response usage field. When true, trusts usage.prompt_tokens
                          and usage.completion_tokens. When false, counts tokens locally using configured tokenizer.
                        default: false
                      template:
                        type: object
                        description: |-
                          Configuration for custom template-based endpoints.

                          When endpoint type is "template", this configures how requests
                          are formatted and responses are parsed.
                        properties:
                          body:
                            type: string
                            description: 'Jinja2 template string for request body. Variables: {{ "{{" }}prompt{{ "}}" }}, {{ "{{" }}max_tokens{{ "}}" }},
                              {{ "{{" }}model{{ "}}" }}, {{ "{{" }}messages{{ "}}" }}, etc.'
                          responseField:
                            type: string
                            description: 'JSON path to extract response text from API response. Use dot notation for nested
                              fields: ''choices.0.message.content''.'
                            default: text
                        required:
                        - body
                      headers:
                        type: object
                        description: Custom HTTP headers to include in all requests. Useful for authentication, tracing, or
                          routing. Values support environment variable substitution.
                        additionalProperties:
                          type: string
                      extra:
                        type: object
                        description: 'Additional fields to include in request body. Merged into every request. Common fields:
                          temperature, top_p, top_k, stop.'
                        x-kubernetes-preserve-unknown-fields: true
                      downloadVideoContent:
                        type: boolean
                        description: For video generation endpoints, download the video content after generation completes.
                          Adds a content download step to the async polling flow.
                        default: false
                      requestContentType:
                        type: string
                        description: Content type for HTTP request body serialization.
                        enum:
                        - application/json
                        - multipart/form-data
                      sessionHeader:
                        type: string
                        description: HTTP header name used to carry the per-session affinity identifier. When set, replaces
                          the default `X-Correlation-ID` header. Useful when the inference server expects a custom session-affinity
                          header (e.g. `--session-header X-Session-ID`).
                      uuidAndStrip:
                        type: boolean
                        description: Enable AIPerf-managed image stripping for vLLM's multimodal processor cache. Dataset-authored
                          image UUIDs, including UUID-only cache references, always pass through on the chat endpoint; this
                          flag only strips repeated content after AIPerf observes it in the same session. Automatic stripping
                          supports only single_turn datasets with session_id-grouped rows; multi_turn is rejected. The server
                          cache must cover the working set, and requests in a session must reach a replica that retains earlier
                          UUIDs.
                        default: false
                      waitForModelTimeout:
                        type: number
                        description: Enable a pre-flight readiness probe by setting this to a positive value (seconds). aiperf
                          applies this timeout to each URL/model probe before starting the benchmark, aborting with a non-zero
                          exit if any probe times out. For multiple URLs or models, worst-case wall-clock time can be roughly
                          this timeout multiplied by the number of URL/model probes. The probe strategy is controlled by `--wait-for-model-mode`,
                          which defaults to sending a 1-token inference request. 0 (default) disables the probe. Eliminates
                          the need for external shell-based readiness loops in containers and Kubernetes recipes.
                        default: 0.0
                        minimum: 0.0
                      waitForModelInterval:
                        type: number
                        description: Seconds between readiness probe attempts. Only consulted when `--wait-for-model-timeout`
                          is positive.
                        default: 5.0
                        exclusiveMinimum: true
                        minimum: 0.0
                      waitForModelMode:
                        type: string
                        description: 'Strategy for the readiness probe. ''inference'' (default): POST a 1-token inference
                          request to the configured endpoint; this is the strongest signal — it proves the full stack (frontend,
                          scheduler, worker, forward pass) is live. Any HTTP status < 500 counts as ready. ''models'': GET
                          `/v1/models` and verify the model id appears in `data[]` (cheaper, no tokens consumed; falls back
                          to a plain GET on the base URL on 404). ''both'': run ''models'' first, then ''inference''. Only
                          consulted when `--wait-for-model-timeout` is positive.'
                        enum:
                        - models
                        - inference
                        - both
                        default: inference
                      resetKvCache:
                        type: object
                        properties:
                          timeoutSeconds:
                            type: number
                            exclusiveMinimum: true
                            minimum: 0
                            description: Timeout in seconds for the reset_kv_cache POST. When unset, uses endpoint.timeout.
                          path:
                            type: string
                            description: 'Relative path for KV-cache reset. Default: /reset_prefix_cache.'
                        description: When enabled, POST a KV-cache reset once per logical benchmark cell before warmup/profiling.
                          Accepts false | true | {timeout_seconds?, path?}.
                      serverProfiler:
                        type: object
                        properties:
                          timeoutSeconds:
                            type: number
                            exclusiveMinimum: true
                            minimum: 0
                            description: Timeout in seconds for profiler start/stop POSTs. When unset, uses endpoint.timeout.
                          startPath:
                            type: string
                            description: 'Relative path for profiler start. Default: /start_profile.'
                          stopPath:
                            type: string
                            description: 'Relative path for profiler stop. Default: /stop_profile.'
                        description: When enabled, start/stop the server profiler around each profiling phase. Accepts false
                          | true | {timeout_seconds?, start_path?, stop_path?}.
                    required:
                    - urls
                    x-kubernetes-validations:
                    - rule: '!has(self.type) || self.type != ''template'' || has(self.template)'
                      message: endpoint.template is required when endpoint.type='template'
                    - rule: '!has(self.template) || !has(self.type) || self.type == ''template'''
                      message: endpoint.template is only used when endpoint.type='template' (omit type to have it inferred)
                    - rule: '!has(self.requestContentType) || self.requestContentType != ''multipart/form-data'' || !has(self.type)
                        || self.type in [''audio_transcription'', ''image_edit'', ''video_generation'']'
                      message: 'requestContentType=''multipart/form-data'' is only supported on endpoint types that accept
                        form data: audio_transcription, image_edit, video_generation'
                    - rule: '!has(self.path) || self.path.startsWith(''/'')'
                      message: endpoint.path must start with '/' (e.g. '/v1/chat/completions', not 'v1/chat/completions')
                  datasets:
                    type: array
                    description: Dataset configuration as a single-element list. The list shape exists to share the schema
                      between YAML and the AIPerfSweep CRD; the runtime currently loads exactly one dataset. Singular `dataset:`
                      shorthand at the BenchmarkConfig top level is normalized to a one-entry list with name='default'.
                    items:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    minItems: 1
                    maxItems: 1
                  dataset:
                    description: Shorthand sibling for `datasets`. Accepts a single dataset config (dict). Hoisted into `datasets`
                      as a one-entry list with name='default' by the before-validator and not present after validation.
                    x-kubernetes-preserve-unknown-fields: true
                  phases:
                    type: array
                    description: 'Ordered benchmark phases. Each entry must have a unique ''name'' (e.g. ''warmup'', ''profiling'').
                      Order in the list IS the execution order; the first phase runs first. Single-config shorthand ({''type'':
                      ''concurrency'', ...}) is normalized to a list of one. Top-level ''warmup:''/''profiling:'' shorthand
                      is normalized to a [warmup, profiling] list pre-validation.'
                    items:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    minItems: 1
                  warmup:
                    description: Shorthand sibling for `phases`. Accepts a phase config dict; rolled into `phases` as the
                      warmup entry by the before-validator and not present after validation. Mutually exclusive with `phases`;
                      requires `profiling` alongside it.
                    x-kubernetes-preserve-unknown-fields: true
                  profiling:
                    description: Shorthand sibling for `phases`. Accepts a phase config dict; rolled into `phases` as the
                      profiling entry by the before-validator and not present after validation. Mutually exclusive with `phases`.
                    x-kubernetes-preserve-unknown-fields: true
                  artifacts:
                    type: object
                    description: Artifacts configuration for benchmark output. Controls output directory and export formats.
                    properties:
                      dir:
                        type: string
                        description: Output directory for all benchmark artifacts. Created if it doesn't exist.
                        default: artifacts
                      prefix:
                        type: string
                        description: 'Base filename override applied to ALL profile and server-metrics exports. With prefix=''foo''
                          every output becomes `foo.csv`, `foo.json`, `foo_timeslices.{csv,json}`, `foo.jsonl`, `foo_raw.jsonl`,
                          `foo_gpu_telemetry.jsonl`, `foo_server_metrics.{jsonl,json,csv,parquet}`. When unset (the default),
                          historical per-file names are used: `profile_export_aiperf.csv/json`, `profile_export.jsonl`, `profile_export_raw.jsonl`,
                          `gpu_telemetry_export.jsonl`, `server_metrics_export.{jsonl,json,csv,parquet}`. Known suffixes (`_raw.jsonl`,
                          `_timeslices.{csv,json}`, `_gpu_telemetry.jsonl`, `_server_metrics.{jsonl,json,csv,parquet}`, `.csv`/`.json`/`.jsonl`/`.parquet`)
                          are stripped from the supplied value so `--profile-export-prefix foo_raw.jsonl` still yields a clean
                          `foo` base.'
                      summary:
                        x-kubernetes-preserve-unknown-fields: true
                        description: Summary export formats. Only 'json' is wired up to this field; the CSV summary is emitted
                          regardless. Set to false to disable the summary JSON file only.
                      records:
                        x-kubernetes-preserve-unknown-fields: true
                        description: Per-request records export formats. Only 'jsonl' is wired up today. Set to false to disable
                          the per-record JSONL file.
                      raw:
                        type: boolean
                        description: Export raw request/response payloads as JSONL.
                        default: false
                      trace:
                        type: boolean
                        description: Export HTTP trace data for debugging.
                        default: false
                      sliceDuration:
                        type: number
                        description: 'Time slice duration in seconds for trend analysis (must be > 0). Divides benchmark into
                          windows for per-window statistics. Supports: 30, ''30s'', ''5m'', ''2h''.'
                      showTraceTiming:
                        type: boolean
                        description: 'Display HTTP trace timing metrics in console output. Shows detailed timing breakdown:
                          blocked, DNS, connecting, sending, waiting (TTFB), receiving, and total duration.'
                        default: false
                      userFiles:
                        type: array
                        description: User-defined templated files materialized into the run directory before the benchmark
                          begins.
                        items:
                          type: object
                          description: |-
                            One user-declared output file rendered into the run directory before benchmark start.

                            Path is relative to the run directory; subdirectories are allowed; absolute
                            paths and any segment equal to '..' are rejected. Content is rendered with
                            jinja2 against a documented context (variables: + system-injected names).
                          properties:
                            path:
                              type: string
                              description: Output path relative to the run directory. Subdirectories allowed. Absolute paths
                                and any segment equal to '..' are rejected.
                            format:
                              type: string
                              enum:
                              - json
                              - yaml
                              - text
                              description: 'Serialization format. If omitted: ''text'' when content is a string, ''json''
                                otherwise.'
                            content:
                              type: object
                              x-kubernetes-preserve-unknown-fields: true
                              description: Templated value. Structured (dict/list/scalar) for json/yaml; string for text.
                                Jinja2 expressions in any string leaf are rendered with the user_files context.
                          required:
                          - path
                          - content
                      autoPlot:
                        type: boolean
                        description: Auto-invoke `aiperf plot` against the artifact directory after the benchmark completes.
                          Resolved by the CLI converter from the tri-state CLI flag and the active search recipe's auto_plot_default;
                          by the time it lands here it is a plain bool.
                        default: false
                      plotRequired:
                        type: boolean
                        description: 'Treat auto-plot failures as fatal: re-raise so `aiperf profile` exits non-zero. Only
                          meaningful when auto_plot is True. Default False = warn and continue.'
                        default: false
                      exportOutputsJson:
                        type: boolean
                        description: Export generated response text to outputs.json after the run.
                        default: false
                  slos:
                    type: object
                    additionalProperties:
                      type: number
                    description: SLO (Service Level Objectives) configuration as a generic dict. Maps metric names to threshold
                      values. A request is counted as good only if it meets ALL specified thresholds.
                  tokenizer:
                    type: object
                    description: |-
                      Tokenizer configuration for token counting and prompt generation.

                      AIPerf uses a HuggingFace tokenizer for accurate token counting,
                      which is essential for ISL/OSL enforcement and metrics calculation.
                    properties:
                      name:
                        type: string
                        description: 'HuggingFace tokenizer identifier, local filesystem path, or `builtin` for a zero-network-access
                          tokenizer backed by tiktoken (o200k_base encoding). Should match the model''s tokenizer for accurate
                          token counts. If `--tokenizer` is not set and the model name looks like an obvious placeholder (e.g.
                          `mock-model`, `test-model`, `fake-model`), AIPerf substitutes `builtin` automatically and emits
                          a warning. Example: ''meta-llama/Llama-3.1-8B-Instruct'''
                      revision:
                        type: string
                        description: 'Model revision to use: branch name, tag, or commit hash. Use for version pinning to
                          ensure reproducibility.'
                        default: main
                      trustRemoteCode:
                        type: boolean
                        description: Allow execution of custom tokenizer code from the repository. Required for some models
                          but poses security risk. Only enable for trusted sources.
                        default: false
                      applyChatTemplate:
                        type: boolean
                        description: 'Apply the HuggingFace tokenizer''s chat template when counting input tokens. When enabled:
                          synthetic ISL is compensated for chat-template wrapping (BOS, role headers, EOT, generation-prompt
                          suffix) and the record processor reports ISL using `apply_chat_template(tokenize=True, add_generation_prompt=True)`
                          for chat-shape payloads. When disabled (default), both paths use bare-text encoding, so reported
                          ISL matches the prompt content the user asked for and ignores template overhead. Requires an HF
                          tokenizer with a chat template configured; no-ops on tiktoken / un-templated models.'
                        default: false
                      resolvedNames:
                        type: object
                        additionalProperties:
                          type: string
                        description: Pre-resolved tokenizer names from alias resolution. [runtime-only; populated by the CLI
                          or WorkerGroupManager after tokenizer validation. Excluded from JSON/YAML serialization. Do not
                          set in a CR spec — any user value is ignored.]
                  gpuTelemetry:
                    x-kubernetes-preserve-unknown-fields: true
                    description: 'GPU telemetry configuration for DCGM metrics collection. Collects GPU metrics (power, utilization,
                      temperature) from DCGM endpoints. Enabled by default. Set enabled: false to disable.'
                  serverMetrics:
                    x-kubernetes-preserve-unknown-fields: true
                    description: 'Server metrics configuration for Prometheus scraping. Collects operational metrics (queue
                      depth, KV cache, batch sizes) from inference server Prometheus endpoints. Enabled by default. Set enabled:
                      false to disable.'
                  networkLatency:
                    x-kubernetes-preserve-unknown-fields: true
                    description: Network latency calibration configuration. Probes the endpoint RTT during profiling and subtracts
                      the mean from latency metrics, emitted as separate network_adjusted_* metrics. Disabled by default.
                  otel:
                    type: object
                    description: OpenTelemetry metrics streaming configuration.
                    properties:
                      metricsUrl:
                        type: string
                        description: OTLP/HTTP metrics endpoint URL.
                      streamMetricsEnabled:
                        type: boolean
                        description: Stream metric records to OTel.
                        default: true
                      streamTimingEnabled:
                        type: boolean
                        description: Stream timing records to OTel.
                        default: true
                      customResourceAttributes:
                        type: object
                        description: Custom OTel resource attributes.
                        additionalProperties:
                          type: string
                      genAiProvider:
                        type: string
                        description: GenAI semantic convention provider override.
                  mlflow:
                    type: object
                    description: MLflow tracking and artifact-upload configuration.
                    properties:
                      trackingUri:
                        type: string
                        description: MLflow tracking URI.
                      experiment:
                        type: string
                        description: MLflow experiment name.
                        default: aiperf
                      runName:
                        type: string
                        description: MLflow run name.
                      tags:
                        type: object
                        additionalProperties:
                          type: string
                        description: Additional MLflow run tags to attach on upload.
                      parentRunId:
                        type: string
                        description: Optional MLflow parent run ID.
                      artifactGlobs:
                        type: array
                        items:
                          type: string
                        description: Artifact glob overrides for MLflow upload.
                  wandb:
                    type: object
                    description: Weights & Biases run-upload configuration.
                    properties:
                      project:
                        type: string
                        description: Weights & Biases project name. Setting this enables wandb export.
                      entity:
                        type: string
                        description: Weights & Biases entity (team or user). Defaults to the API key's default entity.
                      runName:
                        type: string
                        description: Weights & Biases run name.
                      tags:
                        type: array
                        items:
                          type: string
                        description: Additional Weights & Biases run tags to attach on upload.
                  runtime:
                    type: object
                    description: Runtime configuration for worker processes and inter-process communication.
                    properties:
                      ui:
                        type: string
                        enum:
                        - dashboard
                        - none
                        - simple
                        description: 'User interface mode. dashboard: rich interactive UI, simple: text progress, none: silent
                          operation.'
                        default: dashboard
                      workers:
                        description: Total worker processes across the deployment (the maximum, ramped up to from `workers_min`).
                          null = auto-detect based on CPU cores. Distinct from `workers_per_pod` (per-Kubernetes-pod fan-out)
                          and `workers_min` (lower bound for adaptive ramp).
                        x-kubernetes-int-or-string: true
                      recordProcessors:
                        type: integer
                        minimum: 1
                        description: Total parallel record processors across the deployment. null = auto-detect based on CPU
                          cores. Distinct from `record_processors_per_pod` (per-Kubernetes-pod fan-out).
                      serviceRunType:
                        type: string
                        enum:
                        - kubernetes
                        - multiprocessing
                        description: 'Execution mode. multiprocessing: local multi-process (default for `aiperf profile`).
                          kubernetes: distributed across pods. [operator-managed under AIPerfJob — the operator forces ''kubernetes''
                          on the controller pod; do not set this in a CR spec.]'
                        default: multiprocessing
                      communication:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        description: Inter-process communication configuration. Defaults to IPC for single-machine operation.
