{{- if .Values.rbac.create }}
{{- $namespaces := list }}
{{- if .Values.benchmarkNamespace.create }}
{{- $namespaces = append $namespaces .Values.benchmarkNamespace.name }}
{{- end }}
{{- range .Values.benchmarkRbacNamespaces }}
{{- $namespaces = append $namespaces . }}
{{- end }}
{{- range $ns := $namespaces | uniq }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aiperf-operator.fullname" $ }}-benchmark
  namespace: {{ $ns }}
  labels:
    {{- include "aiperf-operator.labels" $ | nindent 4 }}
rules:
# Pods - benchmark pods need to discover peers for coordination
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]

# JobSets - benchmark pods signal completion via status patches
- apiGroups: ["jobset.x-k8s.io"]
  resources: ["jobsets"]
  verbs: ["get", "list", "watch", "patch", "update"]

# AIPerfJobs - benchmark pods read config and patch status
- apiGroups: ["aiperf.nvidia.com"]
  resources: ["aiperfjobs", "aiperfjobs/status"]
  verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aiperf-operator.fullname" $ }}-benchmark
  namespace: {{ $ns }}
  labels:
    {{- include "aiperf-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aiperf-operator.fullname" $ }}-benchmark
subjects:
- kind: ServiceAccount
  name: default
  namespace: {{ $ns }}
{{- end }}
{{- /* Read-only pods access in EXISTING inference namespaces (e.g. a Dynamo
       deployment namespace) so benchmark pods can run cross-namespace
       server-metrics endpoint discovery (server_metrics.discovery.namespace).
       Bound to the benchmark namespaces' `default` ServiceAccount — NOT the
       local one — and deliberately narrower than the benchmark Role above.
       The chart does not create these namespaces. */ -}}
{{- $subjectNamespaces := prepend .Values.benchmarkRbacNamespaces .Values.benchmarkNamespace.name | uniq }}
{{- range $ns := .Values.serverMetricsDiscoveryNamespaces | uniq }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "aiperf-operator.fullname" $ }}-metrics-discovery
  namespace: {{ $ns }}
  labels:
    {{- include "aiperf-operator.labels" $ | nindent 4 }}
rules:
# Pods - read-only, enough for server-metrics /metrics endpoint discovery
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aiperf-operator.fullname" $ }}-metrics-discovery
  namespace: {{ $ns }}
  labels:
    {{- include "aiperf-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aiperf-operator.fullname" $ }}-metrics-discovery
subjects:
{{- range $benchNs := $subjectNamespaces }}
- kind: ServiceAccount
  name: default
  namespace: {{ $benchNs }}
{{- end }}
{{- end }}
{{- end }}
