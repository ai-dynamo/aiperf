apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aiperfjobs.aiperf.nvidia.com
  labels:
    {{- include "aiperf-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  group: aiperf.nvidia.com
  names:
    kind: AIPerfJob
    listKind: AIPerfJobList
    plural: aiperfjobs
    singular: aiperfjob
    shortNames:
    - apj
    - aiperf
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Stage
      type: string
      jsonPath: .status.currentPhase
      description: Current benchmark stage (warmup, profiling)
    - name: Progress
      type: string
      jsonPath: .status.phases.profiling.requestsCompleted
      description: Requests completed in profiling phase
    - name: QPS
      type: number
      jsonPath: .status.phases.profiling.requestsPerSecond
      description: Requests per second in profiling phase
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            description: |-
              AIPerfJob specification.

              spec.benchmark: AIPerfConfig fields (models, endpoint, datasets,
              phases, etc.) in snake_case — identical to AIPerf CLI YAML.

              Top-level deployment fields (image, podTemplate, scheduling, etc.)
              use camelCase following Kubernetes API conventions.
            properties:
              image:
                type: string
                description: Container image
                default: {{ .Values.defaults.image | quote }}
              imagePullPolicy:
                type: string
                description: |-
                  Kubernetes image pull policies.

                  See https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy
                enum:
                - Always
                - Never
                - IfNotPresent
              keepFailedPods:
                type: boolean
                description: Preserve failed JobSet pod attempts for debugging.
                default: false
              benchmark:
                type: object
                description: |-
                  Benchmark configuration (AIPerfConfig). Strictly typed via the
                  AIPerfConfig schema, with x-kubernetes-preserve-unknown-fields: true
                  at narrow shorthand boundaries (models, distributions, endpoint urls,
                  top-level shortcut fields, telemetry urls). Snake_case field names —
                  identical to AIPerf CLI YAML config files. Shorthand forms (e.g.
                  models: ['name'], single-phase dict) are accepted at marked boundaries
                  and normalized by the operator before validation.
                properties:
                  models:
                    type: object
                    description: Model configuration. Accepts a single model name string, a list of model names, or an advanced
                      configuration with strategy and weighted items. All forms are normalized to ModelsAdvanced.
                    properties:
                      strategy:
                        type: string
                        description: Strategy for selecting models when multiple are configured. round_robin cycles through
                          models, random selects randomly, weighted uses configured weights, modality_aware routes by input
                          type.
                        enum:
                        - round_robin
                        - random
                        - weighted
                      items:
                        type: array
                        description: List of model configurations. At least one model required.
                        items:
                          type: object
                          description: |-
                            Configuration for a single model in advanced models configuration.

                            Used when the models section uses the advanced format with
                            explicit items, weights, and per-model settings.
                          properties:
                            name:
                              type: string
                              description: Model name or identifier as known to the inference server.
                            weight:
                              type: number
                              minimum: 0.0
                              maximum: 1.0
                              description: 'Selection weight for weighted strategy (0.0-1.0). Weights are normalized across
                                all models. Example: weight=0.7 means ~70%% of requests to this model.'
                            lora:
                              type: string
                              description: LoRA adapter name to load with this model. Server must support dynamic LoRA adapter
                                loading.
                            modalities:
                              type: array
                              items:
                                type: string
                              description: 'List of input modalities this model supports. Used with modality_aware selection
                                strategy. Valid values: ''text'', ''image'', ''audio'', ''video''.'
                            tokenizer:
                              type: object
                              description: |-
                                Per-model tokenizer override configuration.

                                Allows specifying a different tokenizer for a specific model,
                                useful when models require specialized tokenization.
                              properties:
                                name:
                                  type: string
                                  description: HuggingFace tokenizer identifier or local filesystem path.
                              required:
                              - name
                          required:
                          - name
                        minItems: 1
                    required:
                    - items
                    x-kubernetes-preserve-unknown-fields: true
                  model:
                    description: Shorthand sibling for `models`. Accepts a string, list of strings, or ModelsAdvanced object.
                      Hoisted into `models` by the before-validator and not present after validation.
                    x-kubernetes-preserve-unknown-fields: true
                    type: object
                  endpoint:
                    type: object
                    description: Endpoint configuration for connecting to inference server(s). Includes URLs, API type, authentication,
                      timeout, and connection settings.
                    properties:
                      urls:
                        type: array
                        description: 'List of server URLs to benchmark. Requests distributed according to url_strategy. Example:
                          [''http://localhost:8000/v1/chat/completions'']'
                        items:
                          type: string
                        minItems: 1
                        x-kubernetes-preserve-unknown-fields: true
                      urlStrategy:
                        type: string
                        enum:
                        - round_robin
                        description: Strategy for distributing requests across multiple URLs. round_robin cycles through URLs
                          in order.
                      type:
                        type: string
                        enum:
                        - chat
                        - cohere_rankings
                        - completions
                        - responses
                        - chat_embeddings
                        - embeddings
                        - hf_tei_rankings
                        - huggingface_generate
                        - image_generation
                        - video_generation
                        - image_retrieval
                        - nim_embeddings
                        - nim_rankings
                        - solido_rag
                        - template
                        description: 'API endpoint type determining request/response format. chat: OpenAI chat completions,
                          completions: OpenAI completions, embeddings: vector embeddings, rankings: reranking, template: custom
                          format.'
                      path:
                        type: string
                        description: 'Override default endpoint path. Use for servers with non-standard API paths. Example:
                          ''/custom/v2/generate'''
                      apiKey:
                        type: string
                        description: 'API authentication key. Supports environment variable substitution: ${OPENAI_API_KEY}.
                          Can also use ${VAR:default} syntax for defaults.'
                      timeout:
                        type: number
                        description: Request timeout in seconds (0 = no timeout). Requests exceeding this duration are marked
                          as failed. Should exceed expected max response time.
                        default: 600.0
                        minimum: 0.0
                      readyCheckTimeout:
                        type: number
                        description: Seconds to wait for endpoint readiness before benchmarking (0 = skip). Probes every URL
                          x model name; see ready_check_mode for how the probe is performed.
                        default: 0.0
                        minimum: 0.0
                      readyCheckMode:
                        type: string
                        description: 'How ready_check_timeout probes the endpoint. ''models'': GET /v1/models and check data[].id
                          (cheap, matches PR #841 behavior; falls back to a plain base-URL GET if /v1/models returns 404).
                          ''inference'': POST a canned 1-token inference (strongest signal — proves weights are loaded and
                          a forward pass works). ''both'': run models first, then inference, on each URL.'
                        enum:
                        - models
                        - inference
                        - both
                        default: inference
                      readyCheckInterval:
                        type: number
                        description: Seconds between readiness probe attempts.
                        default: 5.0
                        exclusiveMinimum: true
                        minimum: 0.0
                      streaming:
                        type: boolean
                        description: Enable streaming (Server-Sent Events) responses. Required for accurate TTFT (time to
                          first token) measurement. Server must support streaming for this to work.
                        default: false
                      transport:
                        type: string
                        enum:
                        - http
                        - http2
                        description: HTTP transport protocol (http/https). Auto-detected from URL scheme if not specified.
                          Explicit setting overrides auto-detection.
                      connectionReuse:
                        type: string
                        description: 'HTTP connection management strategy. pooled: shared connection pool (fastest), never:
                          new connection per request (includes TCP overhead), sticky_sessions: dedicated connection per session.'
                        enum:
                        - pooled
                        - never
                        - sticky-user-sessions
                      useLegacyMaxTokens:
                        type: boolean
                        description: Use 'max_tokens' field instead of 'max_completion_tokens'. Enable for compatibility with
                          older OpenAI API versions.
                        default: false
                      useServerTokenCount:
                        type: boolean
                        description: Use server-reported token counts from response usage field. When true, trusts usage.prompt_tokens
                          and usage.completion_tokens. When false, counts tokens locally using configured tokenizer.
                        default: false
                      template:
                        type: object
                        description: |-
                          Configuration for custom template-based endpoints.

                          When endpoint type is "template", this configures how requests
                          are formatted and responses are parsed.
                        properties:
                          body:
                            type: string
                            description: 'Jinja2 template string for request body. Variables: {{ "{{" }}prompt{{ "}}" }}, {{ "{{" }}max_tokens{{ "}}" }},
                              {{ "{{" }}model{{ "}}" }}, {{ "{{" }}messages{{ "}}" }}, etc.'
                          responseField:
                            type: string
                            description: 'JSON path to extract response text from API response. Use dot notation for nested
                              fields: ''choices.0.message.content''.'
                            default: text
                        required:
                        - body
                      headers:
                        type: object
                        description: Custom HTTP headers to include in all requests. Useful for authentication, tracing, or
                          routing. Values support environment variable substitution.
                        additionalProperties:
                          type: string
                      extra:
                        type: object
                        description: 'Additional fields to include in request body. Merged into every request. Common fields:
                          temperature, top_p, top_k, stop.'
                        additionalProperties: true
                      downloadVideoContent:
                        type: boolean
                        description: For video generation endpoints, download the video content after generation completes.
                          Adds a content download step to the async polling flow.
                        default: false
                      requestContentType:
                        type: string
                        description: Content type for HTTP request body serialization.
                        enum:
                        - application/json
                        - multipart/form-data
                    required:
                    - urls
                  datasets:
                    type: array
                    description: Named dataset configurations. Each entry must have a unique 'name' (e.g. 'main', 'eval').
                      Phases reference datasets by name (`phase.dataset = '<name>'`); when omitted, the FIRST dataset in the
                      list is used. Singular `dataset:` shorthand at the BenchmarkConfig top level is normalized to a one-entry
                      list with name='default'.
                    items:
                      x-kubernetes-preserve-unknown-fields: true
                    minItems: 1
                  dataset:
                    description: Shorthand sibling for `datasets`. Accepts a single dataset config (dict). Hoisted into `datasets`
                      as a one-entry list with name='default' by the before-validator and not present after validation.
                    x-kubernetes-preserve-unknown-fields: true
                    type: object
                  phases:
                    type: array
                    description: 'Ordered benchmark phases. Each entry must have a unique ''name'' (e.g. ''warmup'', ''profiling'').
                      Order in the list IS the execution order; the first phase runs first. Single-config shorthand ({''type'':
                      ''concurrency'', ...}) is normalized to a list of one. Top-level ''warmup:''/''profiling:'' shorthand
                      is normalized to a [warmup, profiling] list pre-validation.'
                    items:
                      x-kubernetes-preserve-unknown-fields: true
                    minItems: 1
                  warmup:
                    description: Shorthand sibling for `phases`. Accepts a phase config dict; rolled into `phases` as the
                      warmup entry by the before-validator and not present after validation. Mutually exclusive with `phases`;
                      requires `profiling` alongside it.
                    x-kubernetes-preserve-unknown-fields: true
                    type: object
                  profiling:
                    description: Shorthand sibling for `phases`. Accepts a phase config dict; rolled into `phases` as the
                      profiling entry by the before-validator and not present after validation. Mutually exclusive with `phases`.
                    x-kubernetes-preserve-unknown-fields: true
                    type: object
                  artifacts:
                    type: object
                    description: Artifacts configuration for benchmark output. Controls output directory and export formats.
                    properties:
                      dir:
                        type: string
                        description: Output directory for all benchmark artifacts. Created if it doesn't exist.
                        default: artifacts
                      prefix:
                        type: string
                        description: 'Filename prefix for all exported files. Example: ''my_run'' produces ''my_run_summary.json'',
                          ''my_run_records.jsonl''.'
                        default: aiperf
                      summary:
                        x-kubernetes-preserve-unknown-fields: true
                        description: 'Summary export formats. Options: json, yaml. Set to false to disable.'
                      records:
                        x-kubernetes-preserve-unknown-fields: true
                        description: 'Per-request records export formats. Options: jsonl, csv. Set to false to disable.'
                      raw:
                        type: boolean
                        description: Export raw request/response payloads as JSONL.
                        default: false
                      trace:
                        type: boolean
                        description: Export HTTP trace data for debugging.
                        default: false
                      perChunkData:
                        type: boolean
                        description: Include per-chunk list data (e.g., inter_chunk_latency arrays) in per-record exports.
                          These arrays contain one timing value per SSE chunk and can be very large for long responses.
                        default: false
                      sliceDuration:
                        type: number
                        description: 'Time slice duration in seconds for trend analysis (must be > 0). Divides benchmark into
                          windows for per-window statistics. Supports: 30, ''30s'', ''5m'', ''2h''.'
                      showTraceTiming:
                        type: boolean
                        description: 'Display HTTP trace timing metrics in console output. Shows detailed timing breakdown:
                          blocked, DNS, connecting, sending, waiting (TTFB), receiving, and total duration.'
                        default: false
                      cliCommand:
                        type: string
                        description: CLI command used to run the benchmark. Populated automatically when running via CLI.
                      benchmarkId:
                        type: string
                        description: Unique identifier for this benchmark run, used to correlate artifacts across export formats.
                          Auto-generated if absent.
                      userFiles:
                        type: array
                        description: User-defined templated files materialized into the run directory before the benchmark
                          begins. See docs/kubernetes/user-files.md.
                        items:
                          type: object
                          description: |-
                            One user-declared output file rendered into the run directory before benchmark start.

                            Path is relative to the run directory; subdirectories are allowed; absolute
                            paths and any segment equal to '..' are rejected. Content is rendered with
                            jinja2 against a documented context (variables: + system-injected names);
                            see docs/kubernetes/user-files.md.
                          properties:
                            path:
                              type: string
                              description: Output path relative to the run directory. Subdirectories allowed. Absolute paths
                                and any segment equal to '..' are rejected.
                            format:
                              type: string
                              enum:
                              - json
                              - yaml
                              - text
                              description: 'Serialization format. If omitted: ''text'' when content is a string, ''json''
                                otherwise.'
                            content:
                              type: object
                              x-kubernetes-preserve-unknown-fields: true
                              description: Templated value. Structured (dict/list/scalar) for json/yaml; string for text.
                                Jinja2 expressions in any string leaf are rendered with the user_files context.
                          required:
                          - path
                          - content
                  slos:
                    type: object
                    additionalProperties:
                      type: number
                    description: SLO (Service Level Objectives) configuration as a generic dict. Maps metric names to threshold
                      values. A request is counted as good only if it meets ALL specified thresholds.
                  tokenizer:
                    type: object
                    description: |-
                      Tokenizer configuration for token counting and prompt generation.

                      AIPerf uses a HuggingFace tokenizer for accurate token counting,
                      which is essential for ISL/OSL enforcement and metrics calculation.
                    properties:
                      name:
                        type: string
                        description: 'HuggingFace tokenizer identifier, local filesystem path, or `builtin` for a zero-network-access
                          tokenizer backed by tiktoken (o200k_base encoding). Should match the model''s tokenizer for accurate
                          token counts. Example: ''meta-llama/Llama-3.1-8B-Instruct'''
                      revision:
                        type: string
                        description: 'Model revision to use: branch name, tag, or commit hash. Use for version pinning to
                          ensure reproducibility.'
                        default: main
                      trustRemoteCode:
                        type: boolean
                        description: Allow execution of custom tokenizer code from the repository. Required for some models
                          but poses security risk. Only enable for trusted sources.
                        default: false
                      resolvedNames:
                        type: object
                        additionalProperties:
                          type: string
                        description: Pre-resolved tokenizer names from alias resolution. Set at runtime by the CLI or WorkerGroupManager
                          after tokenizer validation. Not serialized to JSON/YAML.
                  gpuTelemetry:
                    type: object
                    description: 'GPU telemetry configuration for DCGM metrics collection. Collects GPU metrics (power, utilization,
                      temperature) from DCGM endpoints. Enabled by default. Set enabled: false to disable.'
                    properties:
                      enabled:
                        type: boolean
                        description: Enable GPU telemetry collection. Set to false to disable.
                        default: true
                      urls:
                        type: array
                        description: 'DCGM exporter endpoint URLs. Example: http://localhost:9400/metrics'
                        items:
                          type: string
                      metricsFile:
                        type: string
                        description: Path to CSV file with pre-recorded GPU metrics. Alternative to live DCGM collection.
                    x-kubernetes-preserve-unknown-fields: true
                  serverMetrics:
                    type: object
                    description: 'Server metrics configuration for Prometheus scraping. Collects operational metrics (queue
                      depth, KV cache, batch sizes) from inference server Prometheus endpoints. Enabled by default. Set enabled:
                      false to disable.'
                    properties:
                      enabled:
                        type: boolean
                        description: Enable Prometheus metrics scraping. Set to false to disable.
                        default: true
                      urls:
                        type: array
                        description: Prometheus metrics endpoint URLs to scrape. Typically the /metrics endpoint on inference
                          servers.
                        items:
                          type: string
                      formats:
                        type: array
                        description: 'Export formats for scraped metrics. Options: json, csv, parquet, jsonl.'
                        items:
                          type: string
                          description: |-
                            Format options for server metrics export.

                            Controls which output files are generated for server metrics data.
                            Default selection is JSON + CSV (JSONL excluded to avoid large files).
                          enum:
                          - json
                          - csv
                          - jsonl
                          - parquet
                      discovery:
                        type: object
                        description: Auto-discovery of Prometheus endpoints in Kubernetes. Discovers pods via Dynamo labels,
                          Prometheus annotations, or custom label selectors.
                        properties:
                          mode:
                            type: string
                            description: 'Discovery mode: ''auto'' detects environment and tries K8s if in-cluster, ''kubernetes''
                              forces K8s API discovery, ''disabled'' uses only explicit URLs.'
                            enum:
                            - auto
                            - kubernetes
                            - disabled
                          labelSelector:
                            type: string
                            description: 'Kubernetes label selector for discovery. Example: ''app=vllm,env=prod''. Applied
                              in addition to built-in Dynamo and Prometheus discovery.'
                          namespace:
                            type: string
                            description: Kubernetes namespace to search. If not specified, searches all namespaces.
                    x-kubernetes-preserve-unknown-fields: true
                  runtime:
                    type: object
                    description: Runtime configuration for worker processes and inter-process communication.
                    properties:
                      ui:
                        type: string
                        enum:
                        - dashboard
                        - none
                        - simple
                        description: 'User interface mode. dashboard: rich interactive UI, simple: text progress, none: silent
                          operation.'
                      workers:
                        type: integer
                        minimum: 1
                        description: Maximum worker processes. null = auto-detect based on CPU cores.
                      recordProcessors:
                        type: integer
                        minimum: 1
                        description: Number of parallel record processors. null = auto-detect based on CPU cores.
                      serviceRunType:
                        type: string
                        enum:
                        - kubernetes
                        - multiprocessing
                        description: 'Type of service run. multiprocessing: local multi-process (default), kubernetes: distributed
                          across pods.'
                      communication:
                        x-kubernetes-preserve-unknown-fields: true
                        description: Inter-process communication configuration. Defaults to IPC for single-machine operation.
                      apiPort:
                        type: integer
                        minimum: 1
                        maximum: 65535
                        description: AIPerf API server port. Enables HTTP and WebSocket endpoints for real-time metrics and
                          control.
                      apiHost:
                        type: string
                        description: AIPerf API server host. Requires api_port to be set.
                      datasetApiBaseUrl:
                        type: string
                        description: Base URL for dataset API endpoints in Kubernetes mode. Set by the runner to allow worker
                          pods to download datasets.
                      workersPerPod:
                        type: integer
                        minimum: 1
                        maximum: 100
                        description: Number of worker service containers per Kubernetes worker pod.
                      recordProcessorsPerPod:
                        type: integer
                        minimum: 1
                        maximum: 100
                        description: Number of record processor service containers per Kubernetes worker pod.
                      workersMin:
                        type: integer
                        minimum: 1
                        description: Minimum number of worker processes.
                  logging:
                    type: object
                    description: Logging configuration for verbosity and debug settings.
                    properties:
                      level:
                        type: string
                        description: 'Global logging verbosity level. trace: most verbose, error: least verbose.'
                        enum:
                        - TRACE
                        - DEBUG
                        - INFO
                        - NOTICE
                        - WARNING
                        - SUCCESS
                        - ERROR
                        - CRITICAL
                  metrics:
                    type: object
                    description: Metrics aggregation configuration for benchmark summaries.
                    properties:
                      listMetricAggregation:
                        type: string
                        description: Aggregation mode for list-valued metrics in benchmark summaries.
                        enum:
                        - exact
                        - tdigest
                  accuracy:
                    type: object
                    description: |-
                      Configuration for accuracy benchmarking mode.

                      When benchmark is set, enables accuracy evaluation alongside
                      performance profiling using standard benchmarks (MMLU, AIME, etc.).
                    properties:
                      benchmark:
                        type: string
                        enum:
                        - mmlu
                        - aime
                        - hellaswag
                        - bigbench
                        - aime24
                        - aime25
                        - math_500
                        - gpqa_diamond
                        - lcb_codegeneration
                        description: Accuracy benchmark to run (e.g., mmlu, aime, hellaswag). When set, enables accuracy benchmarking
                          mode alongside performance profiling.
                      tasks:
                        type: array
                        items:
                          type: string
                        description: Specific tasks or subtasks within the benchmark to evaluate (e.g., specific MMLU subjects).
                          If not set, all tasks are included.
                      nShots:
                        type: integer
                        description: Number of few-shot examples to include in the prompt. 0 means zero-shot evaluation. Maximum
                          8.
                        default: 0
                        minimum: 0
                        maximum: 8
                      enableCot:
                        type: boolean
                        description: Enable chain-of-thought prompting for accuracy evaluation. Adds reasoning instructions
                          to the prompt.
                        default: false
                      grader:
                        type: string
                        enum:
                        - exact_match
                        - math
                        - multiple_choice
                        - code_execution
                        description: Override the default grader for the selected benchmark (e.g., exact_match, math, multiple_choice,
                          code_execution). If not set, uses the benchmark's default grader.
                      systemPrompt:
                        type: string
                        description: Custom system prompt to use for accuracy evaluation. Overrides any benchmark-specific
                          system prompt.
                      verbose:
                        type: boolean
                        description: Enable verbose output for accuracy evaluation, showing per-problem grading details.
                        default: false
                  randomSeed:
                    type: integer
                    description: Global random seed for reproducibility. Can be overridden per-dataset. If not set, uses system
                      entropy.
                  variables:
                    type: object
                    description: User-defined values exposed to Jinja2 in `{{ "{{" }} ... {{ "}}" }}` expressions during config load. Preserved
                      on the resolved config so run-time renderers (e.g. `artifacts.user_files`) can resolve them again at
                      run time.
                    additionalProperties: true
                  sweep:
                    x-kubernetes-preserve-unknown-fields: true
                    description: Sweep configuration for parameter exploration. Supports grid (Cartesian product), scenarios
                      (hand-picked), and sequential (ordered) sweep strategies.
                  multiRun:
                    type: object
                    description: Multi-run benchmarking configuration for statistical reporting. When num_runs > 1, executes
                      multiple runs and computes aggregate statistics.
                    properties:
                      numRuns:
                        type: integer
                        description: Number of profile runs to execute for confidence reporting. When 1, runs a single benchmark.
                          When >1, computes aggregate statistics across runs.
                        default: 1
                        minimum: 1
                        maximum: 10
                      cooldownSeconds:
                        type: number
                        description: Cooldown duration in seconds between profile runs. Allows the system to stabilize between
                          runs.
                        default: 0.0
                        minimum: 0
                      confidenceLevel:
                        type: number
                        description: 'Confidence level for computing confidence intervals (0-1). Common values: 0.90 (90%%),
                          0.95 (95%%), 0.99 (99%%).'
                        default: 0.95
                        exclusiveMinimum: true
                        minimum: 0
                        exclusiveMaximum: true
                        maximum: 1
                      setConsistentSeed:
                        type: boolean
                        description: Auto-set random seed if not specified for workload consistency.
                        default: true
                      disableWarmupAfterFirst:
                        type: boolean
                        description: Disable warmup for runs after the first. When true, only the first run includes warmup
                          for steady-state measurement.
                        default: true
                      convergenceMetric:
                        type: string
                        description: Target metric name for adaptive convergence stopping. When set, enables adaptive mode
                          that stops early once the metric stabilizes.
                      convergenceStat:
                        type: string
                        description: Statistic to evaluate for convergence when using ci_width or cv mode.
                        enum:
                        - avg
                        - p50
                        - p90
                        - p95
                        - p99
                        - min
                        - max
                      convergenceThreshold:
                        type: number
                        description: Threshold for convergence detection.
                        default: 0.1
                        exclusiveMinimum: true
                        minimum: 0
                        exclusiveMaximum: true
                        maximum: 1
                      convergenceMode:
                        type: string
                        description: Statistical method for convergence detection (ci_width, cv, distribution).
                        enum:
                        - ci_width
                        - cv
                        - distribution
                      parameterSweepCooldownSeconds:
                        type: number
                        description: Cooldown duration in seconds between sweep variations. Honored by MultiRunOrchestrator
                          when iterating plan.configs (one per sweep variation). Distinct from cooldown_seconds, which gates
                          trial-to-trial cooldown within a single variation. Surfaced via --parameter-sweep-cooldown-seconds.
                        default: 0.0
                        minimum: 0
                      parameterSweepSameSeed:
                        type: boolean
                        description: If true, every sweep variation reuses the same random seed (correlated comparisons).
                          If false (default), each variation derives a unique seed `base_seed + variation.index`. Surfaced
                          via --parameter-sweep-same-seed; the cross-field validator on AIPerfConfig requires --random-seed
                          when true.
                        default: false
                      mode:
                        type: string
                        description: 'Iteration order for sweep + multi-trial composition. ''repeated'' (default): trials
                          outer, variations inner - artifact tree is <base>/profile_runs/trial_NNNN/<variation>/profile_runs/run_NNNN/.
                          ''independent'': variations outer, trials inner - artifact tree is <base>/<variation>/profile_runs/run_NNNN/.
                          Both modes produce the same total runs and same sweep_aggregate/ output. Adaptive convergence (--convergence-metric)
                          is incompatible with ''repeated''.'
                        enum:
                        - independent
                        - repeated
                required:
                - models
                - endpoint
                - datasets
                - phases
              resourceMode:
                type: string
                description: CPU/memory resource mode for controller and worker pods. 'burstable' (default) sets requests
                  only, no limits (Burstable QoS) so the controller can grow beyond the request during aggregation without
                  being OOM-killed. 'guaranteed' applies requests==limits (Guaranteed QoS). 'none' omits CPU/memory requests
                  and limits as an escape hatch.
                enum:
                - guaranteed
                - burstable
                - none
                default: burstable
              # -- Deployment fields (camelCase, K8s convention) ---------------
              connectionsPerWorker:
                type: integer
                description: Maximum concurrent connections each worker handles. 100 keeps the asyncio event loop responsive
                  while amortizing per-process overhead.
                default: 100
                minimum: 1
              timeoutSeconds:
                type: number
                description: Job timeout in seconds (0 = no timeout)
                default: 0
                minimum: 0
              ttlSecondsAfterFinished:
                type: integer
                description: TTL after finished (seconds)
                default: 300
              resultsTtlDays:
                type: integer
                minimum: 1
                maximum: 365
                description: Days to retain result files before cleanup
              cancel:
                type: boolean
                description: Set to true to cancel the job
                default: false
              skipEndpointCheck:
                type: boolean
                description: Skip the operator-side endpoint reachability probe before deploying
                default: false
              podTemplate:
                type: object
                description: Pod template configuration
                properties:
                  env:
                    type: array
                    description: Environment variables in K8s EnvVar format
                    items:
                      type: object
                      additionalProperties: true
                  volumes:
                    type: array
                    description: Pod volumes in K8s Volume format
                    items:
                      type: object
                      additionalProperties: true
                  volumeMounts:
                    type: array
                    description: Volume mounts in K8s VolumeMount format
                    items:
                      type: object
                      additionalProperties: true
                  nodeSelector:
                    type: object
                    description: Node selector labels
                    additionalProperties:
                      type: string
                  tolerations:
                    type: array
                    description: Pod tolerations for scheduling on tainted nodes
                    items:
                      type: object
                      additionalProperties: true
                  affinity:
                    type: object
                    description: Pod affinity/anti-affinity rules in K8s Affinity format (nodeAffinity, podAffinity, podAntiAffinity).
                      Use to co-locate or separate bench pods from other workloads (e.g. keep benchmark pods off inference
                      nodes via podAntiAffinity topologyKey=kubernetes.io/hostname).
                    additionalProperties: true
                  annotations:
                    type: object
                    description: Additional pod annotations
                    additionalProperties:
                      type: string
                  labels:
                    type: object
                    description: Additional pod labels
                    additionalProperties:
                      type: string
                  imagePullSecrets:
                    type: array
                    description: Image pull secret names
                    items:
                      type: string
                  serviceAccountName:
                    type: string
                    description: Service account name for pods
                  containerSecurityContext:
                    type: object
                    description: Container securityContext overrides (merged into each container spec)
                    additionalProperties: true
                  shareProcessNamespace:
                    type: boolean
                    description: When true, all containers in the pod share a single PID namespace. Enables kubectl exec cross-container
                      kills for chaos tests. Keep false in production.
                    default: false
                  priorityClassName:
                    type: string
                    description: Native K8s PriorityClass name for the pod. Distinct from scheduling.priorityClass, which
                      is the Kueue WorkloadPriorityClass. Use this to preempt lower-priority pods via the default scheduler.
                  runtimeClassName:
                    type: string
                    description: K8s RuntimeClass name (e.g. 'nvidia' for GPU runtime, 'kata' for sandboxed runtime).
                  schedulerName:
                    type: string
                    description: Name of the scheduler to dispatch the pod to (e.g. a custom GPU topology scheduler). Omit
                      to use the default scheduler.
                  topologySpreadConstraints:
                    type: array
                    description: Pod TopologySpreadConstraints in K8s format. Useful to spread worker pods evenly across zones/nodes
                      independent of affinity rules.
                    items:
                      type: object
                      additionalProperties: true
                  hostAliases:
                    type: array
                    description: 'Entries appended to the pod''s /etc/hosts (K8s HostAlias format: {ip, hostnames: [...]}).
                      Useful when benchmarking endpoints that aren''t in cluster DNS.'
                    items:
                      type: object
                      additionalProperties: true
                  dnsPolicy:
                    type: string
                    enum:
                    - ClusterFirst
                    - ClusterFirstWithHostNet
                    - Default
                    - None
                    description: Pod DNS policy. Defaults to 'ClusterFirst' (K8s default); set 'None' to supply dns_config
                      entirely.
                  dnsConfig:
                    type: object
                    description: 'Pod DNS config (K8s PodDNSConfig format: nameservers, searches, options). Typically paired
                      with dns_policy=''None''.'
                    additionalProperties: true
                  terminationGracePeriodSeconds:
                    type: integer
                    minimum: 0
                    description: Seconds the kubelet waits for the pod to terminate gracefully before SIGKILL. Defaults to
                      30 in K8s; raise for long-running benchmarks that need extra time to flush artifacts.
                  podSecurityContext:
                    type: object
                    description: 'Pod-level securityContext (PodSecurityContext format: fsGroup, runAsUser, runAsNonRoot,
                      supplementalGroups, sysctls, etc.). Distinct from container_security_context which applies per-container.'
                    additionalProperties: true
                  initContainers:
                    type: array
                    description: InitContainers that run to completion before the main containers start. Full K8s Container
                      format. Useful for sysctl tweaks (e.g. bumping ip_local_port_range), model pre-fetch, or permission
                      fixups.
                    items:
                      type: object
                      additionalProperties: true
                  extraPodSpec:
                    type: object
                    description: 'Escape hatch: raw PodSpec keys merged into the rendered pod spec last (keys here override
                      typed fields above). Use for K8s PodSpec fields not yet modeled here (e.g. schedulingGates, resourceClaims,
                      overhead). Typed fields are preferred when available because preflight checks, env merging, and securityContext
                      merging only apply to typed fields.'
                    additionalProperties: true
              scheduling:
                type: object
