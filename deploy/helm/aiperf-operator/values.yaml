# image is the operator container image configuration
image:
  # image.repository is the container registry and image name
  repository: nvcr.io/nvidia/aiperf
  # image.tag is the image tag (defaults to Chart.AppVersion)
  tag: ""
  # image.pullPolicy is the Kubernetes image pull policy
  pullPolicy: IfNotPresent

# imagePullSecrets is a list of pull secrets for private registries
imagePullSecrets: []
# - name: my-registry-secret

# nameOverride overrides the chart name used in resource names
nameOverride: ""
# fullnameOverride overrides the full release name used in resource names
fullnameOverride: ""

# operator contains deployment settings for the operator container
operator:
  # operator.replicas is the number of operator replicas (only 1 recommended for leader election)
  replicas: 1

  # operator.resources is the CPU and memory requests and limits
  # No limits set (burstable) so the operator can use as much memory/CPU
  # as the node provides — needed for high-concurrency runs with many jobs.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi

  # operator.podAnnotations is a map of additional pod annotations
  podAnnotations: {}

  # operator.nodeSelector is a map of node selector labels
  nodeSelector: {}

  # operator.tolerations is a list of pod tolerations
  tolerations:
    - key: dedicated
      operator: Equal
      value: user-workload
      effect: NoSchedule
    - key: dedicated
      operator: Equal
      value: user-workload
      effect: NoExecute
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: kubernetes.io/arch
      operator: Exists
      effect: NoSchedule

  # operator.affinity is the pod affinity configuration
  affinity: {}

  # operator.env contains environment variables for the operator process
  env:
    # monitorInterval is the interval between status checks (seconds)
    monitorInterval: "10.0"
    # monitorInitialDelay is the initial delay before first status check (seconds)
    monitorInitialDelay: "5.0"
    # jobTimeoutSeconds is the job timeout in seconds (0 = no timeout)
    jobTimeoutSeconds: "0"
    # podRestartThreshold is the pod restart count before emitting warning events
    podRestartThreshold: "3"
    # resultsTtlDays is the results TTL in days
    resultsTtlDays: "30"
    # resultsMaxRetries is the max retries for fetching results from controller
    resultsMaxRetries: "5"
    # resultsRetryDelay is the delay between result fetch retries (seconds)
    resultsRetryDelay: "2.0"
    # endpointCheckTimeout is the endpoint health check timeout (seconds)
    endpointCheckTimeout: "10.0"
    # resultsCompressOnDisk stores downloaded result files as zstd on the PVC
    resultsCompressOnDisk: "true"

# resultsServer is the sidecar container that serves stored results via HTTP
resultsServer:
  # resultsServer.port is the HTTP port for the results API
  port: 8081

  # resultsServer.resources is the CPU and memory requests and limits
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# rbac controls RBAC resource creation.
# A ClusterRole is required because the operator:
# - Watches AIPerfJob CRDs across all namespaces (or a configured subset)
# - Creates/manages leader election Leases in kube-system
# - Creates JobSets, ConfigMaps, Roles, and RoleBindings in benchmark namespaces
# To restrict scope, deploy with --namespace flag to limit the watch to a single namespace.
rbac:
  # rbac.create specifies whether to create ClusterRole and ClusterRoleBinding
  create: true

# storage is the results storage configuration
storage:
  # storage.enabled enables persistent storage for benchmark results
  enabled: false

  # storage.size is the PVC storage size
  size: 1Ti

  # storage.storageClassName is the storage class (empty = cluster default)
  storageClassName: ""

  # storage.mountPath is the mount path in the operator pod
  mountPath: "/data"

  # storage.accessMode is the PVC access mode.
  # ReadWriteOnce (RWO) limits the PVC to a single node — this prevents running
  # multiple operator replicas on different nodes. Use ReadWriteMany (RWX) with
  # a shared filesystem (e.g. NFS, CephFS, EFS) for multi-replica HA deployments.
  accessMode: "ReadWriteOnce"

# serviceAccount controls service account creation
serviceAccount:
  # serviceAccount.create specifies whether to create a service account
  create: true

  # serviceAccount.name is the service account name (auto-generated if empty)
  name: ""

  # serviceAccount.annotations is a map of service account annotations
  annotations: {}

# benchmarkNamespace controls the namespace for running AIPerfJob workloads
benchmarkNamespace:
  # benchmarkNamespace.create specifies whether to create the benchmark namespace
  create: true
  # benchmarkNamespace.name is the benchmark namespace name
  name: "aiperf-benchmarks"

# kueue configures Kueue gang-scheduling integration
kueue:
  # kueue.defaultQueueName is the default Kueue LocalQueue name.
  # When set, the benchmark namespace is annotated with
  # kueue.x-k8s.io/default-queue-name so all AIPerf jobs are automatically
  # admitted through Kueue even without an explicit --queue-name flag.
  # Leave empty to auto-fill from kueue.localQueueName when createQueues=true.
  defaultQueueName: ""

  # kueue.createQueues toggles chart-managed provisioning of the Kueue
  # ResourceFlavor, ClusterQueue, and LocalQueue. Users who install Kueue
  # separately can flip this on to let the chart seed the queue pair instead
  # of applying it out-of-band (matches the dev/kube.py `install-kueue`
  # manifest). Off by default so charts render cleanly on clusters without
  # Kueue CRDs; also gated on the kueue.x-k8s.io/v1beta1 API being present.
  createQueues: false
  # kueue.flavorName is the ResourceFlavor name when createQueues=true.
  flavorName: "default-flavor"
  # kueue.clusterQueueName is the ClusterQueue name when createQueues=true.
  clusterQueueName: "aiperf-cluster-queue"
  # kueue.localQueueName is the LocalQueue name created in the benchmark
  # namespace when createQueues=true; also used as defaultQueueName when that
  # value is left empty.
  localQueueName: "aiperf-local-queue"
  # kueue.resources sets the ClusterQueue nominalQuota per covered resource.
  # Defaults are generous so benchmark jobs admit without tuning on dev
  # clusters; production users should size these to their fleet.
  resources:
    cpu: "1000"
    memory: "4Ti"
    # gpu (nvidia.com/gpu) is optional — set to e.g. "64" to include it in
    # the covered resources list. Empty / unset skips GPU quota entirely.
    gpu: ""

# ingress exposes the results-server HTTP API outside the cluster via an Ingress.
# Disabled by default: results are reachable via ClusterIP + port-forward.
ingress:
  # ingress.enabled toggles Ingress resource creation
  enabled: false
  # ingress.className is the IngressClass name (e.g. "nginx"); empty uses the cluster default
  className: ""
  # ingress.annotations is a map of annotations applied to the Ingress
  annotations: {}
  # ingress.hosts is the list of host rules; each entry has a host and a paths list.
  # Paths default to backend port = resultsServer.port (8081). Override per path with portNumber.
  hosts:
    - host: aiperf.example.com
      paths:
        - path: /
          pathType: Prefix
  # ingress.tls is the optional TLS configuration (list of {hosts, secretName})
  tls: []

# networkPolicy restricts pod traffic to/from the operator.
# Disabled by default: no restrictions applied.
networkPolicy:
  # networkPolicy.enabled toggles NetworkPolicy resource creation
  enabled: false
  # networkPolicy.allowedNamespaces is a list of namespace names allowed to reach the operator
  # (in addition to the benchmark namespace) and reachable by the operator's egress
  allowedNamespaces: []
  # networkPolicy.allowedIngressCIDRs is a CIDR allow-list for external scrapers
  # (e.g. Prometheus, ingress controllers) reaching health (8080) and results ports
  allowedIngressCIDRs: []

# serviceMonitor creates a Prometheus Operator ServiceMonitor that scrapes the
# operator's /metrics endpoint on the health port (8080). Requires the
# monitoring.coreos.com/v1 CRDs from the Prometheus Operator / kube-prometheus-stack.
# Disabled by default because many clusters do not ship the Prometheus Operator CRDs.
serviceMonitor:
  # serviceMonitor.enabled toggles ServiceMonitor resource creation
  enabled: false
  # serviceMonitor.interval is the Prometheus scrape interval
  interval: 30s
  # serviceMonitor.scrapeTimeout is the Prometheus scrape timeout
  scrapeTimeout: 10s
  # serviceMonitor.honorLabels preserves labels from the scraped target on collision
  honorLabels: true
  # serviceMonitor.scheme is the URI scheme Prometheus uses to scrape ("http" or "https")
  scheme: "http"
  # serviceMonitor.labels is a map of extra labels for Prometheus discovery
  # (e.g. release: prometheus-stack to match a kube-prometheus-stack selector)
  labels: {}
  # serviceMonitor.tlsConfig is an optional Prometheus TLS config block (insecureSkipVerify, caFile, etc.)
  tlsConfig: {}
  # serviceMonitor.bearerTokenSecret is an optional SecretKeySelector {name, key} for bearer-token auth
  bearerTokenSecret: {}

# defaults contains default settings for AIPerfJob resources
defaults:
  # defaults.image is the default container image for benchmark jobs
  image: "nvcr.io/nvidian/dynamo-dev/aiperf:k8s-arm64-20260422-211121-b385c5c61"

  # defaults.imagePullPolicy is the default image pull policy for benchmark jobs
  imagePullPolicy: "IfNotPresent"
