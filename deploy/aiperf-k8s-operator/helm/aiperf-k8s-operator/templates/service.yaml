apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.api.serviceName }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aiperf-k8s-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
  - name: http
    port: {{ .Values.api.port }}
    targetPort: http
