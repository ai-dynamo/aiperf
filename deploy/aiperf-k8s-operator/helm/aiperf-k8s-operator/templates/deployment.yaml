apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: aiperf-k8s-operator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: aiperf-k8s-operator}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
      - name: operator
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args: ["aiperf-k8s-operator"]
        ports: [{name: http, containerPort: 8080}]
