apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aiperfsweeps.aiperf.nvidia.com
spec:
  group: aiperf.nvidia.com
  scope: Namespaced
  names:
    plural: aiperfsweeps
    singular: aiperfsweep
    kind: AIPerfSweep
    shortNames: [aps]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Completed
      type: integer
      jsonPath: .status.completedRuns
    - name: Failed
      type: integer
      jsonPath: .status.failedRuns
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [sweepEnvelope]
            x-kubernetes-validations:
            - rule: self == oldSelf
              message: AIPerfSweep spec is immutable
            properties:
              sweepEnvelope:
                type: object
                x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            properties:
              phase:
                type: string
                enum: [Pending, Running, Completed, Failed]
              sweepId:
                type: string
              childRuns:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    jobRef:
                      type: string
                    phase:
                      type: string
              completedRuns:
                type: integer
                minimum: 0
              failedRuns:
                type: integer
                minimum: 0
              aggregateReady:
                type: boolean
            x-kubernetes-validations:
            - rule: "!has(oldSelf.sweepId) || self.sweepId == oldSelf.sweepId"
              message: status sweepId is immutable
            - rule: "!has(oldSelf.completedRuns) || self.completedRuns >= oldSelf.completedRuns"
              message: completedRuns cannot decrease
