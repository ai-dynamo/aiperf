schemaVersion: "2.0"
randomSeed: 42
benchmark:
  model: meta-llama/Llama-3.1-8B-Instruct
  endpoint:
    type: dynosim
  transport:
    type: dynosim_online
    topology: single
    router_mode: round_robin
    workers: 1
    engine:
      block_size: 16
      max_num_batched_tokens: 8192
      enable_prefix_caching: true
    sla:
      ttft_ms: 500
      itl_ms: 20
    artifacts:
      report_json: dynamo_report.json
      per_request_jsonl: dynamo_per_request.jsonl
  dataset:
    type: file
    path: /tmp/aiperf-parity/production_trace.jsonl
    format: mooncake_trace
    sampling: sequential
  phases:
    type: concurrency
    requests: 1000
    concurrency: 64
  artifacts:
    dir: /tmp/aiperf-parity/dynosim_online
    summary: [json]
    records: [jsonl]
