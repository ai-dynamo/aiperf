[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aiperf-k8s-operator"
version = "0.1.0"
description = "Isolated Kubernetes control plane for native AIPerf"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "jsonschema>=4.23,<5",
  "kopf>=1.42.0",
  "kubernetes_asyncio>=32.0,<33.0",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-xdist>=3.6,<4",
]

[project.scripts]
aiperf-k8s-operator = "aiperf_k8s_operator.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aiperf_k8s_operator"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
