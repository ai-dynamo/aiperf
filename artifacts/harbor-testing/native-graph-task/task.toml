schema_version = "1.1"
artifacts = ["/var/task/environment-ready.txt"]

[task]
name = "example/ng-code-review"

[native_graph]
profile = "native_graph"
program = "graph.json"
model_bindings = "model-bindings.toml"
adapter_manifest = "adapters.toml"

[environment]
workdir = "/work"
network = "no-network"

[agent]
timeout_sec = 60
network = "no-network"

[verifier]
environment_mode = "separate"
timeout_sec = 30
