ci:
  skip:
    - add-license
    - generate-cli-docs
    - generate-env-vars-docs
    - generate-plugin-artifacts
    - validate-plugin-schemas
    - test-imports
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0  # Use the latest stable version
    hooks:
      - id: check-ast
      - id: debug-statements
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-json
        exclude: ^\.devcontainer/devcontainer\.json$
      - id: check-toml
      - id: check-yaml
        args: ['--allow-multiple-documents']
        exclude: ^deploy/helm/.*/templates/.*\.yaml$
      - id: check-shebang-scripts-are-executable
      - id: end-of-file-fixer
        types_or: [cuda, proto, textproto, python]
      - id: mixed-line-ending
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: requirements-txt-fixer
      - id: trailing-whitespace
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.4
    hooks:
    - id: codespell
      additional_dependencies: [tomli]
      args: ["--toml", "pyproject.toml"]
      exclude: (?x)^(.*stemmer.*|.*stop_words.*|^CHANGELOG.md$|.*shakespeare.txt|ATTRIBUTIONS-.*\.md)
  - repo: local
    hooks:
      - id: add-license
        name: add-license
        entry: make add-copyright
        language: python
        require_serial: true
      - id: generate-cli-docs
        name: generate-cli-docs
        entry: make generate-cli-docs
        language: python
        files: (\.py$|^tools/generate_cli_docs\.py$)
        pass_filenames: false
        args: []
      - id: generate-env-vars-docs
        name: generate-env-vars-docs
        entry: make generate-env-vars-docs
        language: python
        files: ^(src/aiperf/common/environment\.py|tools/generate_env_vars_docs\.py)$
        pass_filenames: false
        args: []
      - id: generate-plugin-artifacts
        name: generate-plugin-artifacts
        entry: make generate-all-plugin-files
        language: python
        files: (\.py$|^src/aiperf/plugin/(categories|plugins)\.yaml|src/aiperf/plugin/schema/schemas\.py|tools/generate_plugin_artifacts\.py)$
        pass_filenames: false
        args: []
      - id: validate-plugin-schemas
        name: validate-plugin-schemas
        entry: make validate-plugin-schemas
        language: python
        files: (\.py$|^src/aiperf/plugin/(categories|plugins)\.yaml|tools/generate_plugin_artifacts\.py)$
        pass_filenames: false
        args: []
      - id: validate-template-metadata
        name: validate-template-metadata
        entry: make validate-template-metadata
        language: python
        files: (^src/aiperf/config/templates/.*\.yaml$|^src/aiperf/config/templates\.py$|^tools/validate_template_metadata\.py$)
        pass_filenames: false
        args: []
      - id: validate-config-examples
        name: validate-config-examples
        entry: make validate-config-examples
        language: python
        files: (^src/aiperf/config/.*\.py$|^src/aiperf/config/templates/.*\.yaml$|^tools/validate_config_examples\.py$)
        pass_filenames: false
        args: []
      - id: generate-config-schema
        name: generate-config-schema
        entry: make generate-config-schema
        language: python
        files: (^src/aiperf/config/.*\.py$|^tools/generate_config_schema\.py$)
        pass_filenames: false
        args: []
      - id: generate-crd
        name: generate-crd
        entry: make generate-crd
        language: python
        files: (^src/aiperf/config/.*\.py$|^src/aiperf/kubernetes/enums\.py$|^tools/generate_crd\.py$|^pyproject\.toml$)
        pass_filenames: false
        args: []
      - id: helm-lint
        name: helm-lint
        entry: helm lint deploy/helm/aiperf-operator
        language: system
        files: ^deploy/helm/
        pass_filenames: false
      - id: test-imports
        name: test-imports
        entry: make test-imports
        language: python
        files: ^(src/aiperf|tests)/.*\.py$
        pass_filenames: false
        args: []
      - id: check-ergonomics
        name: check-ergonomics
        description: >-
          LLM-ergonomics checks — file size, function size, nesting depth,
          module-level mutable state, duplicate class names, wide positional
          signatures, Pydantic field count, stdlib-json ban, isinstance
          tuple-form. Pre-existing violations are grandfathered via
          tools/ergonomics_baseline.json.
        entry: python tools/check_ergonomics.py
        language: python
        files: ^src/aiperf/.*\.py$
        pass_filenames: true
      - id: check-ruff-baseline-drift
        name: check-ruff-baseline-drift
        description: >-
          Run ruff for the LLM-ergonomics rules (PLR0915, PLR0912, C901,
          TID251) and filter through the out-of-band baseline at
          tools/ruff_baseline.json (keyed on (rule, file, function-name) —
          no # noqa comments or per-file ignores). New violations fail the
          commit; pre-existing grandfathered ones don't.
        entry: python tools/ruff_baselined.py
        language: system
        files: ^src/aiperf/.*\.py$
        pass_filenames: true
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
