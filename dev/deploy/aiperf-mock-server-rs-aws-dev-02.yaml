apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiperf-mock-server-rs
  namespace: acasagrande-aiperf-bench
  labels:
    app: aiperf-mock-server-rs
spec:
  replicas: 8
  selector:
    matchLabels:
      app: aiperf-mock-server-rs
  template:
    metadata:
      labels:
        app: aiperf-mock-server-rs
    spec:
      imagePullSecrets:
      - name: nvcr-imagepullsecret
      nodeSelector:
        kubernetes.io/arch: amd64
        nodeGroup: customer-cpu
      containers:
      - name: mock-server-rs
        image: nvcr.io/nvidian/dynamo-dev/aiperf-mock-server-rs:k8s-amd64-20260319-rs-local
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: MOCK_SERVER_PORT
          value: "8000"
        - name: MOCK_SERVER_FAST
          value: "1"
        - name: MOCK_SERVER_TTFT_MS
          value: "20"
        - name: MOCK_SERVER_ITL_MS
          value: "5"
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "4000m"
            memory: "8Gi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aiperf-mock-server-rs
  namespace: acasagrande-aiperf-bench
  labels:
    app: aiperf-mock-server-rs
spec:
  type: ClusterIP
  selector:
    app: aiperf-mock-server-rs
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
