# Replicates the bhamm-aiperf-250k topology from the 2026-03-22 postmortem
# (qwen06b-60x: 4 frontends + 60 vLLM workers on GB200 arm64).
# Image bumped from 0.9.0 (snapshot) to 1.0.2 (latest public 2026-04-21).
#
# Deploy:
#   kubectl create namespace dynamo-server
#   kubectl -n dynamo-server create secret generic hf-token-secret \
#     --from-literal=HF_TOKEN=$HF_TOKEN
#   kubectl apply -f dev/deploy/dynamo-server-qwen-60x.yaml
#
# The Dynamo platform helm install must have grove enabled (the snapshot
# pods are PodClique-managed). Drop `--set grove.enabled=false` from the
# install command in docs/kubernetes/getting-started.md.
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: qwen06b-60x
  namespace: acasagrande-aiperf-bench
spec:
  services:
    Frontend:
      componentType: frontend
      replicas: 4
      extraPodSpec:
        nodeSelector:
          kubernetes.io/arch: arm64
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    nvidia.com/dynamo-component: Frontend
                    nvidia.com/dynamo-graph-deployment-name: qwen06b-60x
                topologyKey: kubernetes.io/hostname
        tolerations:
          - key: dedicated
            operator: Equal
            value: user-workload
            effect: NoSchedule
          - key: dedicated
            operator: Equal
            value: user-workload
            effect: NoExecute
          - key: kubernetes.io/arch
            operator: Exists
            effect: NoSchedule
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        volumes:
          - name: shared-memory
            emptyDir:
              medium: Memory
              sizeLimit: 8Gi
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.2
          command: ["python3"]
          args: ["-m", "dynamo.frontend"]
          volumeMounts:
            - name: shared-memory
              mountPath: /dev/shm
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: HF_HOME
              value: /tmp/hf-cache
            - name: NATS_SERVER
              value: nats://dynamo-platform-nats.acasagrande-aiperf-bench.svc.cluster.local:4222
          envFrom:
            - secretRef:
                name: hf-token-secret
                optional: true
    VllmWorker:
      componentType: worker
      replicas: 60
      resources:
        limits:
          gpu: "1"
      extraPodSpec:
        nodeSelector:
          kubernetes.io/arch: arm64
          nvidia.com/gpu.product: NVIDIA-GB200
        tolerations:
          - key: dedicated
            operator: Equal
            value: user-workload
            effect: NoSchedule
          - key: dedicated
            operator: Equal
            value: user-workload
            effect: NoExecute
          - key: kubernetes.io/arch
            operator: Exists
            effect: NoSchedule
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        volumes:
          - name: shared-memory
            emptyDir:
              medium: Memory
              sizeLimit: 8Gi
          - name: model-cache
            persistentVolumeClaim:
              claimName: shared-model-cache
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.2
          workingDir: /workspace/examples/backends/vllm
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command: ["python3"]
          args:
            - "-m"
            - "dynamo.vllm"
            - "--model"
            - "Qwen/Qwen3-0.6B"
            - "--enforce-eager"
            - "--tensor-parallel-size"
            - "1"
            - "--max-model-len"
            - "8192"
            - "--gpu-memory-utilization"
            - "0.90"
          volumeMounts:
            - name: shared-memory
              mountPath: /dev/shm
            - name: model-cache
              mountPath: /model-cache
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: DYN_SYSTEM_PORT
              value: "9090"
            - name: DYN_SYSTEM_USE_ENDPOINT_HEALTH_STATUS
              value: '["generate"]'
            - name: HF_HOME
              value: /model-cache
            - name: HF_HUB_OFFLINE
              value: "0"
            - name: NATS_SERVER
              value: nats://dynamo-platform-nats.acasagrande-aiperf-bench.svc.cluster.local:4222
          envFrom:
            - secretRef:
                name: hf-token-secret
                optional: false
