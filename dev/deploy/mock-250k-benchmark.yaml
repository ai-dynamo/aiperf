# 250k concurrency benchmark against mock server
apiVersion: aiperf.nvidia.com/v1alpha1
kind: AIPerfJob
metadata:
  name: mock-250k-clean-4
  namespace: acasagrande-aiperf-bench
spec:
  image: nvcr.io/nvidian/dynamo-dev/aiperf:k8s-arm64-20260328-164302-4fe6e4f0a
  resourceMode: burstable
  connectionsPerWorker: 1000
  timeoutSeconds: 0
  ttlSecondsAfterFinished: 600
  benchmark:
    models:
      items:
        - name: mock
    endpoint:
      type: chat
      streaming: true
      urls:
        - http://aiperf-mock-server.acasagrande-aiperf-bench.svc.cluster.local:8000/v1/chat/completions
    tokenizer:
      name: builtin
    datasets:
      main:
        type: synthetic
        prompts:
          isl:
            mean: 550
          osl: 2500
    phases:
      profiling:
        type: concurrency
        concurrency: 250000
        requests: 750000
    runtime:
      ui: none
      workers: 500
      workers_per_pod: 5
      record_processors_per_pod: 5
    artifacts:
      records:
        - jsonl
    gpu_telemetry:
      enabled: false
    server_metrics:
      enabled: false
  keepFailedPods: true
  podTemplate:
    imagePullSecrets:
      - nvcr-imagepullsecret
    nodeSelector:
      kubernetes.io/arch: arm64
      nodeGroup: customer-gpu
    tolerations:
      - key: dedicated
        operator: Equal
        value: user-workload
        effect: NoSchedule
      - key: dedicated
        operator: Equal
        value: user-workload
        effect: NoExecute
      - key: nvidia.com/gpu
        operator: Equal
        value: present
        effect: NoSchedule
      - key: team
        operator: Equal
        value: nemo-ci
        effect: NoSchedule
      - key: kubernetes.io/arch
        operator: Equal
        value: arm64
        effect: NoSchedule
    env:
      - name: HF_HOME
        value: /app/.cache/huggingface
      - name: HF_HUB_DISABLE_SSL_VERIFICATION
        value: "1"
      - name: AIPERF_K8S_SYSTEM_CONTROLLER_MEMORY
        value: 8Gi
      - name: AIPERF_K8S_API_MEMORY
        value: 32Gi
      - name: AIPERF_K8S_API_CPU
        value: 1000m
      - name: AIPERF_K8S_RECORD_PROCESSOR_CPU_REQUEST
        value: "1"
      - name: AIPERF_SERVICE_EVENT_LOOP_HEALTH_STACKTRACE
        value: "true"
