# AIPerfJob template for ramping concurrency against the qwen06b-60x
# Dynamo deployment in acasagrande-aiperf-bench. The ramp driver
# (scripts/ramp_benchmark.py) rewrites metadata.name and rewrites the
# 'profiling' phase's concurrency/requests per step. Schema mirrors
# big-sweep-b-v01-t0 (proven against this operator + cluster).
apiVersion: aiperf.nvidia.com/v1alpha1
kind: AIPerfJob
metadata:
  name: qwen-10k
  namespace: acasagrande-aiperf-bench
  labels:
    owner: ajc
    purpose: qwen-dynamo-ramp
spec:
  cancel: false
  image: nvcr.io/nvidian/dynamo-dev/aiperf:k8s-multi-20260428-040132-36de956b4
  connectionsPerWorker: 1000
  keepFailedPods: false
  benchmark:
    artifacts:
      dir: artifacts
      perChunkData: false
      prefix: aiperf
      raw: false
      records: false
      showTraceTiming: false
      summary:
        - json
      trace: false
      userFiles: []
    datasets:
      - name: main
        type: synthetic
        entries: 100
        sampling: sequential
        turnDelayRatio: 1
        prompts:
          batchSize: 1
          isl:
            mean: 512
            stddev: 0
          osl:
            mean: 512
            stddev: 0
    endpoint:
      type: chat
      streaming: true
      timeout: 600
      readyCheckMode: inference
      readyCheckInterval: 5
      readyCheckTimeout: 0
      connectionReuse: pooled
      urlStrategy: round_robin
      useLegacyMaxTokens: false
      useServerTokenCount: false
      downloadVideoContent: false
      extra: {}
      headers: {}
      urls:
        - http://qwen06b-60x-frontend.acasagrande-aiperf-bench.svc.cluster.local:8000/v1/chat/completions
    gpuTelemetry:
      enabled: false
      urls: []
    logging:
      level: INFO
    metrics:
      listMetricAggregation: exact
    models:
      strategy: round_robin
      items:
        - name: Qwen/Qwen3-0.6B
    phases:
      - name: profiling
        type: concurrency
        concurrency: 10000
        requests: 30000
        excludeFromResults: false
        seamless: false
    randomSeed: 42
    runtime:
      ui: none
      workers: 30
      workersPerPod: 10
      recordProcessorsPerPod: 2
    serverMetrics:
      enabled: true
      formats:
        - json
        - csv
      urls: []
      discovery:
        mode: auto
    tokenizer:
      name: builtin
      revision: main
      trustRemoteCode: false
    variables: {}
  podTemplate:
    imagePullSecrets:
      - nvcr-imagepullsecret
    nodeSelector:
      kubernetes.io/arch: arm64
      nodeGroup: customer-gpu
    shareProcessNamespace: false
    tolerations:
      - { key: dedicated,         operator: Equal,  value: user-workload, effect: NoSchedule }
      - { key: dedicated,         operator: Equal,  value: user-workload, effect: NoExecute }
      - { key: nvidia.com/gpu,    operator: Equal,  value: present,        effect: NoSchedule }
      - { key: team,              operator: Equal,  value: nemo-ci,        effect: NoSchedule }
      - { key: kubernetes.io/arch, operator: Equal, value: arm64,          effect: NoSchedule }
    env:
      - { name: HF_HOME,                            value: /app/.cache/huggingface }
      - { name: HF_HUB_DISABLE_SSL_VERIFICATION,    value: "1" }
      - { name: AIPERF_K8S_SYSTEM_CONTROLLER_MEMORY, value: 8Gi }
      - { name: AIPERF_K8S_API_MEMORY,              value: 32Gi }
      - { name: AIPERF_K8S_API_CPU,                 value: "1000m" }
