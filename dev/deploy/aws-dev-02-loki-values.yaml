loki:
  enabled: true
  persistence:
    enabled: true
    size: 50Gi
    storageClassName: ebs
  nodeSelector:
    kubernetes.io/arch: amd64
    nodeGroup: customer-cpu
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

promtail:
  enabled: true
  tolerations:
    - operator: Exists

grafana:
  enabled: false
prometheus:
  enabled: false
fluent-bit:
  enabled: false
filebeat:
  enabled: false
logstash:
  enabled: false
