# Smoke test: 1 pod, 5 workers, 60s duration, concurrency 10, streaming mock
apiVersion: aiperf.nvidia.com/v1alpha1
kind: AIPerfJob
metadata:
  name: smoke-test
  namespace: acasagrande-aiperf-bench
spec:
  benchmark:
    models:
      items:
        - name: mock

    endpoint:
      urls:
        - http://aiperf-mock-server.acasagrande-aiperf-bench.svc.cluster.local:8000/v1/chat/completions
      streaming: true

    datasets:
      main:
        type: synthetic
        prompts:
          isl:
            mean: 128

    phases:
      profiling:
        type: concurrency
        requests: 150
        concurrency: 10

    tokenizer:
      name: builtin

    runtime:
      ui: none
      workers: 5
      workers_per_pod: 5
      record_processors_per_pod: 1

    gpu_telemetry:
      enabled: false

    server_metrics:
      enabled: false

    artifacts:
      records:
        - jsonl

  image: nvcr.io/nvidian/dynamo-dev/aiperf:k8s-arm64-20260422-211121-b385c5c61
  connectionsPerWorker: 10
  resourceMode: none
  ttlSecondsAfterFinished: 3600

  podTemplate:
    imagePullSecrets:
      - nvcr-imagepullsecret
    nodeSelector:
      kubernetes.io/arch: arm64
      nodeGroup: customer-gpu
    tolerations:
      - key: dedicated
        operator: Equal
        value: user-workload
        effect: NoSchedule
      - key: dedicated
        operator: Equal
        value: user-workload
        effect: NoExecute
      - key: nvidia.com/gpu
        operator: Equal
        value: present
        effect: NoSchedule
      - key: team
        operator: Equal
        value: nemo-ci
        effect: NoSchedule
      - key: kubernetes.io/arch
        operator: Equal
        value: arm64
        effect: NoSchedule
    env:
      - name: HF_HOME
        value: /app/.cache/huggingface
      - name: HF_HUB_DISABLE_SSL_VERIFICATION
        value: "1"
      - name: AIPERF_LOG_LEVEL
        value: info
