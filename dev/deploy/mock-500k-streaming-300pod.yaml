# 500k concurrency streaming benchmark against mock server with 300 worker pods
apiVersion: aiperf.nvidia.com/v1alpha1
kind: AIPerfJob
metadata:
  name: mock-500k-ramp
  namespace: acasagrande-aiperf-bench
spec:
  benchmark:
    models:
      items:
        - name: mock

    endpoint:
      urls:
        - http://aiperf-mock-server.acasagrande-aiperf-bench.svc.cluster.local:8000/v1/chat/completions
      streaming: true

    datasets:
      main:
        type: synthetic
        prompts:
          isl:
            mean: 550
          osl: 2500

    phases:
      profiling:
        type: concurrency
        requests: 1500000
        concurrency: 500000

    tokenizer:
      name: builtin

    runtime:
      ui: none
      workers: 1500
      workers_per_pod: 10
      record_processors_per_pod: 2

    gpu_telemetry:
      enabled: false

    server_metrics:
      enabled: false

    artifacts:
      records:
        - jsonl

  image: nvcr.io/nvidian/dynamo-dev/aiperf:k8s-arm64-20260422-004743-17d5d810a
  connectionsPerWorker: 1000
  resourceMode: burstable
  ttlSecondsAfterFinished: 3600
  keepFailedPods: true

  podTemplate:
    imagePullSecrets:
      - nvcr-imagepullsecret
    nodeSelector:
      kubernetes.io/arch: arm64
      nodeGroup: customer-gpu
    tolerations:
      - key: dedicated
        operator: Equal
        value: user-workload
        effect: NoSchedule
      - key: dedicated
        operator: Equal
        value: user-workload
        effect: NoExecute
      - key: nvidia.com/gpu
        operator: Equal
        value: present
        effect: NoSchedule
      - key: team
        operator: Equal
        value: nemo-ci
        effect: NoSchedule
      - key: kubernetes.io/arch
        operator: Equal
        value: arm64
        effect: NoSchedule
    env:
      - name: HF_HOME
        value: /app/.cache/huggingface
      - name: HF_HUB_DISABLE_SSL_VERIFICATION
        value: "1"
      - name: AIPERF_K8S_SYSTEM_CONTROLLER_MEMORY
        value: 8Gi
      - name: AIPERF_K8S_API_MEMORY
        value: 32Gi
      - name: AIPERF_K8S_API_CPU
        value: "1000m"
      # Grace window for heartbeat watchdog: 5s interval × 12 = 60s before a
      # service is flagged dead. At Kubernetes scale the batch scanner in
      # base_service_manager._monitor_heartbeats can fall behind during startup
      # bursts and flag ~100+ healthy WGMs simultaneously; 60s gives startup
      # thrash and transient controller-overload stalls room to recover before
      # declaring death. Revisit once per-service deadline tracking lands.
      - name: AIPERF_SERVICE_HEARTBEAT_MISSED_THRESHOLD
        value: "12"
