apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiperf-mock-server
  namespace: acasagrande-aiperf-bench
  labels:
    app: aiperf-mock-server
spec:
  replicas: 16
  selector:
    matchLabels:
      app: aiperf-mock-server
  template:
    metadata:
      labels:
        app: aiperf-mock-server
    spec:
      imagePullSecrets:
      - name: nvcr-imagepullsecret
      nodeSelector:
        kubernetes.io/arch: amd64
        nodeGroup: customer-cpu
      containers:
      - name: mock-server
        image: nvcr.io/nvidian/dynamo-dev/aiperf-mock-server:py-amd64-20260501-140726-28affb7e0
        args:
          - --host=0.0.0.0
          - --port=8000
          - --workers=8
          - --ttft=5000
          - --itl=10
          - --no-tokenizer
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            cpu: "2000m"
            memory: "2Gi"
          limits:
            cpu: "8000m"
            memory: "4Gi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aiperf-mock-server
  namespace: acasagrande-aiperf-bench
  labels:
    app: aiperf-mock-server
spec:
  type: ClusterIP
  selector:
    app: aiperf-mock-server
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
