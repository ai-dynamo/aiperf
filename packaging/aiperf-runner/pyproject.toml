[build-system]
requires = ["blake3>=1,<2", "hatchling>=1.24.2", "orjson>=3.10,<4", "packaging>=23.2"]
build-backend = "hatchling.build"

[project]
name = "aiperf-runner"
version = "0.11.0"
description = "Platform companion containing AIPerf's native single-run executor"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "NVIDIA Inc.", email = "sw-dl-dynamo@nvidia.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
]

[tool.hatch.build.targets.wheel]
# This distribution intentionally contains no Python package. The custom hook
# inserts exactly one prebuilt native executable into the wheel scripts scheme.
bypass-selection = true

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
