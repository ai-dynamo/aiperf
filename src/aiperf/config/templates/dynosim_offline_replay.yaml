# @template
# title: DynoSim Offline Trace Replay
# description: Deterministic in-process Dynamo co-simulation of a trace — no server, no sockets.
# category: Advanced
# tags: dynosim, offline, replay, mooncake, simulation
# difficulty: advanced
# features: dynosim transport, offline replay, mooncake format
#
# DynoSim Offline Replay
# ======================
# The `dynosim_offline` transport runs one in-process Dynamo mocker co-simulation
# of the trace — no inference server, no HTTP, no sockets. The clock rides on the
# transport id: `dynosim_offline` fast-forwards a virtual clock through the
# discrete-event engine for deterministic, byte-exact-with-native results, while
# `dynosim_online` drives the same engine in real wall-clock time for
# live-throughput measurement.
#
# All engine/topology/router/SLA knobs are authored inline on the `transport`
# block (mirroring Dynamo's `MockEngineArgs`/router), the same way `dataset` and
# `phases` carry their own fields. The trace file and concurrency/rate axes reuse
# the SAME `dataset` and `phases` surface as an online run — switching a benchmark
# between a real server and the simulator is just the `transport` block.
#
# Requires an `aiperf-runner` built with the `dynosim` Cargo feature.
# Run: aiperf profile --config dynosim_offline_replay.yaml
#
# Sample data: reuses the bundled `data/production_trace.jsonl`. Replace `path:`
# with your captured mooncake trace for real workloads.

schemaVersion: "2.0"

randomSeed: 42

benchmark:
  model: meta-llama/Llama-3.1-8B-Instruct

  # OFFLINE opens no sockets: the endpoint defaults to the first-class `dynosim`
  # dialect (materialization only), so no URL is required or dialed. The runner
  # reports its endpoint as `dynamo://offline`.
  endpoint:
    type: dynosim

  transport:
    # dynosim_offline = deterministic virtual clock (byte-exact-with-native).
    # dynosim_online  = same engine under a real wall clock (live throughput).
    # Fields are authored inline (like `dataset`/`phases`), not under a nested
    # `config:` envelope.
    type: dynosim_offline
    topology: single          # single | aggregated | disaggregated
    routerMode: round_robin   # round_robin | kv
    workers: 1
    # Free-form MockEngineArgs object, passed through verbatim to Dynamo.
    engine:
      block_size: 16
      max_num_batched_tokens: 8192
      enable_prefix_caching: true
    # Optional goodput thresholds (omit to disable).
    sla:
      ttftMs: 500
      itlMs: 20
    # Canonical Dynamo artifacts, relative to the run artifact target.
    artifacts:
      reportJson: dynamo_report.json
      perRequestJsonl: dynamo_per_request.jsonl

  dataset:
    type: file
    path: ./data/production_trace.jsonl
    format: mooncake_trace
    sampling: sequential

  # Concurrency replay (the byte-exact-with-native path). `fixed_schedule` is also
  # supported when you want to honor the trace's recorded timestamps instead.
  phases:
    type: concurrency
    requests: 1000
    concurrency: 64

  runtime:
    workers: 1

  artifacts:
    dir: ./artifacts/dynosim_offline
    summary: [json]
    records: [jsonl]
