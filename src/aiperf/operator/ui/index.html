<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIPerf Kubernetes Operator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Resolve theme synchronously to avoid FOUC on reload -->
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('aiperfTheme') || 'auto';
        var resolved = stored;
        if (stored === 'auto') {
          resolved = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = resolved;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>

  <link rel="stylesheet" href="./style.css">

  <!-- Import map: resolve browser runtime modules from the dashboard origin. -->
  <script type="importmap">
  {
    "imports": {
      "preact": "./vendor/preact.mjs",
      "preact/hooks": "./vendor/preact-hooks.mjs",
      "htm/preact": "./vendor/htm-preact.mjs",
      "@preact/signals": "./vendor/signals.mjs",
      "js-yaml": "./vendor/js-yaml.mjs"
    }
  }
  </script>

  <!-- Chart.js 4.5.1 (MIT), served locally with the token-bearing application. -->
  <script src="./vendor/chart.umd.min.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
