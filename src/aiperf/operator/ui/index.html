<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07070a">
  <title>AIPERF // WORKBENCH</title>

  <!-- Fonts: IBM Plex Mono (technical / display / all caps labels)
       + IBM Plex Sans (body copy). Host Grotesk kept as a legacy fallback. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700&family=Host+Grotesk:ital,wght@0,300..800;1,300..800&display=swap">
  <link rel="stylesheet" href="./style.css">

  <!-- Import map: resolve bare specifiers via CDN -->
  <script type="importmap">
  {
    "imports": {
      "preact": "https://esm.sh/preact@10",
      "preact/hooks": "https://esm.sh/preact@10/hooks",
      "htm/preact": "https://esm.sh/htm@3/preact",
      "@preact/signals": "https://esm.sh/@preact/signals@1?deps=preact@10"
    }
  }
  </script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>

  <!-- Phosphor icon font (loads stylesheet for .ph glyphs) -->
  <script src="https://unpkg.com/@phosphor-icons/web@2"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
