# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: aiperf.docs.buildwithfern.com/aiperf
    custom-domain: https://docs.nvidia.com/aiperf
    multi-source: true
title: NVIDIA AIPerf Documentation
products:
  - display-name: AIPerf
    slug: /
    path: ./versions/v0.11.0.yml
    versions:
      - display-name: Latest (v0.11.0)
        path: ./versions/v0.11.0.yml
        slug: latest
        availability: stable
      - display-name: dev
        path: ./versions/dev.yml
        slug: dev
        availability: beta
      - display-name: v0.11.0
        path: ./versions/v0.11.0.yml
        slug: v0.11.0
        availability: stable
      - display-name: v0.9.0
        path: ./versions/v0.9.0.yml
        slug: v0.9.0
        availability: stable
      - display-name: v0.8.0
        path: ./versions/v0.8.0.yml
        slug: v0.8.0
        availability: stable
      - display-name: v0.7.0
        path: ./versions/v0.7.0.yml
        slug: v0.7.0
        availability: stable
global-theme: nvidia
redirects:
  - source: "/aiperf/index.html"
    destination: "/aiperf/"
  - source: "/aiperf/dev/index.html"
    destination: "/aiperf/dev/"
navbar-links:
  - type: github
    value: https://github.com/ai-dynamo/aiperf
footer: ./components/CustomFooter.tsx
layout:
  searchbar-placement: header
  page-width: 1376px
  sidebar-width: 248px
  content-width: 812px
  tabs-placement: header
  hide-feedback: true
metadata:
  canonical-host: "docs.nvidia.com/aiperf"
experimental:
  mdx-components:
    - ./components
colors:
  accentPrimary:
    dark: '#76B900'
    light: '#76B900'
  background:
    light: '#FFFFFF'
    dark: '#000000'
typography:
  bodyFont:
    name: NVIDIA
    paths:
      - path: ./assets/fonts/NVIDIASans.woff2
        style: normal
      - path: ./assets/fonts/NVIDIASans_Italic.woff2
        style: italic
  codeFont:
    name: RobotoMono
    paths:
      - path: ./assets/fonts/RobotoMono.woff2
theme:
  page-actions: toolbar
  footer-nav: minimal
logo:
  dark: ./assets/NVIDIA_dark.svg
  light: ./assets/NVIDIA_light.svg
  height: 20
  href: /
  right-text: Documentation
favicon: ./assets/NVIDIA_symbol.svg
js:
  - url: https://assets.adobedtm.com/5d4962a43b79/c1061d2c5e7b/launch-191c2462b890.min.js
    strategy: beforeInteractive
css:
  - ./main.css
