[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["crates/aiperf-runner/tests/fixtures/aiperf-test-static-extension"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# internal crates
loadgen-core = { path = "crates/loadgen-core" }
aiperf = { path = "crates/aiperf" }
aiperf-clock = { path = "crates/aiperf-clock" }
aiperf-content-server = { path = "crates/aiperf-content-server" }
aiperf-dataset = { path = "crates/aiperf-dataset" }
aiperf-endpoints = { path = "crates/aiperf-endpoints" }
aiperf-extensions = { path = "crates/aiperf-extensions" }
aiperf-metrics = { path = "crates/aiperf-metrics" }
aiperf-network-latency = { path = "crates/aiperf-network-latency" }
aiperf-server-metrics = { path = "crates/aiperf-server-metrics" }
aiperf-rng = { path = "crates/aiperf-rng" }
aiperf-transport-http = { path = "crates/aiperf-transport-http" }
aiperf-transport-grpc = { path = "crates/aiperf-transport-grpc" }

# external (shared versions)
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bitflags = "2"
blake3 = "1"
bytes = "1"
chrono = "0.4"
csv = "1"
futures = "0.3"
half = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
itoa = "1"
libc = "0.2"
libmimalloc-sys = { version = "=0.1.49", features = ["extended"] }
llm-tokenizer = "1.4.1"
percent-encoding = "2"
petgraph = "0.6"
parquet = { version = "58.3", default-features = false, features = ["json", "snap", "zstd"] }
rand = "0.9"
rand_distr = "0.5"
rand_pcg = "0.9"
rayon = "1"
regex = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallvec = { version = "1", features = ["serde"] }
tiktoken-rs = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.14.6", default-features = false, features = ["channel", "tls-ring", "tls-webpki-roots"] }
prost = "0.14.4"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
url = "2"

[profile.release]
lto = "fat"
codegen-units = 1
