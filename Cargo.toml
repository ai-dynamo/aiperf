[workspace]
resolver = "3"
# The 16 aiperf-* library crates were absorbed into `rust/aiperf`. The separate
# `aiperf-runner` executable was obliterated: `rust/cli` (binary `aiperf`) is now
# BOTH the entry point and the execution engine, re-execing itself (`aiperf
# --execute`) over the protocol-v2 stdio seam for each run/probe/cell.
members = [
    "rust/loadgen-core",
    "rust/runtime",
    "rust/cli",
    "rust/mock-server",
    "rust/e2e",
    # pyo3 cdylib compiled into the single interned `aiperf` wheel (aiperf._native);
    # the unified `aiperf` binary rides along as interned package data.
    "rust/pyext",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# internal crates
loadgen-core = { path = "rust/loadgen-core" }
aiperf-runtime = { path = "rust/runtime" }

# external (shared versions)
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bitflags = "2"
blake3 = "1"
bytes = "1"
chrono = "0.4"
csv = "1"
futures = "0.3"
half = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
itoa = "1"
libc = "0.2"
libmimalloc-sys = { version = "=0.1.49", features = ["extended"] }
llm-tokenizer = "1.4.1"
percent-encoding = "2"
petgraph = "0.6"
arrow = { version = "58.3", default-features = false }
parquet = { version = "58.3", default-features = false, features = ["arrow", "json", "snap", "zstd"] }
rand = "0.9"
rand_distr = "0.5"
rand_pcg = "0.9"
rayon = "1"
regex = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallvec = { version = "1", features = ["serde"] }
tiktoken-rs = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.14.6", default-features = false, features = ["channel", "tls-ring", "tls-webpki-roots"] }
prost = "0.14.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

[profile.release]
lto = "fat"
codegen-units = 1
