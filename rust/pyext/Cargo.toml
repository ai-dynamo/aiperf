# Minimal pyo3 extension module for the single interned `aiperf` wheel.
#
# maturin refuses to emit a `bindings = "bin"` binary alongside
# `[project.scripts]` (maturin #368), and the `aiperf` package must keep its
# `aiperf` console command. maturin also requires a real binding target. So this
# tiny cdylib is the wheel's compiled target (`aiperf._native`); # native `aiperf` binary rides along as interned package data
# (`aiperf/_bin/aiperf`) via `[tool.maturin] include` in the root
# pyproject.toml. It carries only build metadata for `aiperf --version`
# diagnostics — runner discovery does not import it.
[package]
name = "aiperf-pyext"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "pyo3 build-metadata module for the interned aiperf wheel (aiperf._native)."

[lib]
# The produced module basename must be `_native` so maturin lands it at
# `aiperf/_native.<abi>.so` (module-name = "aiperf._native" in pyproject.toml).
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# 0.23 is already resolved in the workspace lock (pulled by the dynosim deps), so
# this adds no new major version. `extension-module` means the cdylib is loaded
# into a host CPython and never links libpython itself.
pyo3 = { version = "0.23", features = ["extension-module"] }
