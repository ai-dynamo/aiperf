[package]
name = "aiperf-plugin-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
aiperf-core.workspace = true
aiperf-endpoint-sdk.workspace = true
aiperf-export-sdk.workspace = true
aiperf-plugin-api.workspace = true
aiperf-plugin-host.workspace = true
aiperf-plugin-sdk.workspace = true
aiperf-transport-sdk.workspace = true

[dev-dependencies]
# Task-7 allocator conformance tests need the provider (rlib) and shim.
aiperf-allocator-provider = { path = "../allocator-provider" }
aiperf-allocator-shim = { path = "../allocator-shim" }
# libmimalloc-sys as a dev-dep: its build script propagates
# cargo:rustc-link-search (the -L path) to integration tests, satisfying the
# #[link(name = "mimalloc", kind = "static")] attribute in allocator.rs.
# Cargo suppresses cargo:rustc-link-lib from dev-dep build scripts, which is
# why the #[link] attr emits the -lmimalloc flag directly.
aiperf-allocator-shim = { path = "../allocator-shim" }
# Blake3 is needed for the native_boundary tests: compute live digest of the
# minimal-plugin fixture to pass into AcquiredArtifact::acquire.
blake3.workspace = true
libmimalloc-sys.workspace = true
serde_json.workspace = true
tempfile.workspace = true
