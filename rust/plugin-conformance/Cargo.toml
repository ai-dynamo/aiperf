[package]
name = "aiperf-plugin-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
aiperf-core.workspace = true
aiperf-endpoint-sdk.workspace = true
aiperf-export-sdk.workspace = true
aiperf-plugin-api.workspace = true
aiperf-plugin-host.workspace = true
aiperf-plugin-sdk.workspace = true
aiperf-transport-sdk.workspace = true

[dev-dependencies]
# Task-7 allocator conformance tests need the provider (rlib) to satisfy
# the shim's extern "C" mi_* references at test-binary link time, and the
# shim itself to verify the GlobalAlloc implementation compiles correctly.
# libmimalloc-sys is listed explicitly because the provider rlib is not
# linked into the test binary (no Rust items from it are used in the tests);
# without it the shim's mi_* extern references are undefined at link time.
aiperf-allocator-provider = { path = "../allocator-provider" }
aiperf-allocator-shim = { path = "../allocator-shim" }
libmimalloc-sys.workspace = true
serde_json.workspace = true
tempfile.workspace = true
