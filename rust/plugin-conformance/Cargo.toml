[package]
name = "aiperf-plugin-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
aiperf-core.workspace = true
aiperf-endpoint-sdk.workspace = true
aiperf-export-sdk.workspace = true
aiperf-plugin-api.workspace = true
aiperf-plugin-host.workspace = true
aiperf-plugin-sdk.workspace = true
aiperf-transport-sdk.workspace = true
# Task-7: libmimalloc-sys must be a normal dep (not dev-dep) so that Cargo
# propagates cargo:rustc-link-lib=static=mimalloc from its build script into
# the test binary link command.  As a [dev-dependency], Cargo propagates the
# -L search path but silently drops the -l flag, leaving the shim's mi_*
# extern "C" references unsatisfied.  libmimalloc-sys has `links = "mimalloc"`
# so Cargo deduplicates the build script; no duplicate -lmimalloc results.
libmimalloc-sys.workspace = true

[dev-dependencies]
# Task-7 allocator conformance tests need the provider (rlib) and shim.
aiperf-allocator-provider = { path = "../allocator-provider" }
aiperf-allocator-shim = { path = "../allocator-shim" }
serde_json.workspace = true
tempfile.workspace = true
