# This crate lives inside the main workspace directory but intentionally opts
# out of workspace membership.  It is a standalone test fixture built by the
# allocator conformance suite's ensure_fixtures_built() function.
[workspace]

[package]
name = "allocator-candidate-plugin"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
name = "allocator_candidate_plugin"
crate-type = ["cdylib"]

[dependencies]
# The shim provides the GlobalAlloc impl; mi_* resolved from provider cdylib.
aiperf-allocator-shim = { path = "../../../allocator-shim" }
