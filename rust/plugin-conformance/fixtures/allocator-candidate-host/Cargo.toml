# This crate lives inside the main workspace directory but intentionally opts
# out of workspace membership.  It is a standalone test fixture built by the
# allocator conformance suite's ensure_fixtures_built() function.
[workspace]

[package]
name = "allocator-candidate-host"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[[bin]]
name = "allocator-candidate-host"
path = "src/main.rs"

[dependencies]
# The shim provides the GlobalAlloc impl; its mi_* extern "C" symbols are
# resolved at link time from the provider cdylib (via the build.rs below).
aiperf-allocator-shim = { path = "../../../allocator-shim" }
libloading = "0.8"
