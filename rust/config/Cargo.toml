[package]
name = "aiperf-config"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared typed Config-v2 model for AIPerf."

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
anyhow = "1"
aiperf-runtime = { path = "../runtime", default-features = false, features = ["engine", "cellular", "grpc"] }
