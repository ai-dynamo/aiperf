[package]
name = "aiperf-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust-native AIPerf load-generation runtime used by the subprocess runner."

[features]
default = ["parquet", "cellular", "grpc"]
# Hosts the v2 protocol / registry / execution layer (the ~75k-line engine
# modules under `src/engine/`). Only `aiperf-cli` opts in; `mock-server` and
# other direct library consumers build without it, so the gated module and its
# dependency surface stay out of their builds.
engine = []
streaming = ["engine", "dep:chacha20poly1305", "dep:zeroize"]
streaming-s3 = ["streaming", "dep:aws-config", "dep:aws-sdk-s3"]
# Direct raw-HTTP Graph-IR throughput microbenchmark. It intentionally bypasses
# the product sink so it measures the low-level path, and is excluded from the
# default library API.
graph-transport-bench = []
# Native gRPC transport (Clock-injected Tonic HTTP/2 channels): the
# `transport::grpc` prepared-sink stack, the engine's `grpc`/`grpc_execution`
# placement path, the `grpc` runner transport factory, and the KServe OIP v2 /
# Riva ASR-TTS-NLP wire codecs. gRPC is *just another transport* over the same
# `RequestSink`/`RunnerTransportFactory` seam as `http`/`dynosim`, so it composes
# through one gated [`GrpcExtension`] in the built-in registry list. Links the
# heavy `tonic` framework; a lite/HTTP-only runner drops it (the `grpc` transport
# and Riva/KServe-gRPC endpoints then fail closed at selection). `prost` stays
# unconditional (OTLP/W&B/graph-vocab also use it). HTTP remains the mandatory
# base — the side channels (server-metrics, GPU telemetry, dataset fetch,
# control plane) depend on it — so there is no symmetric `http` off switch.
grpc = ["dep:tonic"]
# Native WebSocket transport plumbing. The direct dependency is rustls-only
# with WebPKI roots; feature-off builds retain config parsing and fail closed
# when execution cannot find a registered WebSocket transport factory.
websocket = ["dep:tokio-tungstenite"]
# Server-metrics Parquet export sink + public-dataset `.parquet` reader. Links
# `arrow` + `parquet` (~2.6 MiB of `.text`, plus zstd/snap). A lite/online-only
# runner (e.g. a lightweight nightly wheel) builds without it: the exporter is
# unregistered and `.parquet` dataset inputs are rejected with a clear error.
parquet = ["dep:arrow", "dep:parquet"]
# Pulls the Dynamo mocker from the pinned ai-dynamo/dynamo git dep below (no
# sibling checkout). Its runtime integration stays out of default builds.
dynosim = ["dep:dynamo-mocker"]
# Forward the mocker's optional capabilities. The mocker now always builds with
# the runtime router and ZMQ publisher, so `dynamo-router-runtime` /
# `dynamo-zmq-events` are retained as no-op aliases of `dynosim` (the runner's
# capability enum still names them). `dynamo-full` is the complete gate.
dynamo-router-runtime = ["dynosim"]
dynamo-zmq-events = ["dynosim"]
dynamo-kvbm-offload = ["dynosim", "dynamo-mocker/kvbm-offload"]
dynamo-aic-forward-pass = ["dynosim", "dep:aiconfigurator-core", "dep:pyo3", "dep:dynamo-kv-router"]
dynamo-profile = ["dynosim", "dynamo-mocker/profile"]
dynamo-full = [
    "dynamo-router-runtime",
    "dynamo-zmq-events",
    "dynamo-kvbm-offload",
    "dynamo-aic-forward-pass",
    "dynamo-profile",
]
# Exact official-harness builds align the enabled Dynamo capability set. The
# embedding executable, not this library, owns process-global allocator choice.
dynamo-parity = ["dynamo-full"]
# Cellular cross-host cell transport, carried over the `velo` messaging framework.
# Gates all velo-dependent code (the CellClient/ControllerTransport impls + the
# cell connection seam). In the default build; a lean `--no-default-features` build
# drops it, keeps `cells=1` byte-unchanged, and fails closed on `cells>1`.
cellular = ["dep:velo", "dep:zstd"]

[lib]
name = "aiperf_runtime"
path = "src/lib.rs"

[dependencies]
# External deps consolidated from the 16 absorbed aiperf-* library crates.
anyhow.workspace = true
arrow = { workspace = true, optional = true }
async-trait.workspace = true
axum.workspace = true
aws-config = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
base64.workspace = true
bitflags.workspace = true
blake3.workspace = true
bytes.workspace = true
chrono.workspace = true
chacha20poly1305 = { workspace = true, optional = true }
csv.workspace = true
futures.workspace = true
half.workspace = true
image.workspace = true
itoa.workspace = true
libc.workspace = true
dynamo-tokenizers.workspace = true
dynamo-renderer.workspace = true
tokenizers.workspace = true
hf-hub.workspace = true
parquet = { workspace = true, optional = true }
percent-encoding.workspace = true
petgraph.workspace = true
prost.workspace = true
rand.workspace = true
ed25519-dalek.workspace = true
rcgen.workspace = true
rand_distr.workspace = true
rand_pcg.workspace = true
rayon.workspace = true
regex.workspace = true
rustc-hash.workspace = true
# tiktoken-rs 0.9's `CoreBPE::new` takes `rustc_hash 1.x` `FxHashMap`s; the
# workspace `rustc-hash` is 2.x, whose `FxHashMap` is a distinct type. This
# renamed pin bridges to the exact 1.x version tiktoken-rs links so the native
# `tiktoken.model` loader can hand it maps without a hasher-type mismatch.
tiktoken-rustc-hash = { package = "rustc-hash", version = "1.1" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
serde_yaml = "0.9"
sha2.workspace = true
smallvec.workspace = true
tiktoken-rs.workspace = true
tokio.workspace = true
tokio-tungstenite = { workspace = true, optional = true }
tokio-util.workspace = true
toml.workspace = true
velo = { git = "https://github.com/ajcasagrande/velo.git", branch = "feat/connect-by-endpoint", default-features = false, optional = true }
tonic = { workspace = true, optional = true }
tracing.workspace = true
uuid.workspace = true
url.workspace = true
zeroize = { workspace = true, optional = true }
# External deps not pinned in the workspace: carried inline with the same
# version/features as the absorbed crates declared them.
flate2 = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1.10", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jmespath = "0.4"
libloading = "0.8"
minijinja = { version = "2.21", features = ["json"] }
nvml-wrapper = { version = "0.12.1", default-features = false }
nvml-wrapper-sys = "0.9.1"
num-bigint = "0.4.8"
# Self-describing binary serde format for wire-shipped cellular records-shard
# partitions and heartbeats: preserves NaN/`+inf` sentinels (JSON cannot) and
# round-trips the untagged `MetricValue` boundary encoding (postcard, being
# non-self-describing, cannot).
rmp-serde = "1"
rustls = "0.23"
socket2 = "0.5"
tempfile = "3"
tar = "0.4"
# Streaming zstd for cross-host cellular per-record artifact shipping (velo path).
# Already linked transitively by `parquet` (its `zstd` feature); declared directly
# so the streaming compress/decompress artifact-shipping module can `use zstd`
# WITHOUT the `parquet` feature (a lite runner ships artifacts too). Enabled by the
# `cellular` feature (the only path that ships bytes cross-host).
zstd = { version = "0.13", optional = true }
tokio-rustls = "0.26"
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["fs"] }
webpki-roots = "0.26"
# dynosim's Dynamo native deps are fetched from the upstream ai-dynamo/dynamo git
# repo at a pinned rev (no sibling checkout required). `dynamo-mocker` and
# `dynamo-kv-router` below share one rev; bump both together when moving the pin.
dynamo-mocker = { git = "https://github.com/ai-dynamo/dynamo.git", rev = "14e2cf76b04736e9b99412dfbe76cf1af45ae67a", package = "dynamo-mocker", optional = true, default-features = false }
# AIC timing bridge (feature `dynamo-aic-forward-pass`): the embedded-Python AIC
# runtime lives here in the consumer, not in the pure-Rust mocker.
dynamo-kv-router = { git = "https://github.com/ai-dynamo/dynamo.git", rev = "14e2cf76b04736e9b99412dfbe76cf1af45ae67a", package = "dynamo-kv-router", default-features = false, optional = true }
aiconfigurator-core = { git = "https://github.com/ai-dynamo/aiconfigurator.git", rev = "ffbab15797d3a3f14c382e937c0ab0c1c5cbc530", package = "aiconfigurator-core", features = ["embed-python"], optional = true }
pyo3 = { version = "0.23.4", features = ["auto-initialize"], optional = true }
parking_lot = "0.12"

# Dev-only deps carried over from the 16 absorbed crates' test suites. The
# monocrate's normal deps already cover most needs; these add the extra feature
# surface the integration tests require.
[dev-dependencies]
# Snapshot testing for the public definition-id contract (`definition_ids_snapshot`).
# `json` feature enables `assert_json_snapshot!`. CI must run with `INSTA_UPDATE=no`.
insta = { version = "1", features = ["json"] }
# Statistics-driven benchmark harness for the synthetic prompt generator
# (`benches/prompt_gen.rs`). Dev-only: the shipped runner links no criterion.
criterion = { workspace = true }
# Global allocator for the `weka_bench` example so its timings mirror the
# production `aiperf` binary (which installs mimalloc); the allocation-heavy
# recorded-trace lowering is sensitive to allocator throughput.
mimalloc = "0.1"
# Cross-language parity tests load committed JSON reference fixtures and digest
# token streams to compare against the Python reference generator.
serde_json = { workspace = true }
sha2.workspace = true
# transport-http integration tests stand up an in-process hyper server.
hyper = { version = "1.10", features = ["server", "http1", "http2"] }
# transport-grpc integration tests stand up an in-process Tonic server.
tonic = { workspace = true, features = ["server", "router", "codegen"] }
# grpc test servers wrap a TcpListener as a stream.
tokio-stream = { version = "0.1", features = ["net"] }
# Authoritative OTLP message decoder for the export::otel parity test. Test-only
# so the shipped runner links no OpenTelemetry SDK (the sink hand-writes its own
# minimal prost subset for encoding). `gen-tonic-messages` + `metrics` expose
# `opentelemetry_proto::tonic::collector::metrics::v1::ExportMetricsServiceRequest`.
opentelemetry-proto = { version = "0.31", default-features = false, features = ["gen-tonic-messages", "metrics"] }

# Explicit test targets for the transport-http integration suite, which lives in
# a `tests/transport_http/` subdirectory so the shared `common.rs` helper is a
# sibling module (`mod common;`) rather than an auto-discovered test binary.
# Flat `tests/*.rs` files (endpoints_*, graph_*, rng_*, timing_*,
# transport_grpc_*, extensions_*, and the pre-existing scheduled/online suites)
# are auto-discovered and need no explicit entry.
[[test]]
name = "transport_http_cancel"
path = "tests/transport_http/cancel.rs"

[[test]]
name = "transport_http_connect"
path = "tests/transport_http/connect.rs"

[[test]]
name = "transport_http_facade"
path = "tests/transport_http/facade.rs"

[[test]]
name = "transport_http_h2c"
path = "tests/transport_http/h2c.rs"

[[test]]
name = "transport_http_mock_smoke"
path = "tests/transport_http/mock_smoke.rs"

[[test]]
name = "transport_http_no_direct_time"
path = "tests/transport_http/no_direct_time.rs"

[[test]]
name = "transport_http_pool"
path = "tests/transport_http/pool.rs"

[[test]]
name = "transport_http_request"
path = "tests/transport_http/request.rs"

[[test]]
name = "transport_http_response_body_limits"
path = "tests/transport_http/response_body_limits.rs"

[[test]]
name = "transport_http_reuse"
path = "tests/transport_http/reuse.rs"

[[test]]
name = "transport_http_tls"
path = "tests/transport_http/tls.rs"

[[test]]
name = "streaming_feature_inventory"
path = "tests/streaming_feature_inventory.rs"
required-features = ["streaming"]

[[example]]
name = "velo_cell_spike"
path = "examples/velo_cell_spike.rs"
required-features = ["cellular"]

# Synthetic prompt generation throughput benchmark (criterion). `harness = false`
# hands `main()` to criterion instead of libtest. Run with `cargo bench -p
# aiperf-runtime --bench prompt_gen`.
[[bench]]
name = "prompt_gen"
path = "benches/prompt_gen.rs"
harness = false
