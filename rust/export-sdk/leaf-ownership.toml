#
# Ownership of every exporter source in the workspace.
#
# `classification` is one of:
#   host_adapter        - stays in `aiperf-runtime`; legacy registry, closed config,
#                         built-in ordering, and the compatibility adapters that call
#                         the split leaves. Never equality-copied into a candidate.
#   shared_sdk_helper   - the one implementation of a behavior several exporters share.
#                         Compiled once in `aiperf-export-sdk` and never copied into a
#                         candidate package.
#   plugin_leaf         - an exporter entrypoint a candidate package equality-copies.
#   package_internal_leaf - a source private to one candidate package: submodules,
#                         tests, and golden assets that travel with their entrypoint.
#
# `state = "present"` rows pin the post-split BLAKE3 of the exact bytes a later task
# equality-copies. `state = "planned"` rows name their final owner but are not yet
# pinned: the exporter source split has not reached them, so a digest recorded here
# would pin pre-split bytes. This file is reconciled with
# `plugin-conformance/candidate-source-inventory.toml`.

schema = "aiperf.export-leaf-ownership"
