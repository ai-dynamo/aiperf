[package]
name = "aiperf-e2e-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Full-stack e2e tests: aiperf-mock-server + python -m aiperf profile."

[dev-dependencies]
aiperf-runtime = { path = "../runtime" }
aiperf-mock-server = { path = "../mock-server" }
# Freshness insurance only: this builds aiperf-cli's *lib* target, so `cargo test`
# recompiles the CLI's own code when it changes. It does NOT build the `aiperf`
# `[[bin]]` — cargo does not build a dependency's binaries for a dependent, and
# `CARGO_BIN_EXE_aiperf` is only defined for bins in this same package. The
# harness therefore still resolves the binary by path and asserts it is not stale.
aiperf-cli = { path = "../cli" }
# Read back the per-record `profile_export.parquet` sidecar in the e2e that
# enables `artifacts.records: [jsonl, parquet]`. Same workspace versions the
# `aiperf` parquet sink links.
arrow = { workspace = true }
parquet = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
# Authoritative OTLP message decoder for the export::otel e2e, mirroring
# `runtime/Cargo.toml`'s test-only use. Decoding with an independent
# implementation is the point: the sink hand-writes its own minimal prost subset
# for encoding, so a bug shared between writer and reader could not be caught by
# round-tripping through that same subset.
opentelemetry-proto = { version = "0.31", default-features = false, features = [
  "gen-tonic-messages",
  "metrics",
] }
prost = { workspace = true }
tempfile = "3"
glob = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
sha2.workspace = true

# POSIX-signal delivery to the spawned `aiperf` child (SIGINT graceful-cancel
# tests). Unix-only: `nix` does not build on windows-msvc, so gate it and stub
# the two signal helpers on non-unix (the e2e suite is unix-oriented anyway —
# it drives `python -m aiperf profile` over POSIX signals).
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29", features = ["signal", "process"] }
