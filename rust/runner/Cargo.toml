[package]
name = "aiperf-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Versioned single-benchmark subprocess runner for the Python AIPerf orchestrator."

[features]
# DynoSim ships in the default runner: the product wire (`aiperf profile
# --config dynosim_*`) needs the runner to advertise the dynosim transports, and
# a plain `cargo build -p aiperf-runner` producing a non-dynosim binary was a
# recurring footgun (a stale default build silently drops the transport). This
# requires the sibling `dynamo-aiperf-native/lib/mocker` checkout at build time.
default = ["dynosim", "parquet", "velo"]
# The runner is the only native executable, so every optional AIPerf/Dynamo
# composition feature must terminate here rather than requiring another binary.
dynosim = ["aiperf/dynosim"]
# Server-metrics Parquet + public `.parquet` reader (arrow/parquet, ~2.6 MiB of
# `.text`). In the default (full) runner; a lite/online-only build via
# `--no-default-features` drops it. Forwarded to the library gate.
parquet = ["aiperf/parquet"]
dynamo-router-runtime = ["dynosim", "aiperf/dynamo-router-runtime"]
dynamo-zmq-events = ["dynosim", "aiperf/dynamo-zmq-events"]
dynamo-kvbm-offload = ["dynosim", "aiperf/dynamo-kvbm-offload"]
dynamo-aic-forward-pass = ["dynosim", "aiperf/dynamo-aic-forward-pass"]
dynamo-profile = ["dynosim", "aiperf/dynamo-profile"]
dynamo-full = [
    "dynamo-router-runtime",
    "dynamo-zmq-events",
    "dynamo-kvbm-offload",
    "dynamo-aic-forward-pass",
    "dynamo-profile",
]
dynamo-parity = ["dynamo-full", "aiperf/dynamo-parity"]
# Cellular cross-host cell transport over ai-dynamo/velo. Gates the velo
# controller/cell path; in the default build. A lean `--no-default-features`
# runner drops it: `cells=1` is byte-unchanged and `cells>1` fails closed.
velo = ["aiperf/velo"]

[dependencies]
# Declared directly (not via workspace inheritance) so the runner can opt out of
# aiperf's default features and re-enable them per runner feature — this is what
# lets `--no-default-features` produce a lite build that drops parquet/dynosim.
aiperf = { path = "../aiperf", default-features = false }
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
blake3.workspace = true
bytes.workspace = true
csv.workspace = true
loadgen-core.workspace = true
libmimalloc-sys.workspace = true
mimalloc = "0.1"
regex.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
http = "1"
http-body-util = "0.1"
hyper = { version = "1.10", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prost.workspace = true
rustls = "0.23"
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
tokio-rustls = "0.26"
tonic = { workspace = true, features = ["server", "router", "codegen"] }

[build-dependencies]
cc = "1"
