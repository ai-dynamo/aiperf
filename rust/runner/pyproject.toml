# Source-built companion wheel for AIPerf's native runner.
#
# This distribution compiles the `aiperf-runner` executable from source with
# maturin at wheel-build time (`maturin build` / `pip wheel` / `uv build` invoke
# cargo directly), so a working Rust toolchain is required on the build host. The
# resulting wheel is platform-specific and installs the single native binary into
# the environment's scripts directory — no Python package, extension module, or
# launcher is included. The distribution is named `aiperf-runner` because the
# Python frontend discovers the executable by that distribution name through its
# installed wheel RECORD (src/aiperf/orchestrator/runner_installation.py).

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "aiperf-runner"
version = "0.11.0"
description = "Source-built native AIPerf single-run executor (aiperf-runner)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "NVIDIA Inc.", email = "sw-dl-dynamo@nvidia.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
]

[tool.maturin]
# Compile this crate's `aiperf-runner` binary and place its executable in the
# wheel's scripts scheme. There is no Python module to import. The pyproject is
# co-located with Cargo.toml (ai-dynamo's layout: lib/bindings/python/), so the
# manifest path is relative to this directory.
bindings = "bin"
manifest-path = "Cargo.toml"
# Build the optimized image; per-request allocation churn dominates the hot path.
profile = "release"
strip = true
# The wheel is built with the crate's default features, which include `dynosim`
# — so the published runner ships the offline/online Dynamo replay transports.
# That requires the sibling `dynamo-aiperf-native/lib/mocker` checkout adjacent
# to this repo at build time (see Cargo.toml's relative path dependency); the
# container build clones it (Dockerfile), matching how ai-dynamo stages its
# external native deps. To build an online-only runner without that checkout,
# pass `--no-default-features` on the maturin command line.
