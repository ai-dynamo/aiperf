[package]
name = "aiperf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Rust front door for AIPerf; owns `aiperf profile` (single run)."

[lib]
name = "aiperf_cli"
path = "src/lib.rs"

[[bin]]
name = "aiperf"
path = "src/main.rs"

[dependencies]
aiperf = { path = "../aiperf", default-features = false, features = ["runner-protocol"] }
anyhow.workspace = true
clap = { version = "4", features = ["derive", "string"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"
