[package]
name = "aiperf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Rust entry point for AIPerf; owns `aiperf profile` (single run)."

[lib]
name = "aiperf_cli"
path = "src/lib.rs"

[[bin]]
name = "aiperf"
path = "src/main.rs"

[features]
# The `aiperf` binary is BOTH the entry point and the execution engine: it
# re-execs itself (`aiperf --execute`) over the protocol-v2 stdio seam for each
# run/probe/cell. `grpc` (native gRPC transport) and `cellular` (`--cells N`
# multi-process, carried over the `velo` git dependency — no sibling needed) are
# default; only `dynosim` (needs the sibling checkout) is opt-in. `cargo build -p
# aiperf-cli` and the shipped wheel — built with
# `--features parquet`, which does NOT disable defaults — keeps it; a lean
# HTTP-only binary drops it with `--no-default-features`. The Makefile builds the
# wheel binary with the feature set an image needs (default: `parquet`).
default = ["grpc", "cellular"]

# Base: embed a CPython interpreter (pyo3 `auto-initialize`). Enables in-process
# delegation of every non-profile/config subcommand (chat/plot/plugins/service/
# synthesize/analyze-trace/…) through `aiperf.entrypoint.main` — ZERO subprocess
# shell-out. OFF by default so the shipped lean binary stays Python-free (those
# subcommands then fall back to a `python -m aiperf` subprocess).
pyo3-embed = ["dep:pyo3"]
# Opt-in scipy/optuna numerical seam for the dynamic search styles
# (`--search-style smooth_isotonic|bo|optuna`). Implies `pyo3-embed`, so the
# search build also gets in-process subcommand delegation (fully shell-out-free).
search-pyo3 = ["pyo3-embed"]

# Execution features, forwarded to the `aiperf` library. Previously the default
# feature set of the former runner crate. `dynosim` requires the
# sibling `dynamo-aiperf-native/lib/mocker` checkout at build time.
dynosim = ["aiperf-runtime/dynosim"]
# Native gRPC transport (Tonic). A first-class transport over the same registry
# seam as http/dynosim; in the `default` set. A lean HTTP-only binary drops it
# (`--no-default-features`), which unregisters the `grpc` transport and its Riva
# /KServe-gRPC execution path. Sibling-free.
grpc = ["aiperf-runtime/grpc"]
# Server-metrics Parquet + public `.parquet` reader (arrow/parquet). Sibling-free.
parquet = ["aiperf-runtime/parquet"]
# Cellular cross-host cell transport (over the `velo` messaging framework). Gates
# the controller/cell/aggregator re-exec path; `cells=1` is byte-unchanged and
# `cells>1` fails closed without it. In the default set.
cellular = ["aiperf-runtime/cellular"]
dynamo-router-runtime = ["dynosim", "aiperf-runtime/dynamo-router-runtime"]
dynamo-zmq-events = ["dynosim", "aiperf-runtime/dynamo-zmq-events"]
dynamo-kvbm-offload = ["dynosim", "aiperf-runtime/dynamo-kvbm-offload"]
dynamo-aic-forward-pass = ["dynosim", "aiperf-runtime/dynamo-aic-forward-pass"]
dynamo-profile = ["dynosim", "aiperf-runtime/dynamo-profile"]
dynamo-full = [
    "dynamo-router-runtime",
    "dynamo-zmq-events",
    "dynamo-kvbm-offload",
    "dynamo-aic-forward-pass",
    "dynamo-profile",
]
dynamo-parity = ["dynamo-full", "aiperf-runtime/dynamo-parity"]
# Convenience: the full execution surface (sibling required).
full = ["dynosim", "parquet", "cellular", "grpc"]

[dependencies]
aiperf-runtime = { path = "../runtime", default-features = false, features = ["engine"] }
anyhow.workspace = true
clap = { version = "4", features = ["derive", "string"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
serde_yaml = "0.9"
chrono = { workspace = true }
uuid = { version = "1", features = ["v4"] }
tracing.workspace = true
regex.workspace = true
minijinja = { version = "2.21", features = ["json"] }
# mimalloc as the global allocator for the unified `aiperf` binary: the execution
# hot path's per-request allocation churn was the top profiled hotspot (moved here
# from the former runner crate). `libmimalloc-sys` exposes the experimental
# option constants the arena-preinit C shim (build.rs) resolves.
mimalloc = "0.1"
libmimalloc-sys.workspace = true
# Async streaming HTTP client for the native `chat` subcommand (hyper, matching
# the transport stack — no reqwest so loopback is never proxied). `rt-multi-thread`
# also backs the `--cell`/`--aggregator` envelope-fetch runtimes in `execute_mode`.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "io-util", "net", "time"] }
hyper = { version = "1.10", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures = "0.3"
# TLS for `chat` https endpoints (mirrors the runner's transport-http / otel TLS:
# tokio-rustls + webpki roots).
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "0.26"
# Parse the in-cluster Kubernetes CA PEM for the native `aiperf controller` CR
# reporter (`crate::k8s`).
rustls-pemfile = "2"
# Embedding (not extension-module): `auto-initialize` starts a CPython
# interpreter inside the native binary so the search planners can call the exact
# scipy/optuna numerical primitives. Optional + feature-gated (see `search-pyo3`).
pyo3 = { version = "0.23", features = ["auto-initialize"], optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[build-dependencies]
# Compiles the typed bridge to libmimalloc-sys experimental option constants
# (src/mimalloc_options.c), moved from the former runner crate.
cc = "1"

[dev-dependencies]
tempfile = "3"
# The relocated `aiperf --execute` stdio integration tests (from the deleted
# former runner crate) spin up in-process mock servers. hyper/hyper-util/rustls/
# tokio-rustls/http-body-util are already normal deps above; their `server`/http2
# features union in for the dev build.
axum.workspace = true
http = "1"
hyper = { version = "1.10", features = ["server", "http1", "http2"] }
prost.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { workspace = true, features = ["server", "router", "codegen"] }
async-trait.workspace = true
base64.workspace = true
url.workspace = true
