[workspace]
resolver = "3"
# The 16 aiperf-* library crates were absorbed into `rust/aiperf`. There is no
# separate runner executable: `rust/cli` (binary `aiperf`) is now
# BOTH the entry point and the execution engine, re-execing itself (`aiperf
# --execute`) over the protocol-v2 stdio seam for each run/probe/cell.
members = [
    "runtime",
    "cli",
    "mock-server",
    "e2e-tests",
    "dry-run-tests",
    # Standalone benchmark-comparison utilities (logproxy, sagemaker-logproxy, ...)
    # with no dependency on aiperf-runtime or aiperf-mock-server, so they build
    # instantly regardless of aiperf's own build state.
    "bench-tools",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# internal crates
aiperf-runtime = { path = "runtime" }

# external (shared versions)
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
criterion = { version = "0.5", features = ["html_reports"] }
bitflags = "2"
blake3 = "1"
bytes = "1"
chrono = "0.4"
csv = "1"
futures = "0.3"
half = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
itoa = "1"
libc = "0.2"
libmimalloc-sys = { version = "=0.1.49", features = ["extended"] }
# Tokenization + chat-template rendering come from NVIDIA's ai-dynamo/frontend-crates
# (https://github.com/ai-dynamo/frontend-crates). `dynamo-tokenizers` wraps HF
# `tokenizers` (byte-exact token ids); `dynamo-renderer` renders chat templates
# (minijinja over `tokenizer_config.json`). HF-hub download lives in `dataset::hf_hub`.
dynamo-tokenizers = "1.5.3"
dynamo-renderer = "1.3.12"
# Direct dep, introspection only: `dynamo-tokenizers` hides vocab size / token->id,
# which raw-prompt generation and special-token accounting need. Version tracks
# `dynamo-tokenizers`' pin so the compiled `tokenizers` crate unifies to one build.
tokenizers = { version = "0.21", default-features = false, features = ["onig", "esaxx_fast"] }
# HuggingFace hub tokenizer download. `dynamo-tokenizers` already pulls `hf-hub`
# transitively (via `fastokens`) on its blocking `ureq` backend; depending on it
# directly with the SAME features unifies to one compiled `hf-hub`/`ureq` build and
# links NO second async HTTP/TLS stack (`reqwest`/`native-tls` stay out of the
# product graph). Gives retry/backoff, xet-CDN 302, `~/.cache/huggingface` reuse,
# and `HF_HUB_OFFLINE`/`HF_TOKEN` handling for free.
hf-hub = { version = "0.4.3", default-features = false, features = ["rustls-tls", "ureq"] }
percent-encoding = "2"
petgraph = "0.6"
arrow = { version = "58.3", default-features = false }
parquet = { version = "58.3", default-features = false, features = ["arrow", "json", "snap", "zstd"] }
rand = "0.9"
rand_distr = "0.5"
rand_pcg = "0.9"
rayon = "1"
regex = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallvec = { version = "1", features = ["serde"] }
tiktoken-rs = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tonic = { version = "0.14.6", default-features = false, features = ["channel", "tls-ring", "tls-webpki-roots"] }
prost = "0.14.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

# Plain `cargo build --release`/`--release -p <crate>` uses cargo's stock
# release defaults (opt-level=3, lto=false, codegen-units=16) — fast to build,
# for local iteration and non-shipped crates. Shipped product binaries
# (aiperf-cli, aiperf-mock-server) build via the `optimized` profile below
# instead, via `make native-cli`/`bundle-cli`/`mock-server-native`.

# Whole-program-optimized profile for the actual shipped product binaries.
# `cargo build --profile optimized -p aiperf-cli`/`aiperf-mock-server`.
# Artifacts land in `target/optimized/`, not `target/release/`.
[profile.optimized]
inherits = "release"
lto = "fat"
codegen-units = 1
# The shipped binary is what `make wheel` injects, so its symbol table rides
# along in the wheel. `strip = "debuginfo"` recovers almost nothing (the weight
# is the symtab, not debug sections); "symbols" drops ~8 MB of binary and ~3 MB
# of compressed wheel. Cost: panic backtraces from a packaged build show
# addresses, not frame names — reproduce under `--release` to get names back.
strip = "symbols"

# For standalone debug/benchmark-comparison utilities, not shipped product
# binaries: `cargo build --profile bench-tools -p aiperf-bench-tools`. Same as
# plain `--release` today (kept as an explicit named profile so it stays fast
# even if `[profile.release]` itself is ever tightened again).
[profile.bench-tools]
inherits = "release"
lto = false
codegen-units = 16
