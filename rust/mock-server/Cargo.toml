[package]
name = "aiperf-mock-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "High-throughput OpenAI-compatible mock inference server for AIPerf integration tests and benchmarks."

[[bin]]
name = "aiperf-mock-server"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# The mock server reuses `aiperf_runtime::transport::grpc::{proto,riva_proto,
# riva_binding}` for its KServe OIP v2 / Riva gRPC listeners, so it always needs
# the `grpc` feature even if a future build drops it from the workspace default.
aiperf-runtime = { workspace = true, features = ["grpc"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Native KServe OIP v2 gRPC target. The `server` feature adds tonic's h2/hyper
# server plane on top of the workspace's client-only feature set; the KServe
# prost message types are reused from `aiperf_runtime::transport_grpc::proto` (no
# build-time protoc / tonic-build anywhere in the workspace).
tonic = { workspace = true, features = ["server"] }
prost = { workspace = true }
http = "1"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
parking_lot = "0.12"
# Global allocator for the `aiperf-mock-server` binary. Under saturating load
# the request hot path is allocation-heavy (per-request request-id/model/content
# strings, response buffers, hyper framing) across all worker threads; profiling
# showed glibc malloc's arena locking as ~28% of server CPU. mimalloc's
# per-thread heaps remove that contention. Matches the main `aiperf` binary.
mimalloc = "0.1"
futures = { workspace = true }
bytes = { workspace = true }
blake3 = { workspace = true }
axum = { workspace = true, features = ["macros", "multipart", "ws"] }
tokio-tungstenite = { workspace = true }
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
# `client-legacy` adds the pooled HTTP client used by `--fetch-content-urls` to
# GET `image_url`/`video_url` targets; the rest drives the listener stack.
hyper-util = { version = "0.1", features = ["server", "client-legacy", "http1", "http2", "tokio"] }
# Drains fetched response bodies (`BodyExt::collect`) and supplies the empty
# request body for content-URL GETs.
http-body-util = "0.1"
base64 = "0.22"
blake2 = "0.10"
once_cell = "1"
uuid = { version = "1", features = ["v4", "fast-rng"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
prometheus = { version = "0.14", default-features = false }
async-stream = "0.3"
dashmap = "6"
socket2 = { version = "0.5", features = ["all"] }
num_cpus = "1"
libc = "0.2"
# TLS/HTTPS + grpcs listener stack. rustls (aws-lc-rs provider, selected
# explicitly to match the runner's HTTP client in
# `aiperf_runtime::transport_http::client::connection`) + tokio-rustls for the accept
# loop; rustls-pemfile parses `--tls-cert`/`--tls-key` PEM; rcgen mints an
# in-memory self-signed cert for `--tls-self-signed`. All versions are already
# resolved transitively in the workspace `Cargo.lock` (rustls 0.23,
# tokio-rustls 0.26, rustls-pemfile 2, rcgen 0.13 via its default `ring` crypto).
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
rcgen = "0.13"

# HTTP/1.1 request framing for the alternative hand-rolled engines (--blocking,
# --uring). Small and already present transitively via hyper.
httparse = "1"
# io_uring thread-per-core engine (`--uring`), gated so the default build keeps
# only the tokio/hyper stack. monoio brings the io_uring driver.
monoio = { version = "0.2", features = ["iouring"], optional = true }

[features]
uring = ["dep:monoio"]

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { workspace = true, features = ["full", "test-util"] }
futures = { workspace = true }

[[example]]
name = "loadgen"
path = "examples/loadgen.rs"
