[package]
name = "aiperf-mock-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "High-throughput OpenAI-compatible mock inference server for AIPerf integration tests and benchmarks."

[[bin]]
name = "aiperf-mock-server"
path = "src/main.rs"

# Passthrough logging HTTP proxy for benchmark comparisons: forwards every
# request byte-for-byte to `UPSTREAM` and streams the response back without
# buffering (so SSE/chunked responses pass through live), logging per-request
# TTFB/first-data-chunk/total-duration/byte-count. Used to give multiple
# client tools (aiperf, locust, ...) an identical, independently-logged view
# of the same upstream server for apples-to-apples benchmark comparisons.
[[bin]]
name = "logproxy"
path = "src/bin/logproxy.rs"

# Like `logproxy`, but also translates between the AWS SageMaker Runtime
# `InvokeEndpoint`/`InvokeEndpointWithResponseStream` wire protocol and a
# plain OpenAI-compatible chat completions backend, so aiperf's/locust's
# `--transport sagemaker` request path can be exercised end-to-end against
# a non-SageMaker vLLM server for testing.
[[bin]]
name = "sagemaker-logproxy"
path = "src/bin/sagemaker_logproxy.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# The mock server reuses `aiperf_runtime::transport::grpc::{proto,riva_proto,
# riva_binding}` for its KServe OIP v2 / Riva gRPC listeners, so it always needs
# the `grpc` feature even if a future build drops it from the workspace default.
aiperf-runtime = { workspace = true, features = ["grpc"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Native KServe OIP v2 gRPC target. The `server` feature adds tonic's h2/hyper
# server plane on top of the workspace's client-only feature set; the KServe
# prost message types are reused from `aiperf_runtime::transport_grpc::proto` (no
# build-time protoc / tonic-build anywhere in the workspace).
tonic = { workspace = true, features = ["server"] }
prost = { workspace = true }
http = "1"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
parking_lot = "0.12"
futures = { workspace = true }
bytes = { workspace = true }
axum = { workspace = true, features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
# `client-legacy` adds the pooled HTTP client used by `--fetch-content-urls` to
# GET `image_url`/`video_url` targets; the rest drives the listener stack.
hyper-util = { version = "0.1", features = ["server", "client-legacy", "http1", "http2", "tokio"] }
# Drains fetched response bodies (`BodyExt::collect`) and supplies the empty
# request body for content-URL GETs.
http-body-util = "0.1"
base64 = "0.22"
blake2 = "0.10"
once_cell = "1"
uuid = { version = "1", features = ["v4", "fast-rng"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
prometheus = { version = "0.13", default-features = false }
async-stream = "0.3"
dashmap = "6"
socket2 = { version = "0.5", features = ["all"] }
num_cpus = "1"
libc = "0.2"
# TLS/HTTPS + grpcs listener stack. rustls (aws-lc-rs provider, selected
# explicitly to match the runner's HTTP client in
# `aiperf_runtime::transport_http::client::connection`) + tokio-rustls for the accept
# loop; rustls-pemfile parses `--tls-cert`/`--tls-key` PEM; rcgen mints an
# in-memory self-signed cert for `--tls-self-signed`. All versions are already
# resolved transitively in the workspace `Cargo.lock` (rustls 0.23,
# tokio-rustls 0.26, rustls-pemfile 2, rcgen 0.13 via its default `ring` crypto).
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
rcgen = "0.13"
# `logproxy` bin only: streams proxied response bodies frame-by-frame through
# an mpsc channel without buffering the whole body.
tokio-stream = "0.1"
# `sagemaker-logproxy` bin only: CRC32 (IEEE 802.3) checksums for AWS
# `application/vnd.amazon.eventstream` binary frame encoding/decoding.
# Already resolved in the workspace Cargo.lock (pulled in transitively).
crc32fast = "1"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { workspace = true, features = ["full", "test-util"] }
futures = { workspace = true }

[[example]]
name = "loadgen"
path = "examples/loadgen.rs"
