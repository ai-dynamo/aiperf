[package]
name = "aiperf-integration-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Full-stack integration tests: aiperf-mock-rs + python -m aiperf profile."

[dev-dependencies]
aiperf = { path = "../aiperf" }
aiperf-mock-rs = { path = "../mock-rs" }
axum = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
tempfile = "3"
nix = { version = "0.29", features = ["signal", "process"] }
glob = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
